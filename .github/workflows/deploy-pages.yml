name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # weekly archive run on Sundays at 03:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # The browser suites are on demand (see tests/run-all.js) — they cost minutes, most
    # of it tests/voices.js rendering every preset in the catalogue, and they are run by
    # hand with `npm run test:all` when the engine's sound is what changed.
    #
    # So nothing you TRIGGER waits for them: a push and a manual run both take the fast
    # gate and deploy in about a minute. Only the weekly scheduled run pays the full
    # price, which keeps a browser-side regression from sitting undiscovered forever
    # without ever standing between you and a deploy you asked for.
    env:
      FULL_TESTS: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # archive index resolves the subject of every past release

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm ci` installs the playwright package but NOT its browsers, so the runner has
      # no chrome-headless-shell to launch. Only fetched for the full run — a push never
      # opens a browser, so it should not spend a minute downloading one.
      - name: Cache Playwright browsers
        if: env.FULL_TESTS == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Playwright pins its browser build to the package version, so the lockfile
          # is the cache key: bumping playwright fetches a matching browser.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Chromium alone — the renderer never asks for the other two. Re-run even on a
      # cache hit: the download no-ops, and the system libraries it pulls in are not
      # part of the cached directory.
      - name: Install Chromium
        if: env.FULL_TESTS == 'true'
        run: npx playwright install --with-deps chromium

      - name: Test
        if: env.FULL_TESTS != 'true'
        run: npm test

      - name: Test (including browser suites)
        if: env.FULL_TESTS == 'true'
        run: npm run test:all

      - name: Build
        run: npm run build
        env:
          MASH_TELEMETRY_URL: ${{ secrets.MASH_TELEMETRY_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Keep archive snapshots for occasional manual or scheduled runs only.
      # Normal pushes to main will still deploy without generating extra commits.
      - name: Archive published build
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          npm run archive
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add releases
          git diff --staged --quiet && echo 'nothing to archive' && exit 0
          git commit -m "Archive published build ${GITHUB_SHA::7}"
          git push origin HEAD:main

      # The gallery is a visual record, so it only earns a snapshot when the art
      # itself moves. Gating on these paths keeps galleries/ occasional rather
      # than one ~230KB copy per push, the way releases/ works.
      - name: Check for art changes
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        id: art
        run: |
          BASE='${{ github.event.before }}'
          # workflow_dispatch has no before-SHA, and a branch's first push
          # reports all-zeros. Either way there is no diff base -- snapshot
          # rather than silently skip, so a manual run is also the escape hatch.
          if [ -z "$BASE" ] || [ "$BASE" = "$(printf '0%.0s' $(seq 40))" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'no usable diff base -- archiving'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" -- \
            src/sprites src/engine/stylePacks src/engine/sprites.js \
            src/game/draw.js src/game/entities.js src/game/plugs.js \
            src/data/cabinets.js tools/gallery-entry.js tools/gallery-shell.html)
          if [ -n "$CHANGED" ]; then
            echo "art changed:"; echo "$CHANGED"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'no art changes -- skipping gallery snapshot'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Archive asset gallery
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && steps.art.outputs.changed == 'true'
        run: |
          npm run gallery
          npm run archive:gallery
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add galleries
          git diff --staged --quiet && echo 'nothing to archive' && exit 0
          git commit -m "Archive asset gallery ${GITHUB_SHA::7}"
          git push origin HEAD:main
