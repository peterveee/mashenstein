<!doctype html>
<meta charset="utf-8">
<title>MASHENSTEIN — Song Mixer</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --panel2: #24282f; --line: #333944;
    --ink: #e6e9ef; --dim: #8b93a3; --accent: #4ec9b0; --hot: #e5534b;
    --selected-ink: #fff; --lane-ink: #fff; --on-primary: #fff;
    --hover: #313a47; --primary: #2f4a44; --input: #1b2129; --cell: #23272e;
    /* Sliders are the bulk of the surface — 200 of them in teal made the accent
       read as the background rather than as meaning. They go slate; teal is kept
       for things that are ON, SELECTED or MOVING. */
    --ctl: #79839a; --ctl-hi: #9aa5bd;
    /* The bar ruler and the arrangement rows must share one geometry or the
       columns do not line up. Both inset by the gutter plus the name column. */
    /* The name column is also the master's column, the track-group filters' column, and
     now the piano roll's keyboard — wide enough for all of them, which the lane names
     were glad of too: at 170 "Lead-Harmony" and "Hats-Closed" were both cut off, and at
     212 the wider lane-number column was taking its room back out of them again.
     Everything that starts where the bars start is written off this one expression —
     gutter plus name column plus gap — so widening it moves the whole content line and
     nothing drifts off it. */
  --gut: 12px; --arrname: 236px; --namegap: 6px; --arrrow: 26px; --stripw: 118px;
    /* Where the bars, the strips, the group filters and the roll's note field all begin.
       It was written out longhand in seven places, which is six chances for one of them
       to be a pixel out. */
    --contentx: calc(var(--gut) + var(--arrname) + var(--namegap));
    /* The desk's SECOND left edge, and the one most of the panel content sits on: the
       line the captions start at, one fold button and one gap in from the margin.
       TIMELINE, ARRANGEMENT, MIXER and EFFECTS all begin here, so the things those
       panels put in their name column begin here too — the master strip, the mute/solo
       pair on a lane, the first effect card, the roll's keyboard. The content line
       (--contentx) is a different thing: it is where the BARS start, and only what has
       to agree with the bar ruler belongs on it. */
    --capgap: 8px;
    --capx: calc(var(--foldx) + var(--ctlh) + var(--capgap));
    /* The RIGHT margin, which is not the same number as the left column's gutter and
       had been sharing it. --gut is load-bearing on the left — it is part of the name
       column's width, so widening it to give the desk air on the right moved every
       bar in the ruler. This one is only ever the far edge: the ruler's right end, the
       panel headers' right padding, the last strip and the last effect card. Raise it
       and the whole right side breathes; nothing on the left moves. */
    --rgut: 20px;
    /* Where the fold column starts. It used to be the gutter plus four, which put the
       chevrons a fifth of the name column in from the edge — far enough that the four
       of them read as indented rather than as the desk's left margin. Everything that
       lines up with them (the lane numbers, the caption width) is written off this,
       so moving it moves the column and nothing else.
       It is now the header's own padding, so the four chevrons run down the same line
       as the hamburger above them — the desk has one left margin, not two six pixels
       apart, which read as the panels having slipped out from under the header. */
    --foldx: 12px;
    /* One control height for the whole desk, not just the header. It was set on `header`,
       which meant the panel folds underneath could not reach it and were sized by hand at
       22 — a smaller square than the hamburger, on the same line, which is the one place
       a difference in size reads as a mistake rather than as a hierarchy. The fold column
       is now exactly as wide as the button that starts it, and so is the lane-number
       column under it. */
    --ctlh: 30px; --ctlicon: 17px;
    --solo: #d9a441;
    /* The limiter is the one switch on the desk that is not teal when it is on. Teal
       is every other ON, and this one is different in kind: it is the only control
       that changes what leaves the desk rather than what happens inside it. Not red
       and not amber either — those are mute and solo, on every strip. */
    --lim: #a06ee0;
    /* Green means go, and only that: the transport's play button. */
    --go: #3fb950;
    /* Fader height is the desk's shock absorber: when the window is short the
       fader gives up pixels so the EQ and send rows above it stay on screen.
       fitStrips() measures the rack and overwrites this; the clamp is what you
       get before the first measurement. */
    --faderh: clamp(56px, 15vh, 150px);
    /* A parameter row is a readout line with a control under it, and --rowh is what
       those two come to. Named rather than left implicit because a row that is built
       some other way still has to stand exactly this tall: the delay's TIME is a
       slider when it is free and a select when it is synced, and when the two came
       out different heights, ticking Tempo Mode shunted every row under it up the
       card. Composed from the pieces, so a change of typeface moves both together. */
    --rowval: 10.5px; --rowlh: 1.3; --rowctl: 14px;
    --rowline: calc(var(--rowval) * var(--rowlh));
    --rowh: calc(var(--rowline) + var(--rowctl));
    /* Overwritten by the Font picker in the header, which only offers typefaces
       that are actually installed. */
    --font: ui-monospace, SFMono-Regular, Menlo, monospace;

    /* ---- the ramp ------------------------------------------------------------
       Below here nothing is a colour of its own: every value is a point mixed off
       the anchors above it. The desk used to carry about two hundred hardcoded
       slate hexes — Midnight's ramp, written out longhand — which is why the other
       themes kept a black toolbar, lost their grid lines and stayed teal in a
       hundred small places. A theme sets the anchors and gets the rest for free,
       and adding a theme is now nine values rather than an audit.

       The pairs are (deeper, brighter): --bg and --ink are the two ends, so a light
       theme inverts the whole ramp with no per-theme work. */
    /* Recesses. Deeper than --bg, which on paper as well as on slate means darker —
       a light desk sinks a well by shading it, not by bleaching it. */
    --deep: color-mix(in srgb, var(--bg) 88%, #000);
    --well: color-mix(in srgb, var(--bg) 25%, var(--panel));
    /* Raised chrome: the transport and loop trays, and the keys inside them. */
    --tray: color-mix(in srgb, var(--panel2) 75%, var(--line));
    --traybtn: var(--line);
    --traybtn-hi: color-mix(in srgb, var(--line) 88%, var(--ink));
    /* Three weights of hairline. --seam is quieter than --line, --line2 is the
       border of something raised off the panel, and --grid is a rule you are meant
       to read a position off, which is why it is the brightest of the three. */
    --seam: color-mix(in srgb, var(--line) 82%, var(--bg));
    --line2: color-mix(in srgb, var(--line) 94%, var(--ink));
    --grid: color-mix(in srgb, var(--line) 90%, var(--ink));
    --grid-hi: var(--dim);
    /* Quieter than --dim, for units and costs and counts. Quiet is not the same as
       unreadable: both of these are mixed toward the panel rather than away from
       the ink, so they stay on the legible side of --dim in every theme. */
    --faint: color-mix(in srgb, var(--dim) 62%, var(--panel));
    --faintest: color-mix(in srgb, var(--dim) 38%, var(--panel));
    /* A signal's border and its wash. Three signals, the same two jobs each. */
    --accent-line: color-mix(in srgb, var(--accent) 30%, var(--line));
    --accent-wash: color-mix(in srgb, var(--accent) 14%, var(--panel));
    --solo-line: color-mix(in srgb, var(--solo) 26%, var(--line));
    --solo-wash: color-mix(in srgb, var(--solo) 13%, var(--panel));
    --hot-line: color-mix(in srgb, var(--hot) 26%, var(--line));
    --hot-wash: color-mix(in srgb, var(--hot) 13%, var(--panel));
    /* The ink you write ON a lit plate. This is the one thing the ramp cannot
       derive, because it depends on whether the theme's accent is light or dark —
       Light Paper's accent is a dark teal, and dark lettering on it is a black
       button. Every theme states it; only the light ones flip it. */
    --on-accent: #10231f; --on-solo: #241a05; --on-go: #08210f; --on-lim: #180f28;
    /* The piano roll shades a black-key row and an off-scale row by darkening it, and
       highlights a hover by lightening it. Both are a fixed amount of black or white
       here, which is right on slate and a bank of grey stripes on paper — a light desk
       needs a fraction of it to say the same thing. */
    --rowshade: color-mix(in srgb, #000 22%, transparent);
    --rowshade-off: color-mix(in srgb, #000 30%, transparent);
    --rowhover: color-mix(in srgb, #fff 1.8%, transparent);
    --cellhover: color-mix(in srgb, #fff 5%, transparent);
  }
  :root[data-mixer-theme="amber"] {
    --bg: #17120d; --panel: #241b12; --panel2: #302217; --line: #5a4125;
    --ink: #f8ead2; --dim: #b79b74; --accent: #f0b84f; --hot: #ef6b5b;
    --hover: #493522; --primary: #4a3321; --input: #21170e; --cell: #30261b;
    --ctl: #9b8569; --ctl-hi: #d0b28a; --solo: #e0a03c;
    --on-accent: #2a1d06;
  }
  :root[data-mixer-theme="ocean"] {
    --bg: #0d1720; --panel: #122330; --panel2: #183142; --line: #284b60;
    --ink: #dceef5; --dim: #7fa5b8; --accent: #66d9ef; --hot: #ff7a8a;
    --hover: #24485a; --primary: #1e4b54; --input: #0d1d27; --cell: #1c3541;
    --ctl: #7392a8; --ctl-hi: #a9c9d8; --solo: #e9bd62;
    --on-accent: #062028;
  }
  :root[data-mixer-theme="plum"] {
    --bg: #17121d; --panel: #21182b; --panel2: #2d2038; --line: #4c385d;
    --ink: #f1e7fa; --dim: #aa94bb; --accent: #dca7ff; --hot: #ff7e9a;
    --hover: #493154; --primary: #4b2e53; --input: #211728; --cell: #33253b;
    --ctl: #9f89ae; --ctl-hi: #c9b3d5; --solo: #e1b55e;
    --on-accent: #22103a;
  }
  :root[data-mixer-theme="light"] {
    --bg: #eef1f4; --panel: #ffffff; --panel2: #e2e7ec; --line: #c6cfd8;
    --ink: #26313b; --dim: #687684; --accent: #147f78; --hot: #c84d4d;
    --hover: #d5e2e6; --primary: #c8e3df; --input: #f7f9fa; --cell: #e8edf0;
    --ctl: #71808d; --ctl-hi: #536573; --solo: #b47a16;
    --selected-ink: #26313b; --lane-ink: #24343b; --on-primary: #26313b;
    --rowshade: color-mix(in srgb, var(--ink) 8%, transparent);
    --rowshade-off: color-mix(in srgb, var(--ink) 13%, transparent);
    --rowhover: color-mix(in srgb, var(--ink) 4%, transparent);
    --cellhover: color-mix(in srgb, var(--ink) 8%, transparent);
    --on-accent: #eafaf5;
  }
  :root[data-mixer-theme="midday"] {
    /* Midnight's bright signals, moved onto a sunlit paper surface. */
    --bg: #f3f0e8; --panel: #fffdf8; --panel2: #e7e4dc; --line: #c9c5ba;
    --ink: #27323a; --dim: #6b7479; --accent: #4ec9b0; --hot: #e5534b;
    --hover: #dce9e4; --primary: #cce9e0; --input: #fffefa; --cell: #eceae2;
    --ctl: #71808a; --ctl-hi: #526773; --solo: #c38d25;
    --selected-ink: #27323a; --lane-ink: #1e3035; --on-primary: #27323a;
    --rowshade: color-mix(in srgb, var(--ink) 8%, transparent);
    --rowshade-off: color-mix(in srgb, var(--ink) 13%, transparent);
    --rowhover: color-mix(in srgb, var(--ink) 4%, transparent);
    --cellhover: color-mix(in srgb, var(--ink) 8%, transparent);
    --on-accent: #10231f;
  }
  :root[data-mixer-theme="dawn"] {
    --bg: #fff4e8; --panel: #fffaf3; --panel2: #f1dfd0; --line: #dfc5b3;
    --ink: #3a2b2b; --dim: #88706b; --accent: #d87558; --hot: #bd4e58;
    --hover: #f0d7c5; --primary: #f1d2c1; --input: #fffaf5; --cell: #f4e3d4;
    --ctl: #92786d; --ctl-hi: #76594f; --solo: #b47a16;
    --selected-ink: #3a2b2b; --lane-ink: #382b2b; --on-primary: #3a2b2b;
    --rowshade: color-mix(in srgb, var(--ink) 8%, transparent);
    --rowshade-off: color-mix(in srgb, var(--ink) 13%, transparent);
    --rowhover: color-mix(in srgb, var(--ink) 4%, transparent);
    --cellhover: color-mix(in srgb, var(--ink) 8%, transparent);
    /* Dawn's accent is a mid terracotta, light enough that light lettering on it
       measures 2.9:1 — a button you have to lean in to read. Dark wins on this one. */
    --on-accent: #2e1a12;
  }
  :root[data-mixer-theme="dusk"] {
    --bg: #15171b; --panel: #202329; --panel2: #2b2f36; --line: #454b55;
    --ink: #e9e4db; --dim: #a49c91; --accent: #d2a15b; --hot: #df6b61;
    --hover: #3d4149; --primary: #4c4031; --input: #1b1e23; --cell: #2c3036;
    --ctl: #8e9298; --ctl-hi: #c2b9aa; --solo: #d6a447;
    --on-accent: #241a05;
  }
  :root[data-mixer-theme="oscar"] {
    /* A hardware synth panel: black chassis, bone plates, cream knobs, and no colour
       on any of it except the lamps. The accent is the lamp — an amber LED, the one
       warm thing on a grey machine — and it can be that here precisely because the
       knobs took the cream: nothing else on the panel is competing for attention, so
       a single lit amber reads as ON from across the room. Only mute, solo and the
       limiter keep a hue besides it. */
    --bg: #131312; --panel: #1e1e1c; --panel2: #2a2a27; --line: #4b4a44;
    --ink: #cfc9ba; --dim: #8d887c; --accent: #f0a63a; --hot: #cf5c4e;
    --hover: #3a3934; --primary: #4b483f; --input: #171715; --cell: #262523;
    /* The knobs, and the whole look of the thing: two hundred sliders in cream. They
       are what lets the accent be a colour rather than a shade — the cream carries the
       panel, so the amber only ever has to mean ON. */
    --ctl: #bdb6a6; --ctl-hi: #e2dac6; --solo: #cf9a3a;
    /* Warm dark on a lit lamp, the same as the other amber desks. 7.9:1. */
    --on-accent: #241a05;
    /* Purple on a monochrome chassis reads as a bug rather than a signal; the limiter
       keeps a colour of its own but takes the steel one off the same panel. */
    --lim: #7d93b8; --go: #64a56a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    /* Nothing here is a document: dragging across a fader label selected the words
       instead of moving the control, and there is no reason to select any of it.
       Text inputs and the error log opt back in below. */
    user-select: none; -webkit-user-select: none;
    background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font);
    /* Numbers line up column to column whatever the typeface is — a proportional
       font would otherwise make a rack of dB readouts dance as they change. */
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    /* Left is --foldx, the line the panels' folds run down; right is --rgut, the desk's
       far edge. Written as the variables rather than as 12px so the header cannot drift
       away from the panels it sits on top of. */
    padding: 8px var(--rgut) 8px var(--foldx);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap; flex: none;
  }
  header .grp { display: flex; gap: 6px; align-items: center; }
  header .sp { flex: 1; }
  /* ---- one height, one box --------------------------------------------------------
     The row had grown five heights — 25, 26, 27, 28 and 30 — because every control had
     been sized by its own padding and none of them by the row. Nothing lined up along
     either edge, which reads as a header that was never set rather than as a console.
     One number governs the lot now, and it is a variable so the row can be raised or
     lowered in one place.

     The icon-only buttons are SQUARE at that number. An icon has no reading direction
     and no ascender to hang off — a 34x26 box puts the picture off its own centre and
     leaves more air at the sides than above, which is what made the transport read as
     four wide buttons beside three tall ones. Square is the box an icon is drawn for. */
  /* --ctlh and --ctlicon live on :root now — the panel folds down the left edge are the
     same square as the hamburger and had no way to reach a header-scoped variable. */
  header button, header select { height: var(--ctlh); box-sizing: border-box; }
  header .iconbtn { width: var(--ctlh); padding: 0;
                    display: grid; place-items: center; }
  header .iconbtn > svg { width: var(--ctlicon); height: var(--ctlicon); }
  /* A hairline between one kind of thing and the next: the row was a dozen controls
     of equal weight, which reads as a list rather than as groups. */
  header .hdiv { width: 1px; align-self: stretch; margin: 2px 2px; background: var(--line); }
  /* The numbers travel together and none of them is a control. Each one sits in its
     own recessed window inside the tray — a readout you glance at, the way a console
     shows its telemetry, rather than four numbers set in body text. */
  header .readouts { gap: 4px; padding: 3px; border-radius: 9px;
                     background: var(--well); border: 1px solid var(--seam); }
  /* A grid rather than a flex row, for one reason: the caption and the digits have to
     share a BASELINE, and the pair of them has to sit centred in a box the height of
     every button beside it. Flex can do the first or the second, not both — `align-content`
     only centres a track, and a flex row has no tracks. */
  header .readouts .stat { display: grid; grid-auto-flow: column; gap: 6px;
                           align-items: baseline; align-content: center;
                           height: var(--ctlh); box-sizing: border-box;
                           padding: 0 8px; border-radius: 6px;
                           background: var(--deep); border: 1px solid var(--seam); }
  header .readouts .stat .label { font-size: 9px; }
  /* Digits, lit: tabular so they never jitter as they count, and a trace of glow so
     the value reads as the lit part of the window and the caption as the label
     printed beside it. */
  header .readouts .stat > span + span { color: var(--ink); font-variant-numeric: tabular-nums;
                                         letter-spacing: .02em;
                                         text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 16%, transparent); }
  header .readouts .stat > span + span.dirty { color: var(--hot); text-shadow: none; }
  /* A tempo that is not the song's own — you are listening at it, not writing it. */
  header .readouts .stat > span + span.tweaked { color: var(--accent); }
  header .readouts .stat > span + span.draggy { cursor: ns-resize; }
  /* The loop controls are one thing, in the same tray as the transport. */
  .looptray { background: var(--tray); border: 1px solid var(--line); border-radius: 9px;
              padding: 3px; gap: 3px; }
  .looptray button, .looptray select { border-color: transparent; background: var(--traybtn);
                                       border-radius: 6px; padding: 4px 9px; }
  .looptray button.on { background: var(--accent); color: var(--on-accent); }
  select, button, input[type=number] {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 9px; font: inherit; cursor: pointer;
  }
  select { max-width: 320px; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
  button.warn.on { background: var(--hot); color: #fff; border-color: var(--hot); }
  /* Transport, as a console has it: play from the top, stop, play, pause. Four
     small buttons in one tray rather than one word that changes meaning — a button
     labelled Play that sometimes says Stop cannot be aimed at without reading it. */
  .transport { display: flex; gap: 3px; background: var(--tray); border: 1px solid var(--line);
               border-radius: 9px; padding: 3px; }
  /* Size and shape come from `.iconbtn`, which every icon-only button in the header
     wears; what is left here is what makes these the transport. */
  .transport button { border-radius: 6px;
                      border-color: transparent; background: var(--traybtn); color: var(--ink); }
  .transport button:hover { background: var(--traybtn-hi); border-color: transparent; color: #fff; }
  .transport button svg { fill: currentColor; }
  /* Only green while actually playing — not at rest. */
  .transport .playbtn.on { background: var(--go); color: var(--on-go); }
  .transport .playbtn.on:hover { background: color-mix(in srgb, var(--go) 82%, var(--ink)); }
  .transport button:disabled { opacity: .4; }
  /* Lit whenever anything on the desk is soloed, anywhere — the one place that can
     always tell you, and the one click that puts it all back. */
  /* A letter, but an icon-sized one: it sits in the row of squares and is aimed at the
     same way, so it takes the same box. */
  #clearsolo { font-weight: 700; color: var(--faint); }
  #clearsolo.on { background: var(--solo); border-color: var(--solo); color: var(--on-solo); }
  .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .dirty { color: var(--hot); font-weight: 700; }

  /* ---- one scrollbar, in two sizes ------------------------------------------------
     Every scroller used to be styled where it was declared, and two of them also set
     `scrollbar-color`. That property is not additive: in Chrome, setting it (or
     `scrollbar-width`) switches the element back to the STANDARD scrollbar and drops
     the ::-webkit-scrollbar rules underneath it entirely. So the roll's bar was the
     browser's own — fifteen pixels, its own track — while the arrangement's, ten
     pixels away up the same right edge, was a drawn ten. Nothing sets the standard
     properties now. One path, two sizes on it.

     CHROME, the default: a 6px thumb on no track, for the things that scroll inside a
     panel or a popover — the drawer, the two racks, the voice editor, the library.
     There a wide gutter is a fifth of the thing you are reading. */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); }
  /* CONTENT, the exception: the arrangement and the roll are the desk's two big
     fields, they scroll down the same right edge one above the other, and they now
     carry the same bar at the same inset — that pair not matching is what this is
     for. The gutter is exactly --rgut, the desk's right margin, so the bar rides
     INSIDE the margin instead of eating it: content still stops on the margin line,
     and the thumb floats in the air that was already there rather than sitting flush
     against the window. The floating is the transparent border clipped to the padding
     box — a scrollbar is always drawn at the element's border edge and there is no
     other way to inset one. */
  #arrgrid::-webkit-scrollbar,
  #pianoroll .ssqscroll::-webkit-scrollbar,
  #stepseq .ssqscroll::-webkit-scrollbar { width: var(--rgut); height: 12px; }
  #arrgrid::-webkit-scrollbar-thumb,
  #pianoroll .ssqscroll::-webkit-scrollbar-thumb,
  #stepseq .ssqscroll::-webkit-scrollbar-thumb {
                      background: var(--faint); background-clip: padding-box;
                      border: 5px solid transparent; border-radius: 10px; }
  #arrgrid::-webkit-scrollbar-thumb:hover,
  #pianoroll .ssqscroll::-webkit-scrollbar-thumb:hover,
  #stepseq .ssqscroll::-webkit-scrollbar-thumb:hover {
                      background: var(--dim); background-clip: padding-box; }
  /* Along the bottom there is no margin to ride in, so the horizontal one is the
     thin bar with air around it instead of the wide one — the same 6px thumb the
     rest of the desk scrolls by. */
  #pianoroll .ssqscroll::-webkit-scrollbar-thumb:horizontal,
  #stepseq .ssqscroll::-webkit-scrollbar-thumb:horizontal { border-width: 3px; border-radius: 6px; }

  /* The master strip is pinned right, so it never scrolls out of reach. */
  /* Transport position, DAW style: one segment per two-bar block of the song
     form, shaded by which section it plays, with the playhead riding over it. */
  #timeline { position: relative; height: 30px; background: var(--panel);
              border-bottom: 1px solid var(--line); flex: none; cursor: pointer;
              user-select: none; }
  #barsarea { position: absolute; top: 5px; bottom: 5px;
              left: var(--contentx); right: var(--rgut); }
  /* The fold sits in the column the ruler is inset by — space that was empty, and
     exactly where the arrangement's fold is, so the two line up down the page. */
  #tlhead { position: absolute; left: var(--foldx); top: 0; height: 30px;
            display: flex; align-items: center; gap: var(--capgap); }
  /* Open: the ruler keeps its row and the section blocks take the one under it —
     half the height of an arrangement bar, because they are a key to the song's
     form and not another lane of it. */
  #timeline.sections { height: 44px; }
  #timeline.sections #ruler { bottom: auto; height: 20px; }
  #timeline.sections #blocks { display: flex; top: 24px; bottom: auto; height: 10px; }
  /* A bar ruler over the song form: numbers and ticks where a DAW puts them, so a
     position can be read off rather than counted. The coloured blocks below say
     which SECTION a bar belongs to — two different questions, two rows. */
  #ruler { position: absolute; inset: 0; }
  /* The numbered bars run the full height; the ones between are half-height ticks,
     so the row has a rhythm rather than a picket fence. */
  #ruler .tick { position: absolute; top: 50%; bottom: 0; width: 1px; background: var(--grid); }
  #ruler .tick.major { top: 0; background: var(--grid-hi); }
  #ruler .tick span { position: absolute; left: 6px; top: 3px; font-size: 9.5px;
                      color: var(--dim); font-variant-numeric: tabular-nums; }
  /* The section-coloured blocks are parked, not deleted: the ruler answers "where am
     I" and the arrangement below answers "what is playing", which left the blocks
     saying something neither of them needed. One line brings them back. */
  #blocks { position: absolute; top: 15px; right: 0; bottom: 0; left: 0; display: none; gap: 1px; }
  #blocks .blk { flex: 1; border-radius: 2px; position: relative;
                 display: flex; align-items: center; justify-content: center;
                 font-size: 9px; color: #0d1013; font-weight: 700;
                 border-left: 1px solid rgba(0,0,0,.35); overflow: hidden; }
  #blocks .blk.second { border-left-color: rgba(0,0,0,.15); }
  #blocks .blk:first-child { border-left: 0; }
  #loopregion { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 9%, transparent);
                border-left: 1px solid color-mix(in srgb, var(--accent) 58%, transparent); border-right: 1px solid color-mix(in srgb, var(--accent) 58%, transparent);
                pointer-events: none; display: none; }
  /* The bars you have SELECTED, as opposed to the ones that are looping. White
     rather than teal, and hatched rather than filled, so the two can overlap and
     still be told apart — you very often loop the range you are about to edit. */
  #selregion { position: absolute; top: 0; bottom: 0; pointer-events: none; display: none;
               background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--selected-ink) 13%, transparent) 0 4px,
                                                     rgba(255,255,255,0) 4px 8px);
               box-shadow: inset 1px 0 0 color-mix(in srgb, var(--selected-ink) 55%, transparent), inset -1px 0 0 color-mix(in srgb, var(--selected-ink) 55%, transparent); }
  #selregion.show { display: block; }
  /* A muted timeline bar is still present: retain the section colour, add a light
     hatch and M. A deleted bar gets the red X treatment used in the lane grid. */
  #blocks .blk.muted { background-image: repeating-linear-gradient(135deg,
                       color-mix(in srgb, var(--accent) 28%, transparent) 0 3px, rgba(0,0,0,0) 3px 7px);
                       box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--accent) 90%, transparent); }
  #blocks .blk.muted::after { content: 'M'; position: absolute; left: 3px; top: 0;
                              color: var(--on-accent); font: 700 8px/10px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #blocks .blk.deleted { background-image: repeating-linear-gradient(135deg,
                         color-mix(in srgb, var(--hot) 32%, transparent) 0 3px, rgba(0,0,0,0) 3px 7px);
                         box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--hot) 95%, transparent); }
  #blocks .blk.deleted::after { content: 'D'; position: absolute; left: 3px; top: 0;
                                color: #5a101d; font: 500 8px/10px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--hot);
              box-shadow: 0 0 6px var(--hot); pointer-events: none; left: 0; }
  /* Recording, on the line that says where you are. It is already `--hot`, so this is
     weight rather than colour — wider and lit harder. Reinforcement, not the signal: the
     keyboard's own border and its pulsing dot are what actually tell you, and a playhead
     that changed colour would be competing with the eight other things that use red. */
  #playhead.recording { width: 3px; box-shadow: 0 0 12px var(--hot), 0 0 3px var(--hot); }
  /* The clock lives up in the transport now — the strip under the ruler was a whole
     row of window spent on one number, a bar count the arrangement already marks,
     and a song length nobody was reading. */
  #tnow, #barnow { font-variant-numeric: tabular-nums; color: var(--ink); }
  /* ---- the desk column --------------------------------------------------------
     The four regions the window's height is divided between, and their two handles.
     The header, the timeline, the footer and the error log are OUTSIDE it.

     min-height: 0 so it can be squeezed below its own content, and overflow: hidden
     so that when it is, the clipping happens in HERE. That is the whole reason this
     box exists: the page used to clip its own last children, which are the footer
     and the error log, so a short window took away the two things that tell you
     where you are and what went wrong. Now the footer is unclippable by
     construction rather than by arithmetic. */
  #desk { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
          overflow: hidden; }
  #desk > * { flex: none; }
  /* Exactly one region is elastic at a time — the rack, then the arrangement, then
     the effects panel, then the empty band. Which one is a decision the desk makes
     on every fit (see applyDeskChain and DESK_CHAIN in mixer-entry.js) rather than
     a flex:1 hardwired to the rack, which is what left the footer floating in
     mid-screen the moment the rack was folded away. */
  #desk > .greedy { flex: 1 1 auto; min-height: 0; }
  /* The band at the end of the chain, and the only one that is not a panel: with
     the rack, the arrangement and the effects all folded away there is still a
     window to fill, and an empty strip of desk is the honest thing to fill it with
     — a closed console rather than a hole in the page. It also takes the sub-lane
     remainder when the arrangement is the elastic one, which is snapped to whole
     lanes and so cannot absorb the last few pixels itself. */
  #deskslack { display: none; }
  #deskslack.greedy { display: block; background: var(--panel); }
  /* Last resort, and it should never fire: every region above has a minimum, and
     they sum to about 500px. Below that the desk scrolls, because the alternative
     is controls that are gone with no way to reach them. */
  #desk.cramped { overflow-y: auto; }
  /* Which bars each instrument actually plays in. The songs are two-bar blocks in
     a section order, so "where is the crash" is otherwise a listening exercise. */
  /* Capped at eight lanes and scrolled beyond that. It used to take 42vh, which on
     a 21-lane song was most of the window and left the channel strips too short to
     show their EQ rows. Eight is enough to read the shape of a song; the rest is a
     scroll, and the fold button is still there when you want the height back. */
  #arrange { flex: none;
             background: var(--panel); border-bottom: 1px solid var(--line);
             display: flex; flex-direction: column;
             max-height: calc(var(--arrrow) * 8 + 30px); }
  #arrange.collapsed #arrgrid { display: none; }
  /* The chevron starts where the rows' number column starts — both are written off
     --foldx, the cell adding back its own four, or the numbers run down a line to
     the right of the button they belong under. */
  #arrhead { position: relative; display: flex; align-items: center; gap: var(--capgap); flex: none;
             padding: 4px var(--rgut) 4px var(--foldx); }
  /* The plus belongs to the arrangement header, but its right edge belongs to the
     timeline: it is the last control before the first bar, not another item beside
     the word "Arrangement". The expression matches the row geometry below. */
  #arrhead #addtrackbtn { position: absolute;
                          left: calc(var(--arrname) + var(--gut) + var(--namegap) - 24px);
                          top: 50%; transform: translateY(-50%); }
  /* A real scrollbar here, unlike the strips: with the panel capped at eight lanes
     there are usually more underneath, and nothing else on screen would say so. */
  /* The gutter IS the right margin: --rgut of scrollbar and no right padding at all,
     so the rows stop on the same line as the bar ruler above them and the thumb rides
     in the margin rather than beside it. STABLE because the rows have to stop on that
     line whether the panel scrolls or not — on `auto` a seven-lane song had no bar,
     took the twenty pixels back, and every bar in the arrangement sat ten pixels wide
     of the tick it belongs under. */
  /* No bottom padding: the height is snapped to whole lanes, and six pixels of
     padding is six pixels of the NEXT lane showing through under the last one. */
  /* Left inset follows the fold column, less the four the cell pads itself by, so the
     numbers stay under the chevron. The width the cell gives back is taken out of the
     name column below, which keeps the bars where the ruler expects them. */
  /* flex: 1 so the rows fill a panel taller than they are. With the arrangement
     content-sized this changes nothing; when the arrangement is the region taking
     the desk's slack — the mixer folded away — it is what puts the extra height
     into the scroller instead of leaving a dead band under the last lane. */
  #arrgrid { flex: 1 1 auto; min-height: 0;
             overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable;
             padding: 0 0 0 calc(var(--foldx) - 4px); }
  .arrrow { display: flex; align-items: center; height: var(--arrrow); gap: var(--namegap); }
  /* Mute, solo, name — one cell, exactly as wide as the ruler above is inset, so
     the bars still line up with the bar numbers. */
  /* Padding inside the cell, not around it: the cell's width is what the bar ruler
     above is inset by, so the buttons can have room without the columns drifting. */
  /* The cell is the panel header one row down: a number in the fold column, then the
     caption gap, then what the row is about. Taking the gap from --capgap rather than
     leaving it at 4 is what lands the mute/solo pair on the caption line — the M sat
     four pixels left of the word ARRANGEMENT above it, which is close enough to read as
     an accident rather than as a second column. */
  .arrhead-cell { width: calc(var(--arrname) + var(--gut) + 4px - var(--foldx));
                  flex: none; display: flex; align-items: center;
                  gap: var(--capgap); padding-left: 4px; }
  /* Same width as the fold button above it, centred, so the numbers run down the
     column the chevron starts — written as the variable rather than as a number that
     happened to sit near it: at 28 under a 22px fold the two were never on one axis. */
  .arrnum { flex: none; width: var(--ctlh); text-align: center; font-size: 9.5px; color: var(--faint);
            font-variant-numeric: tabular-nums; }
  .arrrow.sel .arrnum { color: var(--ink); }
  .arrbtns { display: flex; gap: 2px; flex: none; }
  .arrbtns button { width: 19px; height: 18px; padding: 0; font-size: 9.5px; line-height: 1;
                    border-radius: 3px; color: var(--dim); }
  /* Same size as a channel strip's title: it is the same name, and reading it at
     two sizes in two places made them feel like two different lists. */
  .arrname { flex: 1; min-width: 0; font-size: 12px; color: var(--dim); text-align: left;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
             text-transform: capitalize; }
  /* Solo gets its own colour: two lit buttons in the same accent said nothing about
     which was which, and solo is the one you leave on by accident. */
  .solobtn.on { background: var(--solo); color: var(--on-solo); border-color: var(--solo); font-weight: 700; }
  .arrrow:hover .arrname { color: var(--ink); }
  /* The selected lane, outlined end to end in the same pale edge its strip carries,
     so the two halves of the desk agree on which channel you are on. */
  .arrrow.sel { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--selected-ink) 32%, transparent); border-radius: 4px; }
  .arrrow.sel .arrname { color: var(--selected-ink); font-weight: 700; }
  .arrbars { flex: 1; display: flex; gap: 1px; height: 20px; }
  .arrbars { gap: 0; }
  /* A bar is the unit you point at — the beats inside it are a picture of what it
     plays, not sixteen separate targets. */
  .arrbar { flex: 1; display: flex; cursor: pointer; min-width: 0; position: relative; }
  .arrbar:hover { outline: 1px solid var(--accent); outline-offset: -1px; }
  /* Tiny gain trim inside the header cell — barely there until hovered. */
  /* The general range rules below are deliberately generous for the rack faders.
     Keep this selector more specific: the arrangement trim is only a tiny nudge
     before the bars, not a second full-size mixer control. */
  .arrrow .arrgain { -webkit-appearance: none; appearance: none; width: 30px; height: 5px;
                     flex: none; margin: 0 2px 0 1px; padding: 0; border-radius: 2px;
                     cursor: ew-resize; background: var(--line2); border: none; display: none; }
  .arrgainwrap { display: none; position: relative; flex: none; width: 30px; height: 5px;
                 margin: 0 2px 0 1px; }
  .arrgainwrap .arrgain { display: block; width: 30px; margin: 0; }
  #arrange.track-gain-visible .arrrow .arrgainwrap { display: block; }
  .arrrow .arrgain::-webkit-slider-runnable-track { height: 5px; border-radius: 2px;
                                                     background: var(--line2); border: none; }
  .arrrow .arrgain::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
                     width: 10px; height: 10px; border-radius: 50%; margin-top: -2.5px;
                     background: var(--faint); border: none; box-shadow: none; }
  .arrrow .arrgain::-moz-range-track { height: 5px; border-radius: 2px;
                                       background: var(--line2); border: none; }
  .arrrow .arrgain::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%;
                                       background: var(--faint); border: none; }
  .arrrow:hover .arrgain { background: var(--grid); }
  .arrrow:hover .arrgain::-webkit-slider-thumb { background: var(--ctl); }
  .arrgain:hover::-webkit-slider-thumb { background: var(--ctl-hi); }
  .arrrow:not(:hover) .arrgain { opacity: .72; }
  .arrgainreadout { display: none; position: absolute; z-index: 6; left: 50%; bottom: calc(100% + 4px);
                    transform: translateX(-50%); width: max-content; padding: 3px 5px;
                    border: 1px solid var(--line); border-radius: 3px; background: var(--panel2);
                    color: var(--ink); font-size: 9px; line-height: 1;
                    font-variant-numeric: tabular-nums; white-space: nowrap;
                    pointer-events: none; box-shadow: 0 2px 6px color-mix(in srgb, var(--deep) 45%, transparent); }
  .arrgainreadout.show { display: block; }
  .arrmeta { position: absolute; z-index: 1; inset: 1px 2px auto 2px; overflow: hidden;
             white-space: nowrap; text-overflow: ellipsis; pointer-events: none;
             color: var(--lane-ink); font: 700 8px/11px ui-monospace, SFMono-Regular, Menlo, monospace;
             text-shadow: 0 1px 2px #000, 0 0 3px #000; }
  /* The bar you clicked. A white edge sits inside the exact bar rectangle: no single
     hue is legible against twenty-one lane colours, so the marquee has to be clear
     without spilling into neighbouring bars or rows. */
  .arrbar.sel::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    border-radius: 3px;
    border: 2px solid var(--selected-ink);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.9), 0 0 6px color-mix(in srgb, var(--selected-ink) 35%, transparent);
  }
  /* Muted is still written and still occupies time: keep the lane colour, dim the
     notes beneath it, and stamp a small M. Deletion stays the hollow/red state below,
     so the two edits cannot be mistaken for each other. */
  .arrbar.barmuted { opacity: .72; }
  .arrbar.barmuted::before { content: 'M'; position: absolute; z-index: 2; inset: 1px auto auto 2px;
                             min-width: 11px; height: 11px; padding: 0 2px; border-radius: 3px;
                             background: color-mix(in srgb, var(--accent) 72%, transparent); color: var(--on-accent);
                             font: 700 8px/11px ui-monospace, SFMono-Regular, Menlo, monospace;
                             text-align: center; pointer-events: none; }
  .arrbar.barmuted::after { content: ''; position: absolute; z-index: 1; inset: 0;
                            pointer-events: none;
                            background: repeating-linear-gradient(135deg,
                              color-mix(in srgb, var(--selected-ink) 14%, transparent) 0 3px, transparent 3px 7px); }
  .arrbar.sel.barmuted::after { z-index: 3; border: 2px solid var(--selected-ink);
                                box-shadow: inset 0 0 0 1px rgba(0,0,0,.9),
                                0 0 6px color-mix(in srgb, var(--selected-ink) 35%, transparent); }
  .arrbar.sel.barmuted::before { z-index: 4; }
  .arrbar.barmuted .arrmeta { padding-left: 15px; }
  .arrbar.barmuted .arrcell { opacity: .42; }
  .arrbar.bardeleted { opacity: .58; background-image: repeating-linear-gradient(135deg,
                          color-mix(in srgb, var(--hot) 18%, transparent) 0 3px, rgba(0,0,0,0) 3px 8px);
                       box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hot) 62%, transparent),
                                   inset 0 -2px 0 color-mix(in srgb, var(--hot) 80%, transparent); }
  .arrbar.bardeleted::before { content: 'D'; position: absolute; z-index: 2; inset: 1px auto auto 2px;
                               min-width: 11px; height: 11px; padding: 0 2px; border-radius: 3px;
                               background: color-mix(in srgb, var(--hot) 78%, transparent); color: #230d0d;
                               font: 500 8px/11px ui-monospace, SFMono-Regular, Menlo, monospace;
                               text-align: center; pointer-events: none; }
  .arrbar.bardeleted .arrmeta { padding-left: 15px; }
  .arrcell { flex: 1; background: var(--cell); margin-right: 1px; pointer-events: none; }
  /* A tick on every downbeat, so 64 beat-cells still read as bars at a glance. */
  .arrcell.barstart { box-shadow: inset 1px 0 0 var(--grid); }
  #arrplay { position: absolute; width: 2px; background: var(--hot); pointer-events: none;
             opacity: .9; }
  /* A bar you can see without looking for it: taller, its own shade, and a grip in
     the middle that says which way it moves. */
  #arrsplit { flex: none; height: 11px; background: var(--well); cursor: ns-resize;
              border-top: 1px solid var(--seam); border-bottom: 1px solid var(--seam);
              position: relative; }
  #arrsplit::after { content: ''; position: absolute; left: 50%; top: 3px;
                     width: 64px; height: 3px; margin-left: -32px; border-radius: 3px;
                     background: var(--faint); box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  #arrsplit:hover { background: var(--panel2); }
  /* Gone with the arrangement it resizes — see setArrangeCollapsed. Its eleven
     pixels come off the page chrome too, so the rack takes them. */
  #arrsplit.hidden { display: none; }
  #arrsplit:hover::after { background: var(--dim); }
  #arrsplit.dragging::after { background: var(--ink); }
  /* Never a vertical scrollbar here. The strips are sized to the rack instead, and
     the rack's floor is one COMPACT strip — see rackFloor() — so running out of
     height puts the rack on its shrink ladder rather than cutting a strip off at
     the fold. No flex here either: which region takes the desk's slack is set by
     applyDeskChain, and the rack is only first in that queue rather than the
     permanent holder of it. */
  /* The same panel as the timeline, the arrangement and the effects: the mixer was
     the one section showing the page through it, which read as a hole between two
     panels rather than as the third one. */
  #rackwrap { display: flex; min-height: 0; overflow-y: hidden;
              align-items: flex-start; background: var(--panel);
              border-bottom: 1px solid var(--line); }
  /* overflow-x: SCROLL, not auto — the six pixels are held whether or not there is
     anything to scroll, so the strips are the same height on a song with seven
     channels and a song with twenty. On auto, hiding a track group or widening the
     window took the bar away and every fader in the rack jumped six pixels, which
     reads as the desk twitching at a click that had nothing to do with it. It is
     also what fitStrips measures — offsetHeight minus clientHeight — so the height
     the strips are given already has the bar taken off it.
     (scrollbar-gutter was here for this and cannot do it: it only ever reserves the
     vertical gutter, and this rack has no vertical scrollbar to reserve.) */
  /* The 10px left is load-bearing — #masterslot subtracts exactly that to put the first
     strip on bar 1's line — so only the far edge takes --rgut. It is inside the scroller,
     which is where it is wanted: it is the air after the last strip. */
  #rack { flex: 1; display: flex; gap: 6px; padding: 10px var(--rgut) 10px 10px;
          overflow-x: scroll; overflow-y: hidden; align-items: flex-start; }
  /* The master, in the column the arrangement spends on names — so the first channel
     starts exactly where bar 1 starts above it, and a strip sits under the lane it
     belongs to all the way up the page. The 10px comes off for the rack's own left
     padding, which is what puts the first strip on that line.
     On the caption line, not centred in the column. Centring was an answer to the strip
     looking loose in a space wide enough for a name — but the space has a left edge of
     its own, the one MIXER is printed on, and a strip standing on it does not look loose
     at all. The padding is the full --capx, not --capx less ten: the slot is a sibling of
     #rack rather than a child of it, so the rack's 10px is spent after this box, not
     inside it. That ten is already accounted for once, in the width above. */
  #masterslot { width: calc(var(--contentx) - 10px);
                padding: 10px 0 10px var(--capx);
                display: flex; justify-content: flex-start; flex: none;
                align-items: flex-start; }
  /* The mixer's own header: the same fold and caption the timeline and arrangement
     carry, so the page is three named panels down the left edge rather than two and
     an unlabelled rack. */
  #mixhead { display: flex; align-items: center; flex: none; gap: 0;
             background: var(--panel);
             padding: 4px var(--rgut) 4px var(--foldx); }
  /* Folded: the caption row and nothing else. The family switches filter strips that
     are not on screen, so they would be four buttons that do nothing visible. The
     strip-part switches are in the same position. */
  #mixhead.folded #lanefilter,
  #mixhead.folded #partfilter { display: none; }
  /* Exactly as wide as the column the master and the lane names share, so the buttons
     start where the strips start. */
  #mixhead .capgrp { width: calc(var(--contentx) - var(--foldx));
                     flex: none;
                     display: flex; align-items: center; gap: var(--capgap); }
  /* Which PARTS of a strip the desk shows, first in the row: the three named blocks
     every channel carries, and with all three off what is left is the fader, the pan
     and the mute/solo pair. One button per strip column, exactly as the family
     switches after them are — the header is one row of switches on one grid, and a
     set sized to its own words instead would have knocked every button after it off
     the strip it stands over. Its own margin is the row's gap, so the two sets run
     on without a seam that shifts them. */
  #partfilter { flex: none; display: flex; align-items: center; gap: 6px;
                margin-right: 6px; }
  /* One button per track family. These hide channels from the RACK only — the
     arrangement keeps every lane, and nothing is muted: a song you are mixing has to
     keep sounding like the song while you are looking at four of its channels. */
  #lanefilter { flex: 1; min-width: 0; display: flex; gap: 6px; overflow: hidden; }
  #partfilter button,
  #lanefilter button { display: flex; align-items: center; gap: 5px;
                       width: var(--stripw); flex: none;
                       padding: 3px 7px; font-size: 9.5px; letter-spacing: .05em;
                       text-transform: uppercase; color: var(--ink);
                       background: var(--panel2); border: 1px solid var(--line);
                       border-radius: 5px; }
  #lanefilter button .n { margin-left: auto; font-variant-numeric: tabular-nums;
                          color: var(--dim); }
  #partfilter button .grpicon,
  #lanefilter button .grpicon { width: 11px; height: 11px; flex: none; }
  /* Hidden reads as switched off, not as missing: the button stays where it was, so
     putting the tracks back is the same click that took them away. */
  #partfilter button.off,
  #lanefilter button.off { color: var(--faint); background: var(--well); border-color: var(--seam); }
  #partfilter button.off .grpicon,
  #lanefilter button.off .grpicon { opacity: .4; }
  /* Still switched ON, but the desk is hiding it anyway because the window is short.
     Struck through rather than dimmed: dim is what OFF already means here, and the
     difference between "you turned this off" and "there is no room for this" is the
     difference between a setting and a symptom. Nothing on the desk is ever hidden
     without something saying so, and for these three blocks this is the something. */
  #partfilter button.shed { color: var(--faint); border-style: dashed; }
  #partfilter button.shed .lbl { text-decoration: line-through; }
  #partfilter button.shed .grpicon { opacity: .45; }
  /* The rows themselves. Display, not audio: an EQ you cannot see is still doing
     whatever it was set to, and the sends and inserts keep working — this is the desk
     showing you less of them, on every strip at once, master and returns included. */
  /* ---- the rack's shrink ladder -----------------------------------------------
     A short window sheds the same three blocks the switches above hide, in the same
     order every time: inserts, then sends, then EQ. What is left at the bottom is
     the strip you balance on — name, voice, fader, dB, pan, mute/solo — and the
     fader is the shock absorber the whole way down. The desk never scrolls a strip
     body: a row half out of sight is a row you cannot read and cannot click, and
     hiding the block outright is the honest version of the same shortage. The
     header switch for the block says so — see #partfilter button.shed.

     shed-* is the desk's doing and no-* is yours. Two sets of classes rather than
     one, because growing the window back must restore exactly what is ticked and
     nothing more. */
  #rackwrap.no-eq .eqrow,
  #rackwrap.shed-eq .eqrow,
  #rackwrap.no-sends .sendrow,
  #rackwrap.shed-sends .sendrow,
  #rackwrap.no-fx .fxbtns,
  #rackwrap.shed-fx .fxbtns { display: none; }
  /* Measuring a rung for real rather than adding its parts up — see stripChromeAt().
     Both of these are given --striph explicitly, which is the number the measurement
     is trying to produce. */
  #rackwrap.measuring .strip,
  #rackwrap.measuring .voicepair { height: auto; }
  /* All: lit when nothing is hidden, which makes it the state as well as the switch. */
  #lanefilter button.all.on { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  #rackwrap.collapsed { display: none; }
  /* The devsplit handle borders the rack and the notes panel. */
  #devsplit { flex: none; height: 11px; background: var(--well); cursor: ns-resize;
              border-top: 1px solid var(--seam); border-bottom: 1px solid var(--seam);
              position: relative; touch-action: none; }
  #devsplit::after { content: ''; position: absolute; left: 50%; top: 3px;
                     width: 64px; height: 3px; margin-left: -32px; border-radius: 3px;
                     background: var(--faint); box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  #devsplit:hover { background: var(--panel2); }
  #devsplit.hidden { display: none; }
  #devsplit:hover::after { background: var(--dim); }
  #devsplit.dragging::after { background: var(--ink); }

  /* ---- Notes panel (piano roll) ---------------------------------------------
     Sits between the mixer and the effects panel. Its height is negotiated by the
     splitter above it; the effects panel below takes a fixed height. */
  #notes { flex: none; display: flex; flex-direction: column;
           background: var(--panel); border-top: 1px solid var(--line); }
  #notes.collapsed { flex: 0 0 auto; }
  #notes.collapsed #pianoroll { display: none; }
  #notes.greedy { flex: 1 1 auto; min-height: 0; }
  #notehead { display: flex; align-items: center; gap: var(--capgap);
              padding: 4px var(--rgut) 4px var(--foldx);
              border-bottom: 1px solid var(--line); flex: none; }

  /* ---- The roll's controls, in the Notes header -----------------------------
     They live out here rather than in a second row inside the panel: two headers
     naming the same channel is a row of chrome for nothing. They used to be built
     into #devhead, which was right while the roll and the effect cards were two
     views of ONE region and wrong the moment those became two panels — a key
     picker on a header labelled Effects belongs to nothing under it.

     `mixer-piano-roll.js` hands them over already clustered — part, view, key —
     and the grid appends the scope button after them. Four things to read, not
     eight, and the fences between them are drawn here rather than as separator
     elements so the grid can keep appending that button without knowing the rule.

     Nothing in here is inside #pianoroll, so none of the roll's own control rules
     reach it. That is why the sizes are restated: `.fxsel` is width:100% by
     default, and eight of those in a flex row squeezed every select until its
     text ran under its own arrow — "Square Tone" reading as "Square Tone✓". */
  #notes.collapsed .ssqhostbar { display: none; }
  #notehead .ssqhostbar { display: flex; align-items: center; gap: 10px;
                          flex: none; margin-left: auto; }
  .ssqhostbar .ssqgrp { display: flex; align-items: center; gap: 5px; }
  /* Content-width, never squeezed: a native select clamped narrower than its text
     runs the text under the arrow instead of eliding it (see .row.divrow .fxsel,
     which pays for the same problem in a fixed-width card column). The max-widths
     are a backstop for an unusually long part name, not the working size. */
  .ssqhostbar .fxsel { width: auto; flex: none; margin-top: 0;
                       font-size: 10px; padding: 3px 5px; }
  .ssqhostbar .ssqlane-pick { max-width: 148px; }
  .ssqhostbar .ssqscalekind { max-width: 120px; }
  /* One control with two ends, not two more loose buttons in a row that already
     had too many: shared frame, a hairline down the middle. */
  .ssqhostbar .ssqoct { display: inline-flex; align-items: stretch; flex: none;
                        background: var(--input); border: 1px solid var(--line);
                        border-radius: 3px; overflow: hidden; }
  /* line-height in PIXELS, not a ratio: 12 + 3 + 3 + the frame's 1 either side is
     exactly the 20px the link beside it comes to, so the two sit on one line rather
     than one of them a pixel proud of the other. */
  .ssqhostbar .ssqoctbtn { width: 22px; flex: none; padding: 3px 0; font: inherit;
                           font-size: 12px; line-height: 12px; text-align: center;
                           color: var(--dim); background: none;
                           border: 0; border-radius: 0; }
  .ssqhostbar .ssqoctbtn + .ssqoctbtn { border-left: 1px solid var(--line); }
  .ssqhostbar .ssqoctbtn:hover { color: var(--ink); background: var(--panel2); }
  .ssqhostbar .ssqlink { width: auto; flex: none; padding: 3px 8px; font-size: 10px;
                         letter-spacing: .04em; color: var(--dim);
                         background: var(--input); border: 1px solid var(--line);
                         border-radius: 3px; }
  .ssqhostbar .ssqlink:hover { color: var(--ink); border-color: var(--accent); }
  .ssqhostbar .ssqlink.on { background: var(--primary); color: var(--accent);
                            border-color: var(--primary); }
  /* The fences. After the link's own padding, so the border it grows gets the same
     breathing room on both sides. The rule is height-of-the-controls, not
     height-of-the-header: one horizontal line still runs through the row. */
  .ssqhostbar .ssqgrp + .ssqgrp,
  .ssqhostbar .ssqgrp + .ssqlink { border-left: 1px solid var(--line);
                                   padding-left: 8px; }

  /* ---- Effects panel (bottom) -----------------------------------------------
     Fixed height — grows to fit its cards, doesn't need a splitter. When the user
     clicks an effect slot the panel auto-opens if collapsed. */
  #devices { flex: none; display: flex; flex-direction: column;
             background: var(--panel); border-top: 1px solid var(--line); }
  #devices.collapsed { flex: 0 0 auto; }
  #devices.collapsed #devrack { display: none; }
  /* The sends are the last two strips in the rack's own row. Same strips as the
     channels — same head, same insert slots, same fader.

     margin-left: auto, which is two behaviours in one property. With room to spare
     the auto margin eats it and they sit against the right edge, where the desk's
     shape is one line of channels and the returns at the end of it. When the
     channels overflow there is no spare room for it to eat, it resolves to zero,
     and they queue up immediately after the last channel — where scrolling to the
     end of the rack finds them, rather than pinned over the strips still scrolling
     underneath.

     No rule down their left edge: the strips are already boxes with their own
     borders, and a full-height line beside them drew a division the desk does not
     have — the sends are strips in the same rack, not a separate panel. */
  #sendslot { display: flex; gap: 6px; flex: none; align-items: flex-start;
              margin-left: auto; }
  /* Three zones: a pinned name, a scrolling control area, and a pinned fader.
     The strips outgrew short windows once channel delay was added, and what got
     clipped was the instrument name at the top — the one thing you always need. */
  /* Height comes from fitStrips: exactly what this song's strip needs, so a tall
     window leaves its slack as a band under the rack rather than as a hole in the
     middle of every strip between the send rows and the pan pot. */
  .strip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    width: var(--stripw); flex: none; padding: 6px 7px; display: flex; flex-direction: column;
    min-height: 0; height: var(--striph, auto);
  }
  .strip .striphead { flex: none; }
  /* Scrolls if it must, but never shows chrome for it — a scrollbar down every
     channel is visual noise across a whole rack. Rows are tight enough that a
     normal window never needs it. */
  .strip .stripbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
                      display: flex; flex-direction: column; gap: 2px; padding-top: 2px;
                      scrollbar-width: none; -ms-overflow-style: none; }
  .strip .stripbody::-webkit-scrollbar { width: 0; height: 0; display: none; }
  /* The 6px bar itself is the desk's, from the block at the top. */
  /* The air between the rows and whatever the foot starts with belongs to the FOOT,
     not to the insert block: the block used to carry it as a top margin, so switching
     Effects off took the gap with it and left the fader hard against the last send
     row. Padding rather than a margin, so it cannot collapse away either. */
  .strip .stripfoot { flex: none; padding-top: 10px; }
  /* The master carries no tint of its own: it is a strip like the rest, and its own
     column already says which one it is. A lighter panel and a blue border on top of
     that read as a different kind of control rather than as the same one. */
  .strip.send { background: var(--panel2); border-color: var(--line2); }
  .fxsel { width: 100%; padding: 2px 4px; font-size: 10px; margin-top: 1px; }
  /* The lane's colour behind its name and underlining it, rather than as a hairline
     above it: the name is what you look for when you are hunting for a channel, so
     the colour belongs with the name and not floating over the top of the strip.
     Full-bleed to the strip edges, which is why the negative margins. */
  /* On the name's line, not above it: the number and the name are one label read
     left to right, and a digit floating in the corner above the word read as a
     badge stuck on the strip. The height matches the h3's line box so the two
     centre on each other whatever the name does. */
  .stripnum { position: absolute; left: 7px; top: 6px; height: 14px;
              display: flex; align-items: center;
              font-size: 9px; color: var(--faint); font-variant-numeric: tabular-nums;
              opacity: 0; transition: opacity .12s ease; }
  /* Under the pointer only. The number answers "which strip is 7?" — a question you
     ask of one strip at a time, when you are already on it — and fourteen digits down
     the rack the rest of the time is a column of noise beside the names that are the
     thing you actually read. The arrangement rows keep theirs: that IS the list. */
  .strip:hover .stripnum { opacity: 1; }
  .strip .striphead {
    /* Barely there, and rising INTO the coloured rule at the bottom rather than
       away from it: the top of the head is plain panel, and the hue only shows in
       the last few pixels, where it reads as the line's own glow. */
    background: linear-gradient(180deg, rgba(0, 0, 0, 0) 52%, var(--lanedim, transparent));
    border-bottom: 3px solid var(--lane, var(--line));
    margin: -6px -8px 5px; padding: 6px 6px 4px;
    border-radius: 5px 5px 0 0; position: relative;
    transition: background .14s ease, box-shadow .14s ease;
  }
  /* Hovering the head lights the lane's own colour rather than a generic grey: the
     head is the strip's handle, and the answer to "which one am I about to click"
     should be the same hue the rule under it already carries. The wash covers the
     whole head — a tint that only touched the last few pixels read as the rule
     thickening rather than as the panel lighting up — and it stays faint, deepening
     towards the line so the head still has a direction. */
  .strip .striphead:hover {
    background: linear-gradient(180deg,
                color-mix(in srgb, var(--lane, var(--grid-hi)) 9%, transparent) 0,
                color-mix(in srgb, var(--lane, var(--grid-hi)) 15%, transparent) 55%,
                color-mix(in srgb, var(--lane, var(--grid-hi)) 26%, transparent) 100%);
  }
  .strip .striphead:hover h3 { color: var(--selected-ink); }
  .strip .striphead:hover .stripnum { color: var(--ink); }
  .strip.selected:hover .stripnum { color: var(--ink); }
  /* No colour bar beside the name: the family mark to its left is already drawn in
     the lane's colour, and two colour cues for one fact is one too many. */
  .arrname { padding-right: 4px; }
  /* Bold means selected, here and in the arrangement — with every name bold there
     was nothing left for the selected one to be. */
  /* Capitalised for reading, lowercase in the data: the lane keys are what the mix
     file is written against, and a display style must never leak into those. */
  .strip h3 { margin: 0; font-size: 11.5px; text-align: center; letter-spacing: .04em;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
              color: var(--ink); font-weight: 400; text-transform: capitalize; }
  .strip.selected h3 { color: var(--selected-ink); font-weight: 700; }
  /* The word on the strip, in the lane's own colour. The family MARK is on the
     arrangement row instead — see groupIcon(). */
  .strip .grp-tag { text-align: center; font-size: 8.5px; letter-spacing: .07em;
                    text-transform: uppercase; color: var(--lane, var(--dim));
                    opacity: .95; margin: 0 0 3px; }
  .grpicon { width: 13px; height: 13px; flex: none; fill: none; stroke: var(--lane, var(--dim));
             stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
  .grpfill { fill: var(--lane, var(--dim)); stroke: none; }
  .arrrow:hover .grpicon { opacity: 1; }
  /* label + value on one line, full-width slider under it — a 130px strip has no
     room for all three side by side, which is what collapsed every track to a dot. */
  .row { display: flex; flex-direction: column; gap: 0; margin-bottom: 2px; }
  .row .head { display: flex; justify-content: space-between; align-items: baseline; }
  .row .k { color: var(--dim); font-size: 9.5px; letter-spacing: .03em; line-height: 1.3;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .resettable { cursor: pointer; }
  .resettable:hover { color: var(--accent); text-decoration: underline dotted; }
  .row.inert { opacity: .38; }
  .row.inert .v { font-style: italic; }
  .row .v { font-size: var(--rowval); color: var(--ink); font-variant-numeric: tabular-nums;
            line-height: var(--rowlh); padding-left: 4px; }
  .row .v.typable { cursor: ns-resize; }
  .row .v.typable:hover { color: var(--accent); text-decoration: underline dotted; }
  /* A note division reads left to right instead, because the select IS the value:
     stacking the readout over it showed the same setting twice, spelled two ways.
     The select takes the slack so the label and the reading keep their width. */
  /* The label sits on the row's FIRST line, exactly where a slider row's label sits,
     so ticking Tempo Mode does not slide TIME down the card while FEEDBACK under it
     stays put. Hence the grid: one track a text line tall, held to the top of a row
     that is still a full --rowh, with the select centred on that line and free to
     overflow into the space the slider would have occupied below it. Centring the
     contents in the whole row instead — the obvious thing — is what dropped the
     label by half a slider. */
  .row.divrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
                grid-template-rows: var(--rowline); align-content: start;
                align-items: center; gap: 0 4px; min-height: var(--rowh); }
  /* Baseline, not centre, for the two bits of text: that is how .head sets them, and
     matching it is what makes the label land on exactly the same pixel in both modes
     rather than a third of one below. The select keeps its own centring — it is the
     thing that overflows the line, and it has no business in their baseline group. */
  .row.divrow .k, .row.divrow .v { flex: none; padding-left: 0; align-self: baseline; }
  /* Tighter than a stacked select's padding, and every pixel of it is spoken for:
     "1/16 triplet" against a two-decimal Hz reading leaves the control about 90px
     of a 168px column, and a squeezed native select runs its text under the arrow
     rather than eliding it. */
  .row.divrow .fxsel { flex: 1; width: auto; min-width: 0; margin-top: 0; padding: 2px 2px; }
  .draggy { user-select: none; -webkit-user-select: none; touch-action: none; }
  input, textarea, .typein { user-select: text; -webkit-user-select: text; }
  .typein { width: 46px; background: var(--deep); color: var(--ink); border: 1px solid var(--accent);
            border-radius: 2px; font: inherit; font-size: 9.5px; padding: 0 2px; text-align: right; }
  /* Hand-styled rather than accent-color: that paints the thumb and the filled
     track the same colour, so the handle vanished exactly where it sat, and left
     the unfilled half near-white. Dark groove, bright handle, clear either way. */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%;
                      height: var(--rowctl); margin: 0; display: block; background: none; }
  /* Chrome's default focus ring is a blue box around the whole control, which on a
     vertical fader draws two lines down the strip. */
  input[type=range]:focus { outline: none; }
  input[type=range]:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px;
                                    border-radius: 4px; }
  /* A hairline groove: the value is carried by the handle, so the rail only has to
     say where the travel is. */
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: var(--input); border: 1px solid var(--line2); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 13px; height: 13px; margin-top: -6px;
    border-radius: 50%; background: #cfd6e4; border: 1px solid var(--deep);
    box-shadow: 0 1px 2px rgba(0,0,0,.55); cursor: pointer; }
  input[type=range]:hover::-webkit-slider-thumb { background: #fff; }
  input[type=range]:active::-webkit-slider-thumb { background: var(--accent); }
  input[type=range]::-moz-range-track {
    height: 3px; border-radius: 2px; background: var(--input); border: 1px solid var(--line2); }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: #cfd6e4;
    border: 1px solid var(--deep); cursor: pointer; }
  /* Explicit pixel height, not height:100%: a vertical range input inside a flex
     item never resolves a percentage height, and collapses to just its thumb.
     Hence --faderh, which fitStrips measures the rack for — the fader shrinks so
     the rows above it survive a short window. */
  /* Fader and meter are one group, centred together; the level reads under the
     group, not under the fader. */
  .faderwrap { display: flex; gap: 10px; justify-content: center;
               height: var(--faderh); flex: none; }
  /* Selector must out-specify input[type=range] above, or its 14px height wins. */
  input[type=range].fader { writing-mode: vertical-lr; direction: rtl;
           width: 24px; height: var(--faderh); }
  input[type=range].fader::-webkit-slider-runnable-track { width: 5px; height: auto; }
  /* A moulded silver cap: neutral across a rack of fourteen, because a wall of
     coloured caps is a wall of nothing. It goes teal when you are on it — hovering
     or selected — so the accent appears exactly where you are working. One colour
     for "here", not fourteen: a cap that changed hue per channel read as a state
     rather than as a position. */
  input[type=range].fader::-webkit-slider-thumb {
    width: 30px; height: 9px; border-radius: 5px; margin-top: 0; margin-left: -13px;
    /* Lit from above rather than shaded top to bottom: the highlight sits off the
       cap's top edge, so it reads as a moulded piece catching light instead of a
       painted rectangle. */
    background: radial-gradient(150% 260% at 50% -60%, #ffffff 0%, #dde4f0 34%, #939eb0 100%);
    border: 1px solid #161a20;
    box-shadow: 0 1px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5);
    transition: box-shadow .12s ease; }
  .strip:hover input[type=range].fader::-webkit-slider-thumb,
  .strip.selected input[type=range].fader::-webkit-slider-thumb {
    background: radial-gradient(150% 260% at 50% -60%, color-mix(in srgb, var(--accent) 18%, #fff) 0%, color-mix(in srgb, var(--accent) 82%, #fff) 34%, color-mix(in srgb, var(--accent) 70%, #000) 100%);
    box-shadow: 0 1px 3px rgba(0,0,0,.5), 0 0 9px color-mix(in srgb, var(--accent) 45%, transparent),
                inset 0 1px 0 rgba(255,255,255,.55); }
  input[type=range].fader::-moz-range-thumb {
    width: 30px; height: 9px; border-radius: 5px; border: 1px solid #161a20;
    background: radial-gradient(150% 260% at 50% -60%, #ffffff 0%, #dde4f0 34%, #939eb0 100%); }
  input[type=range].fader:hover { accent-color: var(--ctl-hi); }
  /* As narrow as the fader's own groove: a meter is a level, not a graphic, and the
     width it was taking was width the strip needed elsewhere. */
  .meter { width: 7px; height: var(--faderh); background: var(--deep);
           border: 1px solid var(--line); border-radius: 2px; position: relative; overflow: hidden; }
  .meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
             background: linear-gradient(to top, var(--go) 0%, var(--solo) 78%, var(--hot) 94%); }
  /* The held peak: where the loudest moment of the last second and a half was. */
  .meter b { position: absolute; left: 0; right: 0; height: 2px; bottom: 0;
             background: var(--ink); box-shadow: 0 0 3px color-mix(in srgb, var(--ink) 70%, transparent); opacity: 0; }
  .meter.clip { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot); }
  /* The master's stereo pair: two bars with a 1px unlit gutter down the middle. Four
     pixels wider than a mono meter, because splitting 5px of lit width in half leaves
     bars too thin to read a difference off — and the master sits in its own slot, so
     the four pixels come out of nobody's channel. Left is the first fill/peak in the
     DOM, right the second. */
  .meter.stereo { width: 11px; }
  /* Half a pixel either side of centre, so the two bars come out the same width — a
     whole pixel of gutter taken off one side makes the quieter-looking channel the one
     that is merely narrower, which is exactly the misread a stereo meter must not have. */
  .meter.stereo i:nth-of-type(1), .meter.stereo b:nth-of-type(1) { right: calc(50% + .5px); }
  .meter.stereo i:nth-of-type(2), .meter.stereo b:nth-of-type(2) { left: calc(50% + .5px); }
  /* One centred column, as on a console: the fader with its meter and level, then
     pan, then mute and solo — each with air around it, so three controls read as
     three rather than as one stack. */
  .faderrow { display: flex; align-items: flex-start; justify-content: center; }
  .fadercol { display: flex; flex-direction: column; align-items: center; gap: 3px;
              flex: 1; min-width: 0; }
  /* Fixed height whether or not it holds a pot: the master has no panner, and its
     buttons still have to sit on the same line as everyone else's. */
  .panrow { height: 42px; margin-top: 11px; display: flex; justify-content: center;
            align-items: center; }
  /* The same pair of buttons as an arrangement row carries, at the same size —
     they are the same two controls, so they should not be two different shapes.
     Centred rather than stretched: a full-width M is not more mutable. */
  .ctlbtns { display: flex; gap: 4px; margin-top: 12px; justify-content: center; }
  .ctlbtns button { flex: none; width: 24px; height: 21px; padding: 0; font-size: 10.5px;
                    line-height: 1; border-radius: 4px; color: var(--dim); }
  /* The master has nothing to mute, and every strip's foot ends on one line. */
  .gap-btns { height: 18px; margin-top: 12px; }
  /* The limiter takes the M/S line on the master: one button the width of the pair,
     so the row lands where the eye already goes for a strip's switches. Spelled out
     rather than abbreviated — there is one of it, and it has the room. */
  .ctlbtns button.limbtn { width: 52px; letter-spacing: .02em; font-size: 9px; }
  .ctlbtns button.limbtn:hover { border-color: var(--lim); }
  .ctlbtns button.limbtn.on { background: var(--lim); border-color: var(--lim);
                              color: var(--on-lim); font-weight: 700; }
  /* A line of its own can afford a bigger pot than the slot beside the fader could,
     and the number inside the ring is the readout — at 34px it was nine pixels of
     type. Still smaller than the fader, which is the strip's main control. The SVG
     scales with it, stroke and number included. */
  .panpot { width: 42px; height: 42px; margin: 0 auto; display: block; cursor: ns-resize;
            touch-action: none; }
  /* A fine ring, not a donut: the arc is a reading, and 5px of it was a graphic. */
  .pottrack { fill: none; stroke: var(--line2); stroke-width: 2.6; stroke-linecap: round; }
  .potarc { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; }

           width: 38px; text-align: center; }
