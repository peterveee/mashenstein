  /* The bus strip's own device, summarised: what it is set to, and the way in to
     the card that changes it. */
  .devlink { display: block; width: 100%; margin-bottom: 5px; padding: 3px 2px;
             font-size: 8.5px; letter-spacing: 0; color: var(--ink);
             background: var(--panel2); border-color: var(--line2); text-align: center;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .devlink::after { content: ' \25BE'; color: var(--dim); }
  .devlink:hover { background: var(--hover); }
  /* On a strip it is the voice row, and it wants air on both sides: what the channel
     IS is a different kind of statement from what has been done to it, and against the
     head's colour bar above and the EQ label below it was reading as the first of the
     rows. Scoped to the body, because the voice editor's panels use .devlink too and
     they are laid out to their own spacing. Every strip carries the same row, master
     and returns included, so the EQ underneath still lines up across the rack. */
  .stripbody > .devlink { margin: 5px 0 6px; }
  /* A channel playing a voice from the catalogue rather than the engine's own. Lit,
     because it is the one thing on a strip that changes what the channel IS rather
     than what has been done to it — and because a song that sounds unfamiliar should
     say why on the face of the strip, not only in the mix file. */
  .voicepick.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-wash); }
  /* A duplicated track with nothing chosen yet. It has no engine voice to fall back
     on — the preset is the whole reason the strip exists — so it is silent until it
     is given one, and a strip that is silent for a reason you can fix has to say so
     on its face rather than in a tooltip. Warn, not error: nothing is broken. */
  .voicepick.voiceneeded { color: var(--solo); border-color: var(--solo-line);

  .voicepick.voiceneeded:hover { background: color-mix(in srgb, var(--solo) 18%, var(--panel)); }
  /* A channel on the engine's own voice, where the library has a name for what that
     is. Dimmed and in the preset's own case rather than the row's upper case, because
     it is a reading and not a setting: nothing is in the mix file, and there is no
     "back" to go to. The lit state above is what a CHOICE looks like. */
  .voicepick.voicenamed { color: var(--dim); text-transform: none; font-style: italic; }
  .voicepick.voicenamed:hover { color: var(--ink); }

     hear a family is to hear it in order. Inside the button rather than beside it so
     the row's box is unchanged (the whole rack's EQ lines up against it), and hidden
     until the strip is under the pointer: forty channels do not need eighty arrows
     sitting on them. The background is inherited so they mask the label's ends in
     whichever of the row's three states it is in. */
  .voicepick { position: relative; }
  .voicestep { display: none; position: absolute; top: 0; bottom: 0; width: 13px;

  .voicestep-next { right: 0; }
  /* Inboard of the next arrow, because it belongs to the same gesture: step through

  .voiceedit { right: 13px; font-size: 10px; }
  /* Small, because it sits between two 10px arrows in the same gesture and must not

  .voiceedit .foldicon { width: 11px; height: 11px; stroke-width: 2.8; }
  .voicepick:hover .voicestep { display: flex; }

  .db { text-align: center; font-size: 11px; width: 100%; white-space: nowrap; }
  .db.typable { cursor: ns-resize; }
  .db.typable:hover { color: var(--accent); text-decoration: underline dotted; }
  .btns { display: flex; gap: 4px; }
  .btns button { flex: 1; padding: 3px 0; font-size: 10px; }
  /* Fold buttons: a drawn chevron that turns over, rather than a glyph swapped for
     another glyph — the two triangles sat on different baselines and the button
     jumped as it changed. */
  /* Not a button — an arrow. It keeps the hamburger's square as its HIT AREA, because a
     30px target is what makes it easy to hit, but it draws no box: four bordered plates
     down the left edge were four rectangles competing with the captions they belong to,
     and a fold is the only control on the desk whose state you can already see (the panel
     is open or it is not), so it needs no plate to say it is pressed.
     Drawn at the weight of the desk's big close (.popclose: a 19px mark in a 28px box).
     Those are the two borderless marks on the desk and they read as a set — a 3.4 stroke
     here was heavier than anything else that had lost its plate, which made the folds the
     loudest thing on a row whose subject is the caption beside them. The hit box stays the
     hamburger's 30px square, because that is what keeps the column and what makes it easy
     to aim at; only the mark is quiet. It turns over rather than swapping glyphs — two
     triangles sat on different baselines and the button jumped as it changed. */
  .foldbtn { width: var(--ctlh); height: var(--ctlh); padding: 0;
             display: grid; place-items: center; color: var(--dim);
             background: none; border: none; border-radius: 0; }
  .foldbtn:hover { color: var(--ink); background: none; border-color: transparent; }

  .foldbtn:focus-visible { outline: none; color: var(--accent); }
  .foldbtn svg { width: 19px; height: 19px; fill: none; stroke: currentColor;
                 stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
                 transition: transform .22s cubic-bezier(.4, 1.5, .5, 1); }
  .foldbtn.folded svg { transform: rotate(180deg); }
  button:disabled { opacity: .35; cursor: default; }
  button:disabled:hover { border-color: var(--line); }
  .insthead { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line);
              font-size: 8.5px; letter-spacing: .05em; color: var(--dim);

  .insthead:hover { color: var(--ink); }

  .insthead.on::before { content: '\25BE '; }
  /* Reset lives on the strip's right-click menu now. A button per strip was a whole

  #ctxmenu { position: fixed; z-index: 30; display: none; min-width: 176px; padding: 4px;

  #ctxmenu.show { display: block; }

  #regionedit { position: fixed; z-index: 31; display: none; width: 340px;

  .reghead { display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px 8px;

             background: var(--panel2); border-top: 1px solid var(--line); }

  /* The file and song controls live in one left drawer. It overlays the desk rather

  #drawerbackdrop { position: fixed; inset: 0; z-index: 31; display: none;

  #drawerbackdrop.show { display: block; opacity: 1; }

  /* The desk's own 6px bar, from the block at the top — no `scrollbar-width` and no
     `scrollbar-color`, either of which would hand this back to the browser. */
  #drawerbody { min-height: 0; overflow: auto; padding: 8px 10px 18px; }
  .drawersection { padding: 0 0 12px; margin: 0 0 10px; border-bottom: 1px solid var(--line); }
  .drawersection:last-child { border-bottom: 0; }

  .drawersectionhead { display: flex; align-items: center; gap: 7px; margin: 2px 3px 6px;
                       color: var(--dim); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
  .drawersectionhead.drawersectiontoggle { width: 100%; min-height: 27px; margin: 0 0 3px;
                                           padding: 6px 8px 4px; border: 0; border-radius: 4px;

  .drawersectionhead .spacer { flex: 1; }

                          padding: 5px 8px; font-size: 11.5px; color: var(--ink); }

                        padding: 7px 8px; color: var(--ink); background: var(--input);
                        border: 1px solid var(--line); border-radius: 4px; font: inherit; font-size: 12px; }

  .drawerrow select { flex: 1; font-size: 11px; padding: 3px 6px; }

                            box-shadow: 0 0 0 2px var(--tray); }
  .hamburger { fill: none; stroke: currentColor;
               stroke-width: 1.5; stroke-linecap: round; }

  #presetbtn:hover { color: var(--accent); }

     take: the three borderless marks on the desk are one set, and at 22 this one was the

  #addtrackbtn { width: 24px; height: 24px; padding: 0; border: 0; display: grid; place-items: center;

  #addtrackbtn:hover { color: var(--accent); background: none; }

  #deletesong:hover { color: #fff; background: var(--hot-wash); }
  /* The effect catalogue, grouped and priced. It was a 22-line dropdown, which
     is a list you scroll rather than a list you read — and it hid what each effect

  /* The way to add an effect is an empty slot at the end of the chain, the same
     shape as the cards beside it — a button in the corner of the header was a long
     way from the rack it filled, and said nothing about where the effect would go. */
  /* A square, not a full-height card: it is a place to put the next effect, not an
     effect, and a card-shaped hole reads as one that failed to load. */
  .devaddcard { flex: none; width: 78px; height: 78px; align-self: center; padding: 0;
                background: none; border: 1px dashed var(--line2); border-radius: 6px;
                display: grid; place-items: center; cursor: pointer; }

     cards say what the rack is, and the plus goes back to arriving on hover. */
  .devaddcard.first::after { opacity: .3; }

  #fxpicker { position: fixed; z-index: 13; display: none; padding: 9px 8px;

              box-shadow: 0 14px 34px color-mix(in srgb, var(--deep) 60%, transparent); }
  #fxpicker.show { display: flex; gap: 12px; align-items: flex-start; }

              stroke-width: 1.35; stroke-linejoin: round; stroke-linecap: round; }
  #nowsong { color: var(--ink); font-weight: 700; }
  /* The voice library. Sixty-five presets in a context menu is a scroll you cannot

  #voicepicker { position: fixed; z-index: 31; display: none; padding: 9px 8px;
                 background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
                 box-shadow: 0 14px 34px color-mix(in srgb, var(--deep) 60%, transparent);
                 max-height: 76vh; max-width: 94vw; overflow: auto; }
  /* Wraps rather than running off the edge. Eleven categories in one row put the

  #voicepicker .voicekinds { display: flex; flex: none; gap: 2px; padding: 2px;

                                   font-size: 10px; color: var(--accent);
                                   border-color: var(--accent-line); }
  /* Where Engine default sits on every other lane. A layer has none — see voiceRow —
     so the space says what the lane IS instead of offering a choice that silences it. */
  #voicepicker .voicewhy { font-size: 10px; line-height: 1.35; color: var(--dim);
                           max-width: 260px; }
  #voicepicker .fxgroup { display: flex; flex-direction: column; gap: 2px; min-width: 150px; }
  #voicepicker .fxgroup h5 { margin: 0 0 2px; padding: 0 6px; font-size: 9px; letter-spacing: .07em;
                             color: var(--dim); text-transform: uppercase; font-weight: 400; }
  #voicepicker button { display: flex; justify-content: space-between; align-items: baseline;
                        gap: 10px; width: 100%; text-align: left; background: none;
                        border: 1px solid transparent; padding: 4px 6px; font-size: 11px;
                        border-radius: 4px; color: var(--ink); }
  #voicepicker button:hover { background: var(--hover); color: var(--accent); }
  #voicepicker button.on { background: var(--primary); color: var(--accent); }
  /* The picker uses the larger borderless close mark from the preset editor. Keep it
     at the far end of the head without inheriting the full-width preset-row treatment
     above. */
  #voicepicker button.voiceclose { width: 34px; height: 34px; flex: none; margin-left: auto;
                                   padding: 0; display: inline-grid; place-items: center;
                                   color: var(--dim); background: none; border: none;
                                   font-size: 23px; line-height: 1; }
  #voicepicker button.voiceclose:hover { color: var(--hot); background: none;
                                         border-color: transparent; }
  /* Engine presets are the game's own voices, and saying so is the difference
     between "a synth called Square" and "the sound this lane already makes". */
  #voicepicker .vkind { color: var(--faint); font-size: 8.5px; letter-spacing: .06em; }
  /* The reserved row on a lane that cannot take a preset. Present so the EQ below it
     lands on the same line as every other strip's, quiet so it is not read as a
     control that is broken. */
  .voicenone { color: var(--faintest); cursor: default; background: var(--input); border-style: dashed; }
  .voicenone::after { content: none; }
  #voicepicker button.on .vkind { color: var(--accent); }
  /* Into the editor from the strip's own header, on hover — beside the ✎ on the voice
     row and the two items on the right-click menu. Not in the preset picker: choosing
     a sound and shaping one are different jobs, and the panel for the first was not
     the place to hide the second.
     Absolutely placed, not in the flow: the head's contents are aligned against every
     other strip's to the pixel, and an inline button would move them.

     The same 28px box, in the same corner, as the editor's own fold mark — see
     `#voiceedit .veclose.vefold`. The two are one pair: » brings the panel out, « puts
     it away, and when the panel is open they sit on the same line of the same header
     band. A pair that did not line up read as two unrelated controls.

     It draws OVER the name rather than beside it. The head is centred text under a
     coloured wash, so a bare chevron in the corner landed on top of whatever the last
     letters of a long name were and blended into them; its own backing lifts it off
     the caption, and covering the tail of "Lead-Harmony" for as long as the pointer is
     on the strip costs nothing — the name is still whole the moment you look away. */
  .stripedit { display: none; position: absolute; top: 4px; right: 2px;
               width: 28px; height: 28px; padding: 0; line-height: 0;
               place-items: center; z-index: 2; color: var(--ink);
               background: color-mix(in srgb, var(--panel) 88%, transparent);
               border: none; border-radius: 5px; }
  .striphead:hover .stripedit { display: grid; }
  .stripedit:hover { color: var(--accent);
                     background: color-mix(in srgb, var(--panel) 88%, transparent); }
  .stripedit::after { content: none; }

  /* ---- The preset editor -----------------------------------------------------
     A floating window like the keyboard, for the same reason: you leave it open and
     keep working — play the song, move a fader, step a lane — while the sound changes
     under you. Above the pickers in the stack and below the keyboard, which is the
     order you reach for them in. */
  /* ---- strip + editor, as ONE object ------------------------------------------
     The wrapper carries everything that draws a container — border, radius, background,
     the selected outline — and the strip and the panel inside it carry none of it. So
     opening the editor does not put a second box next to a channel; it makes that
     channel wider. A divider marks where the controls stop and the sound starts. */
  .voicepair { display: flex; flex: none; align-items: stretch;
               background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
               height: var(--striph, auto); min-height: 0; }
  .voicepair.selected { border-color: color-mix(in srgb, var(--dim) 82%, var(--panel)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--selected-ink) 30%, transparent); }
  /* Both children give up their own frame — that is what makes the pair one object.
     `.strip.selected` is listed explicitly to out-weigh it: it carries the selected
     box-shadow, ties this rule on specificity and wins on order, which drew a bright
     outline right round the inner strip and put a line straight down the join. Its
     text treatments (white bold name) are wanted and are left alone. */
  .voicepair > .strip,
  .voicepair > .strip.selected,
  .voicepair > #voiceedit { background: none; border: none; border-radius: 0;
                            box-shadow: none; height: auto; }
  /* The divider starts BELOW the head band, so the band — its wash and its coloured
     rule — runs unbroken across the pair and reads as one header over one object.
     Carried by the strip's body and foot rather than by the strip, because together
     they are exactly everything under the header; the negative margin pushes the line
     back out to the strip's true edge, past its padding. */
  .voicepair > .strip .stripbody,
  .voicepair > .strip .stripfoot { border-right: 1px solid var(--line);
                                   margin-right: -7px; padding-right: 7px; }
  /* The head bands meet and have to read as one, so they are the same height to the
     pixel and their INNER corners are squared: two 5px radii facing each other put a
     notch in the middle of what is meant to be one continuous band, which was the one
     thing still giving the join away. */
  /* -7px, not the -8px a lone strip uses: that extra pixel is there to cover the
     strip's own 1px border, and inside the pair there is no border to cover — so it
     overshot into the panel and left a hairline down the middle of the head band. */
  .voicepair > .strip .striphead { margin: -6px -7px 5px; border-radius: 5px 0 0 0; }
  .voicepair > #voiceedit .vehead { border-radius: 0 5px 0 0; }
  /* And the » goes away while the panel is out: it is the button that reveals this
     editor, and the editor is already here — with the « that puts it away sitting on
     the same line a few hundred pixels to the right. Written past
     `.striphead:hover .stripedit` on purpose, which would otherwise bring it back on
     hover; the strip inside a pair is the only one this can match. */
  .voicepair > .strip .striphead:hover .stripedit,
  .voicepair > .strip .stripedit { display: none; }

  /* The editor itself — inserted directly after the channel being edited, so the sound
     and its controls are side by side and the thing you are shaping is the thing you
     are looking at. Everything else shuffles right, which is what a rack does when you
     put something in it.
     A column with the ends pinned: the name at the top and Save at the bottom stay put,
     and only the controls between them scroll. A MonoSynth is sixteen sliders — enough
     to push a footer off the bottom, which put the one button the whole thing exists
     for behind a scroll nobody knew was there. */
  /* Three strips wide, written as three strips: the rack's own column and gap, so it
     stays exactly three channels across whatever `--stripw` becomes. The width buys
     the pot labels room to be read at the same size as HIGH/MID/LOW beside them —
     at 310px they were 7px and squinting. */
  #voiceedit { display: none; position: relative; flex: none;
               width: calc(var(--stripw) * 3 + 12px); flex-direction: column;
               height: var(--striph, auto); min-height: 0; overflow: hidden;
               padding: 6px 8px 7px;
               background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  #voiceedit.show { display: flex; }
  #voiceedit .vehead, #voiceedit .veused, #voiceedit .venote, #voiceedit .vefoot { flex: none; }
  /* The channel strips' own header, to the pixel: name over a tag over the coloured
     rule, with the strip's own gradient washing into it. Same two lines, same fonts,
     same 3px rule — so the panel's header and its strip's line up across the gap and
     the pair reads as one thing. (`--lane`/`--lanedim` are copied from the strip when
     the panel is placed.) */
  #voiceedit .vehead { position: relative; display: block;
                       margin: -6px -8px 10px; padding: 6px 6px 4px;
                       min-height: 0;
                       background: linear-gradient(180deg, rgba(0, 0, 0, 0) 52%, var(--lanedim, transparent));
                       border-bottom: 3px solid var(--lane, var(--line));
                       border-radius: 5px 5px 0 0; }
  #voiceedit .vetitle { margin: 0; font-size: 11.5px; text-align: center; font-weight: 400;
                        letter-spacing: .04em; color: var(--ink);
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The category, in the group tag's clothes — same size, same lane colour, same slot. */
  #voiceedit .vetag { text-align: center; font-size: 8.5px; letter-spacing: .07em;
                      text-transform: uppercase; color: var(--lane, var(--dim));
                      opacity: .95; margin: 0 0 3px; }
  /* Borderless, like every other ✕ on the desk — it was the one button here wearing a
     box, which made it read as a control rather than as a way out. */
  #voiceedit .veclose { position: absolute; top: 4px; right: 5px; width: auto; padding: 1px 4px;
                        font-size: 11px; line-height: 1; color: var(--dim);
                        background: none; border: none; }
  #voiceedit .veclose:hover { color: var(--hot); background: none; }
  #voiceedit .veclose::after { content: none; }
  #voiceedit .vesub { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  /* Not inside a `.row`, so it misses `.row .k` and has to say the same thing itself —
     and it takes the pick labels' width, so the synth dropdown starts on the same x as
     every pill group below it. */
  #voiceedit .vesublabel { flex: none; width: 74px; font-size: 9.5px; letter-spacing: .03em;
                           color: var(--dim); text-transform: uppercase; }
  #voiceedit .vesynth { flex: 1; width: auto; min-width: 0; font-size: 10.5px; padding: 4px 6px; }
  /* A preset is library-wide, so who else plays it is the first thing worth knowing —
     above the controls, not buried in a tooltip on the save button. */
  #voiceedit .veused { margin: 0 0 6px; padding: 4px 7px; font-size: 10px; line-height: 1.4;
                       color: var(--solo); background: var(--solo-wash);
                       border: 1px solid var(--solo-line); border-radius: 4px; }
  #voiceedit .venote { width: 100%; margin: 0; padding: 4px 6px; font: inherit;
                       font-size: 9.5px; line-height: 1.4; color: var(--ink); resize: vertical;
                       background: var(--input); border: 1px solid var(--line); border-radius: 4px; }

  /* ---- the save sheet ---------------------------------------------------------
     How the preset is FILED, asked at the moment it is filed. Neither field is a
     sound — you cannot hear a category — and while they sat in the panel they cost
     two rows of controls on every edit. Over the controls rather than beside them,
     because it is the last thing you do and the only thing you are doing. */
  .vesheet-backdrop { position: fixed; inset: 0; z-index: 20; display: flex;
                      align-items: center; justify-content: center;
                      background: rgba(0,0,0,0.45); }
  .vesheet-backdrop .vesheet { width: 340px; max-height: 90vh; overflow-y: auto;
                               display: flex; flex-direction: column; gap: 6px;
                               padding: 10px; background: var(--panel2);
                               border-radius: 5px; }
  .vesheet-backdrop .vesheet h4 { margin: 0 0 2px; font-size: 11px; color: var(--ink);
                                  text-transform: none; letter-spacing: 0; }
  .vesheet-backdrop .vefield { display: flex; flex-direction: column; gap: 3px; }
  .vesheet-backdrop .vefield .k { font-size: 8px; letter-spacing: .05em; color: var(--dim);
                                  text-transform: uppercase; }
  .vesheet-backdrop .vefield .fxsel { width: 100%; font-size: 10.5px; padding: 4px 5px; }
  .vesheet-backdrop .vename { width: 100%; padding: 5px 7px; font: inherit; font-size: 11px;
                              color: var(--ink); background: var(--input);
                              border: 1px solid var(--line); border-radius: 4px; box-sizing: border-box; }
  .vesheet-backdrop .vename:focus { outline: none; border-color: var(--accent); }
  .vesheet-backdrop .venew { white-space: nowrap; }
  .vesheet-backdrop .vesheetfoot { display: flex; gap: 5px; margin-top: auto; }
  .vesheet-backdrop .vesheetfoot > button { flex: 1 1 0; width: auto; min-width: 0; margin: 0;
                                            padding: 6px 8px; font-size: 10.5px; }
  .vesheet-backdrop .vesheetfoot .devlink::after { content: none; }
  .vesheet-backdrop .venote:focus { outline: none; border-color: var(--accent); }
  .vesheet-backdrop .venote::placeholder { color: var(--dim); }
  /* The only part that scrolls. Its own scrollbar rather than the panel's, so the
     name row and the save row stay where you left them. */
  #voiceedit .verack { display: flex; flex-direction: column; gap: 0;
                       flex: 1; min-height: 0; overflow-y: auto;
                       /* Reserved, so the controls do not shift sideways the moment a
                          taller synth makes the bar appear. */
                       scrollbar-gutter: stable; }
  /* The same 6px bar the rack and the device shelf use — narrow enough to read as an
     edge rather than as a column, in a panel only three strips wide. It comes from the
     desk-wide block now; a --line thumb here was a bar you could not see. */
  /* A rule between sections, not a box around each. Six bordered cards inside a
     bordered panel inside a bordered strip is three nested frames to say one thing,
     and the frames were louder than the controls they held. A line and some air do
     the same job — the title is what names the section, and it was doing that
     already. */
  #voiceedit .vegroup { width: auto; margin: 0; padding: 0; gap: 0;
                        background: none; border: none; border-radius: 0; }
  /* No rules at all in the end. A heading with space around it already says where one
     section stops and the next starts; the line was a second answer to a question that
     had been answered. Centred, like every other card title on the desk — the effects
     rack does it, the send returns do it, and a panel inside the rack should not be
     the one place that does not. */
  #voiceedit .vegroup + .vegroup { margin-top: 15px; }
  #voiceedit .vegroup .devbar { padding: 0 0 6px; }
  #voiceedit .vegroup h4 { font-size: 11px; letter-spacing: .06em; }
  /* Two columns of controls: an envelope reads as a shape when its four numbers are
     side by side, and as a list when they are stacked. Tight enough for a 310px strip —
     the label and the value share a line, and the slider gets the one under it. */
  /* Three columns of pots that fill left-to-right. The effects rack's own .devgrid
     flows the other way — down four rows, then into a new 168px column, which is right
     for a panel that can grow sideways and wrong for one pinned to a strip's width: the
     second column landed off the edge and every group came out as a single stack.
     Both the flow and the fixed rows have to be undone, not just the columns. */
  /* The ROW gap has to clear a POT, not a line of text. A potrow is its label stacked
     straight onto a 42px ring, and `.vepot` pulls whatever follows up by 3px of its
     own — so at the 1px this started on, a second row of pots put its labels 2px INTO
     the rings above them. 11px leaves 8px of daylight. One number, and every card in
     both editors depends on it: the synth groups, the drum sections and Taps are all
     this same grid. */
  /* The column gap was 2px, which is a hairline — enough between two pots, whose knobs
     leave their own air, and nothing at all between two pill groups, whose frames run
     to the edge of their cell. SHAPE and SLOPE side by side read as one eight-button
     control with a seam in it. Giving the grid a real column gap fixes both cases at
     once: the frames stop touching, and the pots gain a little air they were short of
     anyway. */
  #voiceedit .devgrid { display: grid; grid-auto-flow: row;
                        grid-template-columns: repeat(4, 1fr);
                        grid-template-rows: none; grid-auto-columns: auto; gap: 11px 8px; }
  #voiceedit .devgrid .row { margin: 0; }

  /* ---- pots -----------------------------------------------------------------
     The name over the knob and the reading inside its ring — the layout of every
     hardware panel, and the reason a pot fits in a third of the width a slider needed:
     a slider has to be long enough to aim along, where a knob only has to be big
     enough to grab. */
  /* `gap: 5px`, not 0. The name and the knob are two things, and set flush the label
     reads as part of the ring rather than as a caption over it — which is what makes a
     column of pots look like a wall. The knob's own -3px bottom margin was pulling the
     next row up into the same crowd, so it goes too. */
  #voiceedit .potrow { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  #voiceedit .potrow .k { font-size: 9.5px; letter-spacing: .03em; color: var(--dim);
                          text-transform: uppercase; text-align: center; line-height: 1.15;
                          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                          max-width: 100%; }
  /* The unit belongs to the name, not to the reading — there is no room for it in the
     ring, and it never changes, so it is chrome rather than data. */
  #voiceedit .potrow .kunit { color: var(--faint); }
  /* The same 42px as the pan pots on every strip: one knob size on the desk, so a
     preset's filter feels like the pan it is sitting beside rather than like a smaller
     relative of it. Four fit across because the LABEL is what sets the column width,
     not the knob. */
  #voiceedit .vepot { width: 42px; height: 42px; margin: 0 auto; }
  /* Small enough for `200ms` inside the ring — the reading is the point of a pot, and
     a value abbreviated to fit is a pot you cannot read. */
  #voiceedit .vepot .pottext { font-size: 8px; }
  #voiceedit .vepot .potface { r: 13; }
  #voiceedit .potrow .panin { font-size: 9px; }

  /* ---- segmented pills --------------------------------------------------------
     A set of four you can see beats a menu that hides three of them. Spans the group's
     full width, so it reads as one control rather than as buttons that happen to be
     adjacent. */
  /* Name centred OVER its pills, and two picks to a row.
     This was one line per pick — a 74px label column, then the pills across the rest
     of the card — which is the shape a pick had when it was the only one in its group.
     CARRIER and MODULATOR are a pair, and as two full-width lines they read as two
     unrelated controls that happen to be adjacent, with most of the width spent on a
     word. Stacked and halved they read as what they are, and they match `.potrow`
     right next to them, which has always been a centred name over its control. */
  /* 13.5px, which is the pot's 5 — see `.potrow` — plus the 8.6 of nothing that comes
     before a pot's ring actually starts.
     The two controls are not the same KIND of box. A pill row's top edge is its border,
     so 5px of gap is 5px of visible space. A pot is a 42px SVG with the ring drawn at r13
     in a 44-unit view, so its ink begins 8.6px down and the same 5px gap reads as 13.6.
     Setting both rows to `gap: 5px` is the version of this that measures identical and
     looks wrong, which is where this started: what the eye compares is the space between
     the WORD and the CONTROL, and a transparent margin inside an SVG is part of it. */
  #voiceedit .devgrid .segrow { grid-column: span 2; display: flex; flex-direction: column;
                                align-items: stretch; gap: 13.5px; margin: 0; min-width: 0; }
  /* Every pick is half a card, including one that is alone in its group.
     It used to take the full width there, on the reasoning that half a card of pills
     beside half a card of nothing looks unfinished. It does — but the cure was worse:
     WAVE stretched to four columns gave four pills 90px each, so the one control in the
     panel with the fewest, shortest labels became the biggest thing on it, and the
     picks stopped being one recognisable size. A standard width beats a full one, and
     the empty half beside a lone pick is quieter than a control shouting. */
  #voiceedit .devgrid .segrow.segwide { grid-column: span 2; }
  /* Alone in its group, a half-width pick sits in the MIDDLE of the four columns rather
     than hard left with two columns of nothing beside it. It keeps the standard width —
     one size for every pick is the point — and only its position changes, so WAVE under
     `Oscillator` reads as the group's control rather than as the first of a row that
     never arrived. */
  #voiceedit .devgrid > .segrow:only-child { grid-column: 2 / span 2; }
  /* ...except WAVE, which takes the whole card. It is the one pick with six or seven
     options where the rest have two to four — see the note in pickRow. Written with
     both classes so it out-specifies the centring rule above, which would otherwise
     park it in the middle two columns at half the width it needs. */
  #voiceedit .devgrid .segrow.segwide.segwave { grid-column: 1 / -1; }
  /* 9.5px AND 1.15, the same as a pot's name — both numbers, because both are part of the
     gap. A line-height of 1 gives the label no half-leading where the pot's 1.15 gives it
     0.7px top and bottom, so with the same `gap` the pills still sat closer to their name
     than the ring did to its. These sit in one grid on one row as each other, both
     centred over their own control, and half a pixel of difference between two labels
     doing the identical job is the kind of thing you feel as untidiness without
     locating. See `.potrow .k`. */
  #voiceedit .segrow .k { flex: none; width: auto; font-size: 9.5px; letter-spacing: .03em;
                          color: var(--dim); text-transform: uppercase; text-align: center;
                          line-height: 1.15; white-space: nowrap; overflow: hidden;
                          text-overflow: ellipsis; }
  #voiceedit .segrow .seg { flex: none; min-width: 0; }
  #voiceedit .seg { display: flex; gap: 2px; padding: 2px; background: var(--input);
                    border: 1px solid var(--line); border-radius: 6px; }
  #voiceedit .segbtn { flex: 1; width: auto; margin: 0; padding: 2px 1px; font-size: 8.5px;
                       font-weight: 700; letter-spacing: .02em; color: var(--dim);
                       background: none; border: none; border-radius: 4px;
                       white-space: nowrap; min-width: 0; }
  #voiceedit .segbtn::after { content: none; }
  #voiceedit .segbtn:hover { background: var(--hover); color: var(--ink); }
  /* Filled, with dark text on it — the selected pill is the one thing in the panel
     that has to be readable at a glance from across the rack. */
  #voiceedit .segbtn.on { background: var(--accent); color: var(--on-accent); }
  #voiceedit .segbtn.on:hover { background: var(--accent); color: var(--on-accent); }
  /* A control that does not currently apply — fat stack width on a single
     oscillator, glide on a polyphonic preset. Greyed and inert rather than removed:
     a row that vanishes takes its own explanation with it, and everything below it
     jumps up into the gap while you are still looking at the pill that did it. */
  #voiceedit .vedisabled { opacity: 0.32; pointer-events: none; }
  #voiceedit .veswitch { width: auto; flex: none; margin-left: auto; padding: 2px 8px;
                         font-size: 9px; letter-spacing: .06em; }
  #voiceedit .veswitch.on { background: var(--primary); color: var(--accent); border-color: var(--primary); }
  /* The tap stepper: a count with a button either side, on one row. */
  #voiceedit .veinline { display: flex; align-items: center; justify-content: space-between; }
  #voiceedit .vestep { display: flex; align-items: center; gap: 2px; }
  #voiceedit .vestep button { width: 20px; padding: 1px 0; text-align: center; }
  #voiceedit .vestep .v { min-width: 16px; text-align: center; }
  #voiceedit .devnote { grid-column: 1 / -1; }
  /* Three buttons of one size, and no rule above them. The rule was fencing off a peak
     readout and an UNSAVED flag that have both gone: the flag was the save button said
     twice — it is dark until there is something to write — and the peak moved to the
     save sheet, where it is next to the thing you would do about it. */
  #voiceedit .vefoot { display: flex; align-items: stretch; gap: 5px; margin-top: 8px; }
  /* Equal thirds: same flex, same padding, same font. The save button keeps its colour
     but not extra width — a wider primary made the row read as two sizes of control. */
  #voiceedit .vefoot > button { flex: 1 1 0; width: auto; min-width: 0; margin: 0;
                                padding: 5px 6px; font-size: 10px; white-space: nowrap; }
  /* The caret on .devlink says "this opens a menu". Nothing in this row does. */
  #voiceedit .vefoot .devlink::after { content: none; }
  #voiceedit .veclose::after, #voiceedit .veswitch::after, #voiceedit .vestep button::after { content: none; }
  #voiceedit .vedanger:hover { background: var(--hot-wash); color: color-mix(in srgb, var(--hot) 62%, var(--ink)); }
  #voiceedit .vesave { color: var(--accent); background: var(--primary); border: 1px solid var(--accent-line);
                       border-radius: 4px; }
  .vesheet-backdrop .venote::placeholder { color: var(--dim); }
  .vesheet-backdrop .vesave { color: var(--accent); background: var(--primary);
                              border: 1px solid var(--accent-line); border-radius: 4px; }
  .vesheet-backdrop .vesave:disabled { color: var(--faintest); background: var(--input);
                                       border-color: var(--line); }
  .vesheet-backdrop .velevel { display: flex; align-items: baseline; gap: 7px; padding: 5px 7px;
                               background: var(--input); border: 1px solid var(--line); border-radius: 4px; }
  .vesheet-backdrop .velevelnum { flex: none; font-size: 11px; color: var(--ink);
                                  font-variant-numeric: tabular-nums; }
  .vesheet-backdrop .velevelsays { font-size: 9px; line-height: 1.35; color: var(--dim); }
  .vesheet-backdrop .velevel.bad { border-color: var(--solo-line); background: var(--solo-wash); }
  .vesheet-backdrop .velevel.bad .velevelnum,
  .vesheet-backdrop .velevel.bad .velevelsays { color: var(--solo); }

  /* The level, on the save sheet: the number, then what it means for the sound. Amber
     only when there is something to do about it — a normal estimate is a reading, not
     a warning. */
  #voiceedit .velevel { display: flex; align-items: baseline; gap: 7px; padding: 5px 7px;
                        background: var(--input); border: 1px solid var(--line); border-radius: 4px; }
  #voiceedit .velevelnum { flex: none; font-size: 11px; color: var(--ink);
                           font-variant-numeric: tabular-nums; }
  #voiceedit .velevelsays { font-size: 9px; line-height: 1.35; color: var(--dim); }
  #voiceedit .velevel.bad { border-color: var(--solo-line); background: var(--solo-wash); }
  #voiceedit .velevel.bad .velevelnum,
  #voiceedit .velevel.bad .velevelsays { color: var(--solo); }
  /* ---- The editor as a WINDOW -------------------------------------------------
     Opened from the library there is no strip to sit beside, so it floats: the same
     panel, the same controls, in the keyboard's clothes rather than the rack's. It
     gives back the rack geometry it borrows from `.voicepair` — a fixed height tied to
     `--striph` is a height that belongs to a row of strips — and takes a window's
     frame, shadow and its own scroll. */
  #voiceedit.vefloat { position: fixed; z-index: 14; left: 0; top: 0;
                       height: auto; max-height: min(660px, 82vh);
                       border-radius: 8px; box-shadow: 0 18px 44px color-mix(in srgb, var(--deep) 66%, transparent); }
  /* No lane behind it, so no lane colour: the header wears the desk's own line rather
     than a wash borrowed from whichever strip was last placed. */
  #voiceedit.vefloat .vehead { cursor: grab; border-radius: 7px 7px 0 0;
                               background: none; border-bottom: 3px solid var(--line); }
  #voiceedit.vefloat .vehead.dragging { cursor: grabbing; }
  #voiceedit.vefloat .vetag { color: var(--dim); }

  /* ---- and docked in the preset library ---------------------------------------
     Its third home. Beside a strip it is a rack item with the rack's height; floating
     it is a window; here it is a column of the library's own layout, so it gives up
     the frame and the shadow and takes its height from the band it sits in. */
  #voiceedit.vedocked { position: static; height: auto; align-self: stretch;
                        min-height: 0; width: calc(var(--stripw) * 3 + 12px);
                        background: none; border: none; border-radius: 0;
                        box-shadow: none; padding: 0 0 0 2px; }
  /* The width stays three strips — it is the column the controls were laid out for, and
     widening it only stretched the gaps between things that were already the right
     distance apart. What this panel has that the rack's does not is HEIGHT: full window
     rather than one strip tall. So the extra room is spent down the page, where sixteen
     pots stacked with rack-tight margins read as a wall. */
  #voiceedit.vedocked .devgrid { row-gap: 15px; }
  #voiceedit.vedocked .vegroup + .vegroup { margin-top: 24px; }
  #voiceedit.vedocked .vegroup h4 { margin-bottom: 6px; }
  #voiceedit.vedocked .row { margin-bottom: 5px; }
  #voiceedit.vedocked .vesub { margin-bottom: 16px; }
  #voiceedit.vedocked .vehead { margin: 0 0 10px; padding: 0 0 5px; border-radius: 0;
                                background: none; border-bottom: 1px solid var(--line);
                                cursor: default; }
  #voiceedit.vedocked .vetag { color: var(--dim); }
  /* Not a ✕ here — a chevron pointing the way it folds. See the note in build(). */
  #voiceedit.vedocked .veclose { top: 0; right: 0; }
  /* Written with both classes so it beats `#voiceedit .veclose` above, which sets its
     own width and would otherwise leave the shared 28px box unapplied — and with it the
     alignment against the window's close, which is the whole point of the shared box.
     `right: 2px` is the last two pixels: the header's padding and the editor panel's
     differ by exactly that. */
  #voiceedit .veclose.vefold { width: 28px; height: 28px; padding: 0; right: 2px;
                               line-height: 0; display: inline-grid; place-items: center; }
  #voiceedit .vefold:hover { color: var(--accent); }

  /* ---- The step grid -------------------------------------------------------------
     One row per drum lane, sixteen squares a bar. A window like the library and the
     keyboard: you leave it open, run the loop and move a snare while it plays.

     The cells are sized as a click target rather than as a picture you read — 9px
     squares are fine for the second and not for the first. Everything else is the
     desk's own furniture: `--lane` for the lane's colour, `--accent` for on, the same
     panel and line vars. */
  /* ---- one window, one view ---------------------------------------------------------
     They were briefly two views of the effects region, which made them exclusive — and
     "move the snare while I'm looking at the bassline" is one job, not two. They are also
     scoped differently: the roll is THIS CHANNEL's part and belongs in this channel's
     panel, while the kit is the song's and belongs to nobody's strip. So the grid is a
     window again — its own frame, its own remembered position, dragged by its own header,
     open alongside the roll rather than instead of it.

     Sized to what it is showing, not to a number. One bar of sixteen steps is 460px of
     content in a 1052px window, and the 590px of desk showing through the rest of it
     read as a panel that had failed to load. `fit-content` follows the selection — four
     bars is four bars wide — and the max-width is what stops it running off the screen
     when the selection is longer than the window, at which point the body scrolls as
     it always did.

     Above the roll's z-index and below the menus: the roll is in the page, and a window
     you dragged over it is meant to stay where you put it. */
  #stepseq { position: fixed; z-index: 13; display: none; left: 0; top: 0;
             flex-direction: column; padding: 9px 8px;
             width: fit-content; max-width: min(1052px, calc(100vw - 16px)); max-height: 80vh;
             background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
             box-shadow: 0 18px 44px color-mix(in srgb, var(--deep) 66%, transparent); }
  /* The roll, by contrast, IS a view: it sits inside #devices and gives up the frame, the
     shadow, the remembered position and the drag. The region already has a fold, a
     splitter (#devsplit) and a measured height budget (--devh, capDevices, deviceRoom),
     so it inherits all of it rather than carrying its own. */
  /* The keyboard IS this panel's name column, so it spans the whole of it: from the
     caption line, where the first effect card starts in the other view of this panel, to
     the content line, where the note field has to begin. Both edges matter and they are
     set in two places — this padding puts the keys' front edge on the caption line, and
     --keys carries them to the content line, because the header cell and the grid overlay
     both measure from it. At 64px the roll's bar 1 was at x=76 while the ruler's was at
     254, and a roll whose bar lines disagree with the timeline's is a roll you cannot
     read a position off.
     The 6px is the strip of chassis the keys sit on — .ssqkey starts at 6 inside the
     cell — so it comes off the padding here and is added back into the width. */
  #pianoroll { --keys: calc(var(--contentx) - var(--capx) + 6px);
             display: flex; flex: 1; min-height: 0;
             flex-direction: column;
             padding: 4px 0 8px calc(var(--capx) - 6px);
             background: none; border: none; border-radius: 0; box-shadow: none; }
  /* The roll is always visible when the notes panel is open; the panel's .collapsed
     class hides it (see #notes.collapsed #pianoroll above).
     The step sequencer window is display:none by default and uses .show to appear. */
  #stepseq.show { display: flex; }
  /* The roll's own built-in header is hidden: the notes panel provides the header
     (#notehead) with the fold button and label, so there is no need for a second one
     inside the scroll area. The step sequencer window keeps its header for dragging. */
  #pianoroll .ssqhead { display: none; }
  /* The window's header, which is also its handle. */
  #stepseq .ssqhead { display: flex; align-items: center; gap: 8px; flex: none;
                      margin: -9px -8px 8px; padding: 8px 10px;
                      border-bottom: 1px solid var(--line); cursor: grab; }
  #stepseq.dragging .ssqhead { cursor: grabbing; }
  :is(#stepseq,#pianoroll) .ssqtitle { flex: 1; font-size: 11px; color: var(--ink); font-weight: 700;
                       text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  :is(#stepseq,#pianoroll) .ssqlink { width: auto; flex: none; padding: 3px 8px; font-size: 10px;
                      letter-spacing: .04em; color: var(--dim); background: var(--input);
                      border: 1px solid var(--line); border-radius: 3px; }
  :is(#stepseq,#pianoroll) .ssqlink.on { background: var(--primary); color: var(--accent); border-color: var(--primary); }
  /* `:not(.popclose)` is the whole point of this line. The window's ✕ already wears the
     desk's standard close — 28px square, a 19px mark, the same one on the keyboard, the
     preset library and the voice editor — but an ID in front of a class outranks a bare
     `.popclose`, so this rule was quietly shrinking it back to an 11px × in an 18px box.
     That is exactly the drift `.popclose` was written to end (see the note there, which
     names this panel as one of the three). The small box is for the panel's OWN little
     controls, like the `+`; the close is not one of them. */
  :is(#stepseq,#pianoroll) .ssqx:not(.popclose) {
                   width: auto; flex: none; padding: 2px 6px; font-size: 11px;
                   line-height: 1; color: var(--dim); background: none; border: none; }
  :is(#stepseq,#pianoroll) .ssqx:not(.popclose):hover { color: var(--hot); background: none; }
  /* Written `.ssqx.ssqadd` to match the specificity the `:not()` above added — a plain
     `.ssqadd` is one class lighter and lost its 17px glyph to it, which is a `+` shrunk to
     the size of the text beside it. */
  :is(#stepseq,#pianoroll) .ssqx.ssqadd { margin-left: -2px; font-size: 17px; color: color-mix(in srgb, var(--dim) 82%, var(--panel)); }
  :is(#stepseq,#pianoroll) .ssqx.ssqadd:hover { color: var(--ink); }
  /* Shared edits reach beyond the bars visible in the grid. Name those bars before
     the first cell, where the scope cannot be mistaken for a save-state indicator. */
  :is(#stepseq,#pianoroll) .ssqscope { display: flex; align-items: baseline; gap: 9px; flex: none;
                       margin: -1px 0 7px; padding: 6px 8px;
                       color: color-mix(in srgb, var(--dim) 55%, var(--ink)); background: color-mix(in srgb, var(--accent) 7%, transparent);
                       border-left: 3px solid var(--accent); border-radius: 2px;
                       font-size: 10px; line-height: 1.35; }
  :is(#stepseq,#pianoroll) .ssqscope strong { flex: none; color: var(--accent); font-size: 9px;
                              text-transform: uppercase; letter-spacing: .09em; }
  :is(#stepseq,#pianoroll) .ssqscope span { min-width: 0; }
  /* One scroller owns rulers AND lanes, so a wide selection cannot move out from under
     its bar numbers. The sticky left edge is the channel rack; the pattern scrolls.
     The air above is a MARGIN, not padding: a scroll container's top padding pushes the
     sticky constraint rect down with it, so the roll's rulers stuck two pixels low and
     the keyboard and the playhead scrolled up through the slot above them. */
  /* No `scrollbar-color` here — see the scrollbar block up top: it takes this element
     off the desk's own bar and back onto the browser's. */
  :is(#stepseq,#pianoroll) .ssqscroll { min-height: 0; overflow: auto;
                        margin-top: 2px; padding: 0 0 4px; }
  /* The roll's gutter is the desk's right margin, exactly as the arrangement's is —
     the panel hands the margin down to the scroller rather than spending it itself, or
     the two bars run down two lines twenty pixels apart. Stable so the field is the
     same width whether the channel has three lanes or thirty. */
  #pianoroll .ssqscroll { scrollbar-gutter: stable; }
  :is(#stepseq,#pianoroll) .ssqbody { position: relative; width: max-content; min-width: 100%; }
  /* One line down the whole field, positioned by `follow`. Hidden in the step grid,
     which says where the playhead is with a ring round the playing square — there a
     cell is a switch, and the ring is what points at one. */
  :is(#stepseq,#pianoroll) .ssqplayhead { position: absolute; top: 0; bottom: 0;
                      pointer-events: none; z-index: 2; display: none; }
  #pianoroll .ssqplayhead { display: block; background: color-mix(in srgb, var(--ink) 9%, transparent);
                      box-shadow: inset 1px 0 0 0 color-mix(in srgb, var(--ink) 55%, transparent); }
  /* The rows are the arrangement's rows: same height, same gutter, same number-then-name
     header cell, so the two panels read as one track list rather than two opinions about
     the kit. Only the cells to the right of it are different, because only they are. */
  :is(#stepseq,#pianoroll) .ssqrow { display: flex; align-items: center; height: 29px;
                     gap: 8px; width: max-content; min-width: 100%; }
  :is(#stepseq,#pianoroll) .ssqlane { border-radius: 4px; }
  :is(#stepseq,#pianoroll) .ssqlane:hover { background: var(--rowhover); }
  :is(#stepseq,#pianoroll) .ssqhead-cell { position: sticky; left: 0; z-index: 3; width: 190px; flex: none;
                           display: flex; align-items: center; gap: 6px; padding: 0 8px 0 4px;
                           align-self: stretch; background: var(--panel2);
                           box-shadow: 1px 0 0 var(--line); }
  :is(#stepseq,#pianoroll) .ssqlane:hover .ssqhead-cell { background: var(--panel2); }
  :is(#stepseq,#pianoroll) .ssqnum { flex: none; width: 24px; text-align: center; font-size: 9.5px;
                     color: var(--faint); font-variant-numeric: tabular-nums; }
  :is(#stepseq,#pianoroll) .ssqled { width: 7px; height: 7px; flex: none; border-radius: 50%;
                     background: var(--lane); box-shadow: 0 0 7px var(--lane); opacity: .9; }
  :is(#stepseq,#pianoroll) .ssqlane.unused .ssqled { background: var(--faintest); box-shadow: none; opacity: .45; }
  :is(#stepseq,#pianoroll) .ssqlane.muted .ssqled { background: var(--hot); box-shadow: none; opacity: .7; }
  :is(#stepseq,#pianoroll) .ssqname { flex: 1; min-width: 0; padding: 0; font-size: 12px; text-align: left;
                      color: var(--dim); background: none; border: none; white-space: nowrap;
                      overflow: hidden; text-overflow: ellipsis; text-transform: none; }
  :is(#stepseq,#pianoroll) .ssqrow:hover .ssqname { color: var(--ink); }
  /* The lane's figure list. Faint until the row is under the pointer — seven of these
     lit at once would be seven things asking to be clicked. */
  :is(#stepseq,#pianoroll) .ssqpick { width: 16px; height: 16px; flex: none; padding: 0; font-size: 9px;
                      line-height: 1; border-radius: 3px; color: transparent;
                      background: none; border: none; }
  :is(#stepseq,#pianoroll) .ssqrow:hover .ssqpick { color: var(--dim); background: var(--input); }
  :is(#stepseq,#pianoroll) .ssqpick:hover { color: var(--accent) !important; }
  /* A lane the song does not play yet. Still clickable — adding a rim is a click. */
  :is(#stepseq,#pianoroll) .ssqname.unused { color: var(--dim); opacity: .55; }
  /* Silenced by the arrangement. The steps are still there, which is why the row is
     struck through rather than hidden. */
  :is(#stepseq,#pianoroll) .ssqname.muted { color: var(--hot); text-decoration: line-through; }
  :is(#stepseq,#pianoroll) .ssqcells { display: flex; gap: 2px; padding-right: 8px; }
  /* Darker than the panel, not the same as it. This window is --panel2, so an idle
     cell drawn in that colour vanished and the grid read as four squares a bar. */
  :is(#stepseq,#pianoroll) .ssqcell { position: relative; width: 22px; height: 19px; flex: none; padding: 0;
                      border-radius: 3px; border: 1px solid var(--line2); background: var(--input);
                      box-shadow: inset 0 1px 0 rgba(255,255,255,.025),
                                  inset 0 -2px 0 rgba(0,0,0,.28); cursor: pointer; }
  /* Alternating groups and spacing already make the four-step beats legible. A second
     hard rule on every beat made the grid busier without adding another meaning. */
  :is(#stepseq,#pianoroll) .ssqcell.group-alt { background: var(--well); }
  :is(#stepseq,#pianoroll) .ssqcell:hover { border-color: color-mix(in srgb, var(--dim) 82%, var(--panel)); transform: translateY(-1px); }
  :is(#stepseq,#pianoroll) .ssqcell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  :is(#stepseq,#pianoroll) .ssqcell.on { background: var(--lane); border-color: rgba(255,255,255,.18);
                         box-shadow: inset 0 2px 0 rgba(255,255,255,.26),
                                     inset 0 -3px 0 rgba(0,0,0,.26),
                                     0 1px 4px rgba(0,0,0,.35); }
  /* Muted reads as "written but not let through": the hit is still drawn, dimmed. */
  :is(#stepseq,#pianoroll) .ssqcell.muted { opacity: .3; }
  :is(#stepseq,#pianoroll) .ssqcell.playing::after { content: ''; position: absolute; inset: -3px -2px;
                                     border: 1px solid color-mix(in srgb, var(--ink) 38%, transparent); border-radius: 4px;
                                     box-shadow: 0 0 3px color-mix(in srgb, var(--ink) 8%, transparent); pointer-events: none; }
  /* The beat and bar gaps are on the shared classes, not on `.ssqcell`, because the
     number strip is built out of the same per-step divs. Alignment by construction
     rather than by a width calculation that has to know about every gap and margin. */
  :is(#stepseq,#pianoroll) .gap { margin-left: 7px; }                 /* a gap on every beat */
  :is(#stepseq,#pianoroll) .barstart { margin-left: 15px; }           /* a wider one on every bar */
  :is(#stepseq,#pianoroll) .ssqbars { height: 18px; }
  :is(#stepseq,#pianoroll) .ssqnums { height: 18px; margin-bottom: 5px; }
  :is(#stepseq,#pianoroll) .ssqbarnum { width: 22px; flex: none; font-size: 9.5px; line-height: 13px;
                        color: var(--faintest); font-variant-numeric: tabular-nums;
                        white-space: nowrap; }
  /* The bar label sits in the first cell of its bar and is allowed out of it — the
     fifteen cells after it are empty, so there is nothing to run into. */
  :is(#stepseq,#pianoroll) .ssqbars .ssqbarnum { overflow: visible; color: var(--ink); font-weight: 700;
                                 letter-spacing: .05em; text-transform: uppercase; }
  /* A quiet backbeat hierarchy in the ruler: 1 and 3 anchor the count, while 2 and
     4 stay present but sit back. The cell grouping below follows the same alternation. */
  :is(#stepseq,#pianoroll) .ssqnums .ssqbarnum.beat { color: var(--faint); font-weight: 600; }
  :is(#stepseq,#pianoroll) .ssqnums .ssqbarnum.beat.group-alt { color: var(--faintest); font-weight: 400; }
  :is(#stepseq,#pianoroll) .ssqruler-label { z-index: 4; color: var(--faint); font-size: 8.5px;
                             text-transform: uppercase; letter-spacing: .08em; }

  /* ---- the roll: a keyboard down the side, a field of bars across -----------------
     Modelled on the thing it is a version of. A piano roll is not a grid of switches
     like the step grid — it is a KEYBOARD turned on its side with time running away
     from it, so the left column is drawn as keys and the field beside it is left plain
     and ruled rather than divided into cells. Boxing every possible note drew ten
     thousand empty squares and made the eight real ones hard to find; vertical rules
     say where the beat is and let the notes be the only filled thing on screen.

     Row height is the step grid's, deliberately: they are two views of one song and a
     roll whose rows were half the height of the grid's read as a different tool. */
  /* Half the on-screen keyboard's key (KEY_W is 39), so a whole part fits without the
     rows becoming a target you have to aim at. Not the step grid's 29px: that panel
     shows eight drums, this one shows two to four octaves. */
  #pianoroll .ssqrow.ssqlane { height: 19px; }
  /* No gap between the keyboard and the field. The shared row puts 8px there, which is
     right for the step grid — a track name wants air before its switches — and fatal
     here: the grid overlay measures from `--keys`, so the field started eight pixels
     right of its own lines and every note drew eight pixels off the beat it was on. The
     ruler carries the same gap, which is why the numbers looked correct and the lines did
     not. The field and the lines have to start on the same x, so the gap goes. */
  #pianoroll .ssqrow { gap: 0; }
  /* Clipped to the keyboard's width. With the gap gone there is nothing between this and
     the first bar number, so a label wider than the column ran straight into it. */
  #pianoroll .ssqruler-label { overflow: hidden; white-space: nowrap; }
  #pianoroll .ssqhead-cell { width: var(--keys); gap: 0; padding: 0 0 0 6px; }

  /* ---- the keys ------------------------------------------------------------------
     The on-screen keyboard's own board, turned on its side: same faces (#e9ecf2 and
     #171b22), same moulding, and the same trick for the seam between two whites — the
     air is a TRANSPARENT BORDER with the face clipped inside it, so the gap is chassis
     showing between two keys rather than a line painted on one. Every shadow that ran
     down a key now runs across it, and the black key's drop shadow falls RIGHT, toward
     the field, which is what makes the black row read as raised above the white row
     instead of as holes cut in it.

     The keys are ABSOLUTELY POSITIONED and sized in pixels by keyGeometry() in
     mixer-piano-roll.js, because a white key is taller than its row: seven whites span
     twelve semitones, so each one takes the half-row of the blacks beside it. The field
     to the right keeps one equal row per semitone — this is a picture of a keyboard,
     not a remapping of the pitch axis, and no note is hidden by it. */
  #pianoroll .ssqhead-cell { position: sticky; overflow: visible; }
  #pianoroll .ssqkey { position: absolute; left: 6px; right: 0; margin: 0;
                       padding: 0 6px 0 0; display: flex; align-items: center;
                       justify-content: flex-end; cursor: pointer; font-size: 8px;
                       letter-spacing: .04em; text-transform: none;
                       font-variant-numeric: tabular-nums; }
  /* Contiguous, with a 1px seam and barely any rounding: adjacent whites have to read as
     one board rather than a stack of lozenges, which is what a 2px gap and a 5px radius
     made them. The seam is a transparent bottom border with the face clipped inside it,
     so it is chassis showing between two keys rather than a line drawn on one. */
  #pianoroll .rollwhite .ssqkey { z-index: 1;
                       background-color: #e9ecf2; color: #737b8a;
                       border: none; border-bottom: 1px solid transparent;
                       background-clip: padding-box;
                       border-radius: 0 2px 2px 0;
                       box-shadow: inset 0 3px 4px -2px rgba(20,26,38,.40),
                                   inset 0 -5px 5px -4px rgba(20,26,38,.45),
                                   inset -3px 0 4px -3px rgba(20,26,38,.30),
                                   inset 0 1px 0 rgba(255,255,255,.55); }
  /* Over the whites, and narrower — but still a whole row tall, so a black note is no
     harder to hit than a white one. */
  /* Shorter as well as narrower, and it stops well before the front edge — that length
     difference is most of what says "black key". */
  #pianoroll .rollblack .ssqkey { z-index: 2; right: 44%;
                       background-color: #171b22; color: #7d8695;
                       border: none; border-radius: 0 4px 4px 0;
                       box-shadow: 3px 0 5px rgba(0,0,0,.55),
                                   inset 1px 0 0 rgba(255,255,255,.10),
                                   inset -6px 0 6px -4px rgba(0,0,0,.75); }
  #pianoroll .rollwhite .ssqkey:hover { background-color: #f2f4f8; }
  #pianoroll .rollblack .ssqkey:hover { background-color: #232833; }
  /* A black row's header carries NO face of its own — the whites either side bleed into
     it and meet in the middle, which is what a keyboard looks like from above. All it
     draws is the strip of chassis down the left, and it stacks above the white rows so
     its key lands on top of them. */
  /* ---- the keyboard is ALWAYS in front ---------------------------------------------
     A note is a rectangle that can be several cells long, and the field scrolls under a
     sticky keyboard — so notes reach the column constantly and must pass behind it. The
     numbers matter because they were once close enough to tie: a selected note is
     lifted (see `.sel` below) and at the same z-index as a white key it won on DOM
     order, drawing itself across the keys. Nothing in the field may reach these. */
  #pianoroll .rollwhite .ssqhead-cell { z-index: 8; background: var(--panel2); }
  #pianoroll .rollblack .ssqhead-cell { z-index: 9;
                       background: linear-gradient(to right, var(--panel2) 6px, transparent 6px); }
  #pianoroll .ssqlane:hover .ssqhead-cell { background: var(--panel2); }
  #pianoroll .rollblack.ssqlane:hover .ssqhead-cell {
                       background: linear-gradient(to right, var(--panel2) 6px, transparent 6px); }
  /* The field. No cell boxes at all — the rules are the grid. */
  /* Stretched, not centred: the cells have no height of their own now — they are rules
     drawn the full height of the row — so the strip they sit in has to be the row. */
  /* ---- the grid ------------------------------------------------------------------
     Three lines, drawn as three repeating gradients: a step every 22px, a beat every
     four of those, a bar every sixteen. Brightest first, because the first background
     image is the topmost and a bar line lands on top of a beat line which lands on top
     of a step line.
     This is only possible because the roll zeroes the beat and bar MARGINS the step grid
     uses, so every cell is exactly 22px and the whole field is on one pitch. The colours
     are constant, painted over whatever the row is shaded, so a line is the same line all
     the way down — which is what a divider is. */
  #pianoroll .ssqcells { gap: 0; padding-right: 8px; align-self: stretch; }
  /* The rulers stay put while the keyboard moves under them. The roll is a whole
     instrument now — eighty-eight rows, most of them off-screen — so vertical scrolling
     is the normal way to work it, and a bar number that scrolls away with the notes is a
     bar number you have to scroll back for. Sticky rather than lifted out of the
     scroller: they have to keep moving SIDEWAYS with the bars, which is why they were
     put in there in the first place. A backing of their own, or the notes show through. */
  /* Above the keyboard as well as above the field: the corner where they cross belongs
     to the ruler, and the keys run to the top of the panel. */
  #pianoroll .ssqbars, #pianoroll .ssqnums { position: sticky; z-index: 10;
                        background: var(--panel2); }
  #pianoroll .ssqbars { top: 0; }
  #pianoroll .ssqnums { top: 18px; }
  /* The rows that are not drawn, as height and nothing else — see renderRows. */
  :is(#stepseq,#pianoroll) .ssqpad { flex: none; pointer-events: none; }
  /* ---- the grid, once -------------------------------------------------------------
     One overlay over the whole field: a step line every 22px, a beat every four of
     those, a bar every sixteen. Brightest first, because the first background image is
     the topmost and a bar line lands on a beat line lands on a step line.
     `left` is the sticky header's width, which is the one number this shares with the
     row layout — the field starts where the keyboard ends. It only works because the
     roll zeroes the beat and bar MARGINS the step grid uses, so every cell is exactly
     22px and the whole field is on one pitch. */
  :is(#stepseq,#pianoroll) .ssqrules { position: absolute; top: 0; bottom: 0; right: 0;
                        pointer-events: none; display: none; }
  #pianoroll .ssqrules { display: block; left: var(--keys); z-index: 1;
                        background-image:
                          repeating-linear-gradient(to right, var(--grid-hi) 0 1px, transparent 1px 352px),
                          repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 88px),
                          repeating-linear-gradient(to right, var(--seam) 0 1px, transparent 1px 22px); }
  /* No shadow, no border, nothing per cell: a cell is a hit target and nothing else.
     Drawing the grid on the cells meant one inset shadow per cell — six thousand of them
     across sixteen bars — and each one landed on a row with a different background, so a
     fixed line colour vanished on the shaded rows and showed on the light ones. That was
     the dashes. The grid is three gradients on the row instead, below. */
  #pianoroll .ssqcell { width: 22px; height: auto; align-self: stretch; margin: 0;
                        padding: 0; background: none; border: none; border-radius: 0;
                        box-shadow: none; }
  /* The black notes' rows carry a shade, the way the gaps between white keys do. It is
     what stops thirty-seven identical lanes reading as graph paper. */
  #pianoroll .rollblack .ssqcells { background-color: var(--rowshade); }
  /* ---- the chosen scale, ON the keyboard -------------------------------------------
     Which notes belong is marked on the KEYS, because that is where you look to answer
     "is this in the key" — and it is marked by giving an offscale key its own face,
     exactly as the on-screen keyboard does (#9aa2b0 / #131519), not by dimming one.
     Dimming was the first version and it was wrong: a white key at half opacity renders
     grey, which reads as a third kind of key rather than as "not in this scale".
     THE NOTE IS NEVER AFFECTED. An offscale row keeps its note at full colour, still
     plays it, and still lets you draw or erase there — a scale is a guide, and one that
     refused the accidental you wanted would be the instrument arguing with you. Only the
     key face and a shade in the field change. `steps` is null for Chromatic, so nothing
     is marked at all until you have chosen a key to be relative to. */
  #pianoroll .offscale .ssqcells { background-color: var(--rowshade-off); }
  #pianoroll .rollwhite.offscale .ssqkey { background-color: #9aa2b0; color: #6a7280; }
  #pianoroll .rollwhite.offscale .ssqkey:hover { background-color: #b6bdc9; }
  /* Blacks keep ONE face. #171b22 against #131519 is a difference you cannot see, so
     marking the scale on them bought nothing and cost them the look of a black key. They
     say which notes they are by being black; the field's shading still says which rows
     are out of the scale. */
  /* Home. The one key the others are heard against, so it gets the brightest face. */
  #pianoroll .rollroot .ssqkey { background-color: #c3cbd8; color: #4a525f; font-weight: 700; }
  #pianoroll .rollroot .ssqkey:hover { background-color: #d5dce7; }
  #pianoroll .rollroot .ssqcells { box-shadow: inset 0 -1px 0 0 color-mix(in srgb, var(--accent) 20%, transparent); }
  /* A note, drawn INSIDE its cell as a pseudo-element.
     It used to be the cell's own background with `margin: 3px 1px` for the inset — and a
     margin on a flex item moves the items after it, so every column to the right of a
     note sat two pixels further right than the same column one row up. Five notes in a
     row and the grid was ten pixels out of step with itself, which reads as the notes
     being off the beat. They never were. Nothing about a note may touch layout.
     FLUSH, and flat. It was inset three pixels and ringed with a dark border, which left
     every note floating in the middle of its cell instead of starting on the line it
     actually falls on — so a line of notes read as slightly off the beat when it was not.
     Nothing between the note and its own gridline. Flat fill and a 2px corner, like the
     blocks in the arrangement above: the same object at two scales, and both of them a
     picture of where a part plays rather than a control with a bevel on it.
     z-index puts it over the grid overlay. */
  #pianoroll .ssqcell.on { z-index: 2; }
  /* LENGTH is width on the pseudo-element, `--len` steps of it, set by the grid.
     Not a colspan and not a margin: a margin on a flex item moves every column after it
     (see above), and spanning cells would mean the cell you click is not the cell the
     note is on. The pseudo-element is free to overhang its own cell because it is out of
     flow — nothing about a note may touch layout, and this does not.
     It works here and would not in the step grid: the roll zeroes the beat and bar
     margins, so every cell is exactly 22px and `n × 100%` lands on the gridline. The
     grid keeps its margins, which is why it keeps one-step notes.
     `inset: 0 auto 0 0` rather than `inset: 0` — a right edge of 0 and a width fight,
     and `right` wins. */
  #pianoroll .ssqcell.on::before { content: ''; position: absolute; inset: 0 auto 0 0;
                           width: calc(var(--len, 1) * 100%);
                           background: var(--lane); border-radius: 2px; }
  /* Which of the two gestures a press would begin. `move` on the body of a note,
     `ew-resize` within a few pixels of its right end — the same as every DAW, and the
     only way the edge is discoverable rather than found by accident. Notes on vox and
     shout get `sizeable` withheld, so they say `move` all the way across. */
  #pianoroll .ssqcell.on { cursor: move; }
  #pianoroll .ssqcell.on.atedge { cursor: ew-resize; }
  /* ---- and the same thing said by a mode --------------------------------------------
     Auto reads where you press, so its cursors change under the pointer. The named
     tools do one thing wherever they land, so they say so with one cursor and the
     move/resize offers above are withdrawn — an offer the tool will not honour is
     worse than no offer. Erase shows what it is about to take: the note under the
     pointer goes red before it goes. */
  #pianoroll:is(.tool-draw,.tool-paint,.tool-erase) :is(.ssqcell,.ssqcell.on,.ssqcell.on.atedge) {
                        cursor: crosshair; }
  #pianoroll.tool-erase .ssqcell.on:hover::before { background: var(--hot); }
  /* Select never writes, so its pointer is the ordinary arrow over empty space and a
     move cursor over a note — the two things it can do. */
  #pianoroll.tool-select .ssqcell { cursor: default; }
  #pianoroll.tool-select .ssqcell.on { cursor: move; }
  /* ---- a set of notes ---------------------------------------------------------------
     Picked out by a ring rather than by a colour: the lane's colour is what says which
     part this is, and a selection that recoloured its notes would be saying the wrong
     thing loudly. The ring sits on the note's own rectangle, so a four-step note is
     ringed for its whole length. */
  #pianoroll .ssqcell.on.sel { z-index: 3; }
  #pianoroll .ssqcell.on.sel::before {
                        outline: 2px solid var(--ink);
                        outline-offset: -1px;
                        filter: brightness(1.18); }
  /* The rubber band. One element over the field, like the playhead, and it takes no
     pointer events — it is drawn while the pointer is busy elsewhere. */
  #pianoroll .ssqband { position: absolute; z-index: 6; pointer-events: none;
                        border: 1px solid color-mix(in srgb, var(--accent) 85%, transparent);
                        background: color-mix(in srgb, var(--accent) 14%, transparent);
                        border-radius: 2px; }
  /* The grab handle itself: a hairline at the note's right end, only while the pointer
     is on it. Drawn on the ::after, which the roll's cells otherwise do not use. */
  #pianoroll .ssqcell.on.atedge::after { content: ''; position: absolute; top: 0; bottom: 0;
                           left: calc(var(--len, 1) * 100% - 2px); width: 2px; z-index: 3;
                           background: color-mix(in srgb, var(--ink) 70%, transparent);
                           border-radius: 1px; pointer-events: none; }
  #pianoroll .ssqcell:hover { background: var(--cellhover); }
  #pianoroll .ssqcell.on:hover { background: var(--lane); filter: brightness(1.15); }
  /* The lane picker, the key and the scale used to be sized here. They are never
     inside #pianoroll any more — `headerHost` puts them in the Notes header — so
     their rules live with that header instead. See `.ssqhostbar` up there. */
  /* The shared cell's own states, undone. In the grid a cell is a switch and reads as
     one — a raised square that alternates shade by beat group, with a margin opening a
     gap every four. Here it is a slice of a continuous field, so the banding, the gaps
     and the lift all go. The RULER keeps its own alignment because those margins are
     removed from both strips at once; taking them off only the body would slide the
     bar numbers out of step with the notes under them. */
  /* `:not(.on)` matters: a note on an alternating group would otherwise be reset to
     transparent by this and draw as an empty outline — which is exactly how the bass's
     F2 and G2 came out while its A2 and C3 were solid. */
  #pianoroll .ssqcell.group-alt:not(.on) { background: none; }
  #pianoroll .ssqcell:hover { transform: none; border: none; }
  #pianoroll .ssqcell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #pianoroll .gap, #pianoroll .barstart { margin-left: 0; }
  /* No per-cell mark at all: the overlay above is the playhead now. */
  #pianoroll .ssqcell.playing::after { content: none; }


  /* ---- The preset library ------------------------------------------------------
     The catalogue as a place. Same columns as the picker it is a sibling of — and it
     borrows the picker's own furniture (`.fxgroup`, `.voicesearch`, `.voicekind`,
     `.vkind`) rather than restating it, because it is the same list and a second set of
     rules for it is a second thing to keep in step.
     A window, like the keyboard and like the editor it opens: you leave it up and work
     out of it, so nothing here is dismiss-on-click. */
  /* One workspace, not three windows. Header across the top, list and editor side by
     side in the middle, bench and keyboard along the bottom — the three things that
     were separately opened and separately placed, laid out once. */
  #voicelib { position: fixed; z-index: 13; display: none; left: 0; top: 0;
              flex-direction: column; padding: 9px 8px;
              width: min(1500px, 96vw); height: min(880px, 92vh);
              background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
              box-shadow: 0 18px 44px color-mix(in srgb, var(--deep) 66%, transparent); }
  #voicelib.show { display: flex; }
  /* Two columns. The editor runs the FULL height down the right because it is the
     tallest thing here; the keyboard goes under the LIST rather than under both, so it
     has the wide half to be wide in. `min-height: 0` throughout — the default
     `min-height: auto` on a flex child ignores overflow, so without it the children
     stretch the window past the screen instead of scrolling inside it. */
  #voicelib .vlmain { display: flex; gap: 10px; flex: 1; min-height: 0; }
  #voicelib .vlleft { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
  #voicelib .vledit { flex: none; display: flex; min-height: 0; align-self: stretch;
                      border-left: 1px solid var(--line); padding-left: 10px; }
  /* Empty until a preset is chosen — no border, no gap, so the columns have the width. */
  #voicelib .vledit:empty { display: none; }
  /* Folded: a rail wide enough to read the label down, and nothing else. */
