  #osk .oskpulse { width: 7px; height: 7px; border-radius: 50%; background: #39414d;

  #osk .oskkeys { position: relative; height: 86px; margin: 0 10px; }

  #osk .oskkey.black { height: 54px; background: #1a1d23; border: 1px solid #0d0f13;

     running under your hands reads as the track rather than as your own playing. */
  #osk .oskkey.white.sung { background: #a6e2d5; border-color: #7fc4b5; }

  #osk .oskpad:hover { border-color: var(--accent); color: var(--ink); }

  #toast {

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* Device panel: the selected channel's effect chain, laid out across the bottom
     where there is room for parameters — a 132px strip has none. */
  /* FIXED height, sized for the tallest effect card rather than sized to whatever
     is currently loaded. Auto-sizing meant the whole rack above jumped every time
     an effect was added or removed, which is disconcerting when you are mid-mix.
     Collapse it with the fold button if the space is needed. */
  /* Height in a variable, not inline: an inline height beats any class, so folding
     the panel left it collapsed but still holding its height open. */
  /* The shadow is cast up over the rack's bottom edge. When the rack scrolls, its
     own padding is below the fold and the strips are cut flush by the seam; a soft
     edge says "there is more below" where a hard one just looks like a lost margin. */
  #devices { flex: none; height: var(--devh, 204px); background: var(--panel);
             border-top: 1px solid var(--line); display: flex; flex-direction: column;
             box-shadow: 0 -7px 12px -7px rgba(0,0,0,.65); z-index: 1; }
  /* Folded when the user folds it and not before: a panel that opened and closed

  /* Same indent and same gap as every other panel header: the four folds run down one

             padding: 4px var(--gut) 4px var(--foldx);
             border-bottom: 1px solid var(--line); flex: none; }
  /* The same caption as TIMELINE, ARRANGEMENT and MIXER — three panels labelled one
     way and a fourth in bold ink was a heading that looked like a different rank. */
  /* One height for every card. A row of cards each stopping wherever its own last
     control happened to land reads as clutter; a rack reads as a rack. */
  /* overflow-x: SCROLL, not auto — the six pixels are held whether or not there is
     anything to scroll. On auto, the bar appears the moment a chain outgrows the
     window and takes its height out of the cards, so the whole rack jumps as you add
     the effect that caused it. (scrollbar-gutter only reserves the vertical one.) */
  #devrack { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 6px 12px 10px;

  /* flex: none on both — a flex column shrinks its items when content exceeds the

              font-size: 9px; letter-spacing: .04em; color: var(--dim);

  .checkrow:hover { color: var(--ink); }

  .devempty { color: var(--dim); font-size: 11px; padding: 14px 4px; }
  /* Selection is neutral: a pale edge, not a colour. Teal already means "this is on"
     all over the strip — an accent ring around the whole thing made the selected
     channel look like it was doing something. */
  .strip.selected { border-color: #78828f; box-shadow: 0 0 0 1px rgba(197,206,220,.3); }
  .strip .fxline { font-size: 8.5px; text-align: center; color: #5d6470; cursor: pointer;
                   padding: 3px 2px; margin-top: 4px; border-top: 1px solid var(--line);
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .strip .fxline.has { color: var(--accent); font-weight: 700; }

     IS the label, so there is nothing to abbreviate against. */
  /* content-box so the height JS reserves is exactly the buttons' block: with the
     page-wide border-box the padding ate into it and a single insert overflowed.
     No rule above it — the gap already says where the sends stop and the inserts
     start, and a line across every strip was just another thing to look past. */
  /* Air either side of the insert block: it is a different kind of thing from the
     rows above it and the pot below, and it was reading as part of both. The fader
     is sized from what is left, so it gives up the pixels.

     Less of it underneath than above, because the block already ends in the empty
     slot: a dashed outline is mostly air, so the separation from the fader is drawn
     rather than reserved, and 22px of margin under it was the gap twice. Still a
     little more above, where the sends stop at a solid row and the gap is the only
     thing saying so — but not the 14px it was: the first slot sits 2px down inside
     the block, which is a pixel or two of the same air already. */

     on the same line on every strip — with the block bottom-aligned, a channel with
     one effect put it level with another channel's third. */

     already holds, so the second effect is the same click as the first.

     Two ways to see it, because it answers two different questions. On the selected
     strip it is always there — you are working on this channel, and this is where
     the next effect lands. On any other strip it comes up under the pointer, which
     is the moment you are asking. Fourteen of them at once is a grid of empty boxes

  .pwrhit { position: absolute; left: 1px; top: 1px; bottom: 1px; width: 21px;

  .fxbtns button.dragging { opacity: .4; }
  .fxbtns button.dropzone { border-color: var(--accent); box-shadow: 0 -2px 0 var(--accent); }
  .fxbtns button { cursor: grab; }
  .fxbtns button:active { cursor: grabbing; }
  .pwrhit:hover { color: #fff; }
  .rmhit:hover { color: var(--hot); }

  .cross { stroke-width: 1.7; }
  .pwr { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.1;

<header>
  <!-- Left to right, in the order you use them: what you are mixing, how it plays,
       where it is, what you are doing to it, and what happens to the result. -->
  <!-- Just the symbol: which song is loaded is in the footer, where its name has
       room, and opening one is a gesture you make a few times an hour. -->

    <svg viewBox="0 0 16 16" class="songicon"><path d="M2 4.4h4.8L8.2 6H14v7.2H2z"/><path d="M2 4.4V3h4l1.4 1.4"/></svg>
  </button></div>

  <div class="hdiv"></div>

  <div class="grp transport">
    <button id="playstart" title="play from the top of the song">
      <!-- A rect, not a line: these icons are filled and never stroked, so a
           zero-width line draws nothing at all. -->
      <svg viewBox="0 0 16 16"><rect x="3" y="3.2" width="2.1" height="9.6" rx=".9"/><path d="M6.6 3.4 13 8l-6.4 4.6z"/></svg>
    </button>
    <button id="stop" title="stop, and go back to where playback started">
      <svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1"/></svg>
    </button>
    <button id="play" class="playbtn" title="play (space)">
      <svg viewBox="0 0 16 16"><path d="M4.5 3l8 5-8 5z"/></svg>
    </button>
    <button id="pause" title="pause where you are (space)">
      <svg viewBox="0 0 16 16"><rect x="4" y="3.5" width="3" height="9" rx="1"/><rect x="9" y="3.5" width="3" height="9" rx="1"/></svg>
    </button>
  </div>

  <div class="grp">
    <button id="clearsolo" title="nothing is soloed">S</button>
  </div>


  <div class="grp looptray">
    <button id="looptoggle" title="loop the region shown on the timeline">Loop</button>
    <select id="loopbars" title="how many bars the loop covers">
      <option value="1" selected>1 Bar</option>
      <option value="2">2 Bars</option>
      <option value="4">4 Bars</option>
      <option value="8">8 Bars</option>
      <option value="0">All</option>
    </select>
  </div>

  <div class="hdiv"></div>

  <!-- Telemetry, not text: each number in its own recessed window, so the row scans
       as a set of readouts rather than as a sentence. -->
  <div class="grp readouts">
    <span class="stat" title="bar under the playhead"><span class="label">Bar</span><span id="barnow">1</span></span>
    <span class="stat" title="position in the song"><span class="label">Time</span><span id="tnow">0:00</span></span>
    <span class="stat"><span class="label">BPM</span><span id="bpm">—</span></span>
    <span class="stat" title="rough load estimate"><span class="label">CPU</span><span id="cpu">~10%</span></span>
  </div>

  <div class="sp"></div>

  <div class="grp">
    <!-- Play the selected channel. Over here rather than by the transport: the
         transport is what the SONG does, and this is what you do. Two white keys and
         the black between them — small enough to read at 15px, and a piano rather
         than a computer keyboard, which is what it plays like. -->
    <button id="oskbtn" title="play the selected channel from a keyboard" aria-label="on-screen keyboard">
      <!-- One path, even-odd: the body is solid and the keys are HOLES in it, so the
           black keys are whatever is behind the icon. That is what makes it read on
           the panel and still read when the button lights up teal — a shape drawn in
           currentColor would go light-on-light there and the piano would vanish.
           The white keys divide only below the black ones, which is the half of a
           piano you can actually see. -->
      <svg viewBox="0 0 16 16" class="oskicon">
        <path class="body" fill-rule="evenodd" d="M3 3.4h10a1.4 1.4 0 0 1 1.4 1.4v6.4a1.4 1.4 0 0 1-1.4 1.4H3a1.4 1.4 0 0 1-1.4-1.4V4.8A1.4 1.4 0 0 1 3 3.4Zm1.7 0h2.2v5.4H4.7Zm4.4 0h2.2v5.4H9.1ZM5.35 8.9h.9v3.7h-.9Zm4.4 0h.9v3.7h-.9Z"/>
      </svg>
    </button>
    <button id="ab" title="Hold to hear the saved mix">A/B saved</button>
    <button id="undo" disabled title="⌘Z">Undo</button>
  </div>

  <!-- The drawer, and nothing else: writing the file is not a mix control, so it
       lives inside with the rest of what happens to the work. A dot here when this
       song is not in the file yet. -->
  <div class="grp project">
    <button id="more" title="the rest of it — save, files, reset, typeface">⋯</button>
  </div>
</header>

<div id="timeline" title="click to park the playhead here · double-click to play from here">
  <!-- Same fold, same place, same caption style as the arrangement below: the two
       rows are one column of panels, and this one had a hidden half. -->
  <div id="tlhead">
    <button id="tlfold" class="foldbtn folded" title="show the song sections" aria-label="show the song sections">
      <svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg>
    </button>
    <span class="label">timeline</span>
  </div>
  <div id="barsarea">
    <div id="ruler"></div>
    <div id="blocks"></div>
    <div id="loopregion"></div>
    <!-- The bars picked in the arrangement grid, shown up here where the numbers
         are: a range is a range of the song, not of one lane's row. -->
    <div id="selregion"></div>
    <div id="playhead"></div>
  </div>
</div>

<div id="arrange">
  <!-- The fold sits with the name it folds, on the left where the eye starts. -->
  <div id="arrhead">
    <button id="arrfold" class="foldbtn" title="collapse the arrangement" aria-label="collapse the arrangement">
      <svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg>
    </button>
    <span class="label">arrangement</span>
    <span class="sp" style="flex:1"></span>
  </div>
  <div id="arrgrid"></div>
</div>

<!-- Drag to give the arrangement more or less of the window; double-click to hand
     it back to the automatic fit. -->
<div id="arrsplit" title="drag to resize the arrangement · double-click to fit automatically"></div>

<!-- The mixer's header, with the track-family switches running along it above the
     strips they filter — one button per family, each as wide as a strip. -->
<div id="mixhead">
  <div class="capgrp">
    <button id="mixfold" class="foldbtn" title="collapse the mixer" aria-label="collapse the mixer">
      <svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg>
    </button>
    <span class="label">mixer</span>
  </div>
  <div id="lanefilter"></div>
</div>

<div id="rackwrap">
  <div id="masterslot"></div>
  <div id="rack"><div id="sendslot"></div></div>
</div>

<div id="devices">
  <div id="devhead">
    <button id="devfold" class="foldbtn" title="collapse the effects panel" aria-label="collapse the effects panel">
      <svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg>
    </button>
    <span id="devtitle" class="label"></span>
    <span class="sp" style="flex:1"></span>
  </div>
  <div id="devrack"></div>
</div>

<footer>
  <span id="nowsong" title="the song on the desk">—</span>
  <span id="pos">—</span>
  <span id="section"></span>
  <span id="peakinfo"></span>
  <span class="sp" style="flex:1"></span>
  <!-- Keys only. The double-click and the playhead nudge are both discoverable where
       they live — the timeline and strip heads carry the first in their tooltips, and
       ⋯ → Playhead ms is the other one's home — and a footer that lists everything
       stops being read at all. -->
  <span><b>space</b> play/pause · <b>L</b> loop · <b>1/2/4/8/0</b> loop bars · <b>←→</b> bar · <b>↑↓</b> channel · <b>M S R</b> mute/solo/reset · <b>B</b> bypass fx · <b>keyboard</b> play the channel · <b>right-click</b> a strip · <b>⌘Z</b> undo</span>
</footer>

<!-- The header holds what you touch while mixing; everything else lives here. -->
<div id="moremenu">
  <div class="ctxhead">this song</div>
  <!-- First item, because it is what the drawer is most often opened for. It carries
       its own state: disabled, dimmed and reading "Saved — matches the file" when
       there is nothing to write, rather than a live button that answers with a toast.
       updateStatus() sets both. -->
  <!-- One song, always: this drawer is headed "this song" and it means it. There is
       deliberately no "save every changed song" — writing several mixes in one go
       writes most of them from memory rather than from listening. -->
  <button id="save">Save to game</button>
  <button id="revert">Revert to the saved mix</button>
  <!-- The song's shape, as opposed to its balance. Hidden until this song has an
       arrangement at all, because on every other song it would be a button that
       undoes nothing. -->
  <button id="revertarr" hidden>Play the written arrangement</button>
  <!-- The way back into a version of mix.js that has already been overwritten.
       Revert above goes to what is on disk NOW; this goes to what was on disk before
       one of this desk's earlier saves, from the copies kept in .mix-history/.
       Loads into the draft, so it is audible and undoable before it is written — and
       only ever into THIS song's draft, whichever save the copy was taken for. -->
  <button id="history" title="put this song back to how it was in an earlier version of src/data/mix.js, from the copies kept every time this desk saves — this song only, no other is touched">Restore a previous save…</button>
  <!-- Hidden until this song has a deleted track. Delete is the one edit whose undo
       cannot live on the thing it removed — the row and the strip are both gone —
       so its way back lives here. updateStatus() shows it and counts it. -->
  <button id="restore" hidden>Restore deleted tracks…</button>
  <button id="resetsong">Reset every channel</button>
  <div class="ctxhead">files</div>
  <button id="renderwav" title="render this song offline through the real engine with this mix, and write dist/<slug>-mix.wav">Render WAV</button>
  <button id="auditionwav" title="render this mix and open it in tools/audition — a real AU plugin over it, its own GUI, previewed before you keep it">Audition through a plugin…</button>
  <button id="midi" title="download this song as a MIDI file">Export MIDI</button>
  <button id="importmidi" title="turn a .mid into a song and switch to it — same filename replaces">Import MIDI…</button>
  <input id="midifile" type="file" accept=".mid,.midi,audio/midi" hidden>
  <!-- Export only. "Import mix JSON" pasted an entry straight onto whatever song was
       on the desk, and a whole file straight onto every song at once — the two ways
       one song's balance could land on another's parts. A mix is balanced by ear
       against the song it was written for and means nothing on any other, so the desk
       has no way to move one. This is a copy of your unsaved drafts, and that is all. -->
  <button id="export" title="download your unsaved drafts as JSON — a copy to keep, not a way to load a mix onto a song">Export mix as JSON</button>
  <div class="ctxhead">desk</div>
  <label class="morerow"><span>Font</span><select id="font" title="typeface for the desk"></select></label>
  <!-- Where the line sits against what you hear. Positive moves it right (later);
       only an ear can settle the last few milliseconds of it. -->
  <label class="morerow"><span>Playhead</span>
    <input id="phoffset" type="number" min="-300" max="300" step="5" value="50"
           title="milliseconds to shift the playhead right — raise it if the line lags behind what you hear.
[ and ] nudge it by 10 while the song plays, which is the easier way to find it.">
    <span class="unit">ms</span>
  </label>
</div>
<div id="songpicker"></div>
<div id="ctxmenu"></div>
<div id="notepop"></div>
<div id="fxpicker"></div>
<div id="voicepicker"></div>
<!-- The preset editor. A window, not a menu, for the same reason the keyboard below is:
     you leave it open and work — play the song, move a fader, hit a key — while the
     sound changes under you. So it does not close on a click elsewhere, and its ✕ is
     the only way out. Built in tools/mixer-voice-editor.js. -->
<div id="voiceedit"></div>
<!-- The on-screen keyboard. A window rather than a menu: it is something you leave
     open while you work on a channel, so it does not close when you click away and it
     goes where you put it. Built in mixer-entry.js — the keys change with the octave
     and the channel. -->
<div id="osk"></div>
<div id="toast"></div>
<div id="gate"><button id="start">Click to start audio</button></div>
<pre id="err"></pre>

<script>
  window.onerror = (m, s, l, c, e) => {
    document.getElementById('err').textContent += (e && e.stack ? e.stack : m) + '\n';
  };
</script>
