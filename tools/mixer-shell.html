<!doctype html>
<meta charset="utf-8">
<title>MASHENSTEIN — Song Mixer</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --panel2: #24282f; --line: #333944;
    --ink: #e6e9ef; --dim: #8b93a3; --accent: #4ec9b0; --hot: #e5534b;
    /* Sliders are the bulk of the surface — 200 of them in teal made the accent
       read as the background rather than as meaning. They go slate; teal is kept
       for things that are ON, SELECTED or MOVING. */
    --ctl: #79839a; --ctl-hi: #9aa5bd;
    /* The bar ruler and the arrangement rows must share one geometry or the
       columns do not line up. Both inset by the gutter plus the name column. */
    /* The name column is also the master's column, and now the track-group filters'
     column beside it — wide enough for both, which the lane names were glad of too:
     at 170 "Lead-Harmony" and "Hats-Closed" were both cut off. */
  --gut: 12px; --arrname: 212px; --namegap: 6px; --arrrow: 26px; --stripw: 118px;
    /* Where the fold column starts. It used to be the gutter plus four, which put the
       chevrons a fifth of the name column in from the edge — far enough that the four
       of them read as indented rather than as the desk's left margin. Everything that
       lines up with them (the lane numbers, the caption width) is written off this,
       so moving it moves the column and nothing else. */
    --foldx: 6px;
    --solo: #d9a441;
    /* The limiter is the one switch on the desk that is not teal when it is on. Teal
       is every other ON, and this one is different in kind: it is the only control
       that changes what leaves the desk rather than what happens inside it. Not red
       and not amber either — those are mute and solo, on every strip. */
    --lim: #a06ee0;
    /* Green means go, and only that: the transport's play button. */
    --go: #3fb950;
    /* Fader height is the desk's shock absorber: when the window is short the
       fader gives up pixels so the EQ and send rows above it stay on screen.
       fitStrips() measures the rack and overwrites this; the clamp is what you
       get before the first measurement. */
    --faderh: clamp(56px, 15vh, 150px);
    /* A parameter row is a readout line with a control under it, and --rowh is what
       those two come to. Named rather than left implicit because a row that is built
       some other way still has to stand exactly this tall: the delay's TIME is a
       slider when it is free and a select when it is synced, and when the two came
       out different heights, ticking Tempo Mode shunted every row under it up the
       card. Composed from the pieces, so a change of typeface moves both together. */
    --rowval: 10.5px; --rowlh: 1.3; --rowctl: 14px;
    --rowline: calc(var(--rowval) * var(--rowlh));
    --rowh: calc(var(--rowline) + var(--rowctl));
    /* Overwritten by the Font picker in the header, which only offers typefaces
       that are actually installed. */
    --font: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    /* Nothing here is a document: dragging across a fader label selected the words
       instead of moving the control, and there is no reason to select any of it.
       Text inputs and the error log opt back in below. */
    user-select: none; -webkit-user-select: none;
    background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font);
    /* Numbers line up column to column whatever the typeface is — a proportional
       font would otherwise make a rack of dB readouts dance as they change. */
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 8px 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; flex: none;
  }
  header .grp { display: flex; gap: 6px; align-items: center; }
  header .sp { flex: 1; }
  /* A hairline between one kind of thing and the next: the row was a dozen controls
     of equal weight, which reads as a list rather than as groups. */
  header .hdiv { width: 1px; align-self: stretch; margin: 2px 2px; background: var(--line); }
  /* The numbers travel together and none of them is a control. Each one sits in its
     own recessed window inside the tray — a readout you glance at, the way a console
     shows its telemetry, rather than four numbers set in body text. */
  header .readouts { gap: 4px; padding: 3px; border-radius: 9px;
                     background: #1a1e24; border: 1px solid #2c323b; }
  header .readouts .stat { display: flex; align-items: baseline; gap: 6px;
                           padding: 3px 8px; border-radius: 6px;
                           background: #0f1216; border: 1px solid #262c35; }
  header .readouts .stat .label { font-size: 9px; }
  /* Digits, lit: tabular so they never jitter as they count, and a trace of glow so
     the value reads as the lit part of the window and the caption as the label
     printed beside it. */
  header .readouts .stat > span + span { color: #e2eaf6; font-variant-numeric: tabular-nums;
                                         letter-spacing: .02em;
                                         text-shadow: 0 0 8px rgba(150, 210, 255, .16); }
  header .readouts .stat > span + span.dirty { color: var(--hot); text-shadow: none; }
  /* A tempo that is not the song's own — you are listening at it, not writing it. */
  header .readouts .stat > span + span.tweaked { color: var(--accent); }
  header .readouts .stat > span + span.draggy { cursor: ns-resize; }
  /* What happens to the work lives behind the drawer, not on the desk: the file is
     not something you mix, and a green Save button lit whether or not there was
     anything to save — with a red badge beside it saying so a second time — was the
     loudest thing in a header full of controls you actually touch.
     The tray stays, so the end of the row is still a cluster and not a loose button. */
  header .project { gap: 5px; padding: 3px; border-radius: 9px;
                    background: #262b33; border: 1px solid var(--line); }
  header .project button { border-color: transparent; background: #333a45;
                           border-radius: 6px; padding: 4px 9px; }
  header .project button:hover { background: #3e4753; }
  /* One mark for "this song is not in the file yet", on the button you press to do
     something about it. Drafts survive a reload, so this is never an alarm — it is
     the difference between the desk and the game, which is worth a dot and not a
     badge.
     Its own class rather than the desk's generic .dirty, which colours the text it
     is put on: the mark is the dot, and the ⋯ stays white — a red glyph reads as
     the button itself being the problem. */
  #more { position: relative; }
  #more.unsaved::after {
    /* On the corner rather than inside it: sitting in the button's own padding, the
       dot read as a fourth thing in a row of three. The ring is the tray behind it,
       so the dot keeps its edge wherever the button's own colour goes. */
    content: ''; position: absolute; top: -2px; right: -2px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--hot);
    box-shadow: 0 0 0 2px #262b33;
  }
  /* The loop controls are one thing, in the same tray as the transport. */
  .looptray { background: #262b33; border: 1px solid var(--line); border-radius: 9px;
              padding: 3px; gap: 3px; }
  .looptray button, .looptray select { border-color: transparent; background: #333a45;
                                       border-radius: 6px; padding: 4px 9px; }
  .looptray button.on { background: var(--accent); color: #10231f; }
  select, button, input[type=number] {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 9px; font: inherit; cursor: pointer;
  }
  select { max-width: 320px; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #10231f; border-color: var(--accent); font-weight: 700; }
  button.warn.on { background: var(--hot); color: #fff; border-color: var(--hot); }
  /* Transport, as a console has it: play from the top, stop, play, pause. Four
     small buttons in one tray rather than one word that changes meaning — a button
     labelled Play that sometimes says Stop cannot be aimed at without reading it. */
  .transport { display: flex; gap: 3px; background: #262b33; border: 1px solid var(--line);
               border-radius: 9px; padding: 3px; }
  .transport button { padding: 0; width: 34px; height: 26px; border-radius: 6px;
                      border-color: transparent; background: #333a45; color: #c6cedd;
                      display: grid; place-items: center; }
  .transport button:hover { background: #3e4753; border-color: transparent; color: #fff; }
  .transport button svg { width: 15px; height: 15px; fill: currentColor; }
  .transport .playbtn { background: var(--go); color: #08210f; }
  .transport .playbtn:hover { background: #56cc68; }
  .transport .playbtn.on { box-shadow: 0 0 0 2px rgba(63,185,80,.4); }
  .transport button:disabled { opacity: .4; }
  /* Lit whenever anything on the desk is soloed, anywhere — the one place that can
     always tell you, and the one click that puts it all back. */
  #clearsolo { width: 30px; height: 26px; padding: 0; font-weight: 700; color: #6b7482; }
  #clearsolo.on { background: var(--solo); border-color: var(--solo); color: #241a05; }
  .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .dirty { color: var(--hot); font-weight: 700; }

  /* The master strip is pinned right, so it never scrolls out of reach. */
  /* Transport position, DAW style: one segment per two-bar block of the song
     form, shaded by which section it plays, with the playhead riding over it. */
  #timeline { position: relative; height: 30px; background: var(--panel);
              border-bottom: 1px solid var(--line); flex: none; cursor: pointer;
              user-select: none; }
  #barsarea { position: absolute; top: 5px; bottom: 5px;
              left: calc(var(--gut) + var(--arrname) + var(--namegap)); right: var(--gut); }
  /* The fold sits in the column the ruler is inset by — space that was empty, and
     exactly where the arrangement's fold is, so the two line up down the page. */
  #tlhead { position: absolute; left: var(--foldx); top: 0; height: 30px;
            display: flex; align-items: center; gap: 8px; }
  /* Open: the ruler keeps its row and the section blocks take the one under it —
     half the height of an arrangement bar, because they are a key to the song's
     form and not another lane of it. */
  #timeline.sections { height: 44px; }
  #timeline.sections #ruler { bottom: auto; height: 20px; }
  #timeline.sections #blocks { display: flex; top: 24px; bottom: auto; height: 10px; }
  /* A bar ruler over the song form: numbers and ticks where a DAW puts them, so a
     position can be read off rather than counted. The coloured blocks below say
     which SECTION a bar belongs to — two different questions, two rows. */
  #ruler { position: absolute; inset: 0; }
  /* The numbered bars run the full height; the ones between are half-height ticks,
     so the row has a rhythm rather than a picket fence. */
  #ruler .tick { position: absolute; top: 50%; bottom: 0; width: 1px; background: #454d5a; }
  #ruler .tick.major { top: 0; background: #7d8794; }
  #ruler .tick span { position: absolute; left: 6px; top: 3px; font-size: 9.5px;
                      color: #aeb7c5; font-variant-numeric: tabular-nums; }
  /* The section-coloured blocks are parked, not deleted: the ruler answers "where am
     I" and the arrangement below answers "what is playing", which left the blocks
     saying something neither of them needed. One line brings them back. */
  #blocks { position: absolute; top: 15px; right: 0; bottom: 0; left: 0; display: none; gap: 1px; }
  #blocks .blk { flex: 1; border-radius: 2px; position: relative;
                 display: flex; align-items: center; justify-content: center;
                 font-size: 9px; color: #0d1013; font-weight: 700;
                 border-left: 1px solid rgba(0,0,0,.35); overflow: hidden; }
  #blocks .blk.second { border-left-color: rgba(0,0,0,.15); }
  #blocks .blk:first-child { border-left: 0; }
  #loopregion { position: absolute; top: 0; bottom: 0; background: rgba(78,201,176,.16);
                border-left: 2px solid var(--accent); border-right: 2px solid var(--accent);
                pointer-events: none; display: none; }
  /* The bars you have SELECTED, as opposed to the ones that are looping. White
     rather than teal, and hatched rather than filled, so the two can overlap and
     still be told apart — you very often loop the range you are about to edit. */
  #selregion { position: absolute; top: 0; bottom: 0; pointer-events: none; display: none;
               background: repeating-linear-gradient(45deg, rgba(255,255,255,.13) 0 4px,
                                                     rgba(255,255,255,0) 4px 8px);
               box-shadow: inset 1px 0 0 rgba(255,255,255,.55), inset -1px 0 0 rgba(255,255,255,.55); }
  #selregion.show { display: block; }
  /* A bar of the timeline whose arrangement drops lanes. Faint, because it is a
     detail of a bar rather than a different kind of bar. */
  #blocks .blk.muted { background-image: repeating-linear-gradient(45deg,
                       rgba(0,0,0,.28) 0 3px, rgba(0,0,0,0) 3px 6px); }
  #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--hot);
              box-shadow: 0 0 6px var(--hot); pointer-events: none; left: 0; }
  /* The clock lives up in the transport now — the strip under the ruler was a whole
     row of window spent on one number, a bar count the arrangement already marks,
     and a song length nobody was reading. */
  #tnow, #barnow { font-variant-numeric: tabular-nums; color: var(--ink); }
  /* Which bars each instrument actually plays in. The songs are two-bar blocks in
     a section order, so "where is the crash" is otherwise a listening exercise. */
  /* Capped at eight lanes and scrolled beyond that. It used to take 42vh, which on
     a 21-lane song was most of the window and left the channel strips too short to
     show their EQ rows. Eight is enough to read the shape of a song; the rest is a
     scroll, and the fold button is still there when you want the height back. */
  #arrange { flex: none;
             background: var(--panel); border-bottom: 1px solid var(--line);
             display: flex; flex-direction: column;
             max-height: calc(var(--arrrow) * 8 + 30px); }
  #arrange.collapsed #arrgrid { display: none; }
  /* The chevron starts where the rows' number column starts — both are written off
     --foldx, the cell adding back its own four, or the numbers run down a line to
     the right of the button they belong under. */
  #arrhead { display: flex; align-items: center; gap: 8px; flex: none;
             padding: 4px var(--gut) 4px var(--foldx); }
  /* A real scrollbar here, unlike the strips: with the panel capped at eight lanes
     there are usually more underneath, and nothing else on screen would say so. */
  /* The scrollbar eats 8px of the row width, so the right padding gives 8px back —
     the rows and the bar ruler above them have to keep the same geometry or the
     columns stop lining up. */
  /* No bottom padding: the height is snapped to whole lanes, and six pixels of
     padding is six pixels of the NEXT lane showing through under the last one. */
  /* Left inset follows the fold column, less the four the cell pads itself by, so the
     numbers stay under the chevron. The width the cell gives back is taken out of the
     name column below, which keeps the bars where the ruler expects them. */
  #arrgrid { overflow-y: auto; overflow-x: hidden;
             padding: 0 calc(var(--gut) - 10px) 0 calc(var(--foldx) - 4px); }
  /* Drawn, not overlaid: it is the only thing on screen that says there are more
     lanes under the ones you can see, and a thumb the colour of the panel says
     nothing at all. The track is always there so the space is never a surprise. */
  #arrgrid::-webkit-scrollbar { width: 10px; }
  #arrgrid::-webkit-scrollbar-track { background: #15181d; border-radius: 5px; }
  #arrgrid::-webkit-scrollbar-thumb { background: #525b6a; border-radius: 5px;
                                      border: 2px solid #15181d; }
  #arrgrid::-webkit-scrollbar-thumb:hover { background: #6c7688; }
  .arrrow { display: flex; align-items: center; height: var(--arrrow); gap: var(--namegap); }
  /* Mute, solo, name — one cell, exactly as wide as the ruler above is inset, so
     the bars still line up with the bar numbers. */
  /* Padding inside the cell, not around it: the cell's width is what the bar ruler
     above is inset by, so the buttons can have room without the columns drifting. */
  .arrhead-cell { width: calc(var(--arrname) + var(--gut) + 4px - var(--foldx));
                  flex: none; display: flex; align-items: center;
                  gap: 4px; padding-left: 4px; }
  /* Same width as the fold button above it, centred, so the numbers run down the
     column the chevron starts. */
  .arrnum { flex: none; width: 28px; text-align: center; font-size: 9.5px; color: #5c6473;
            font-variant-numeric: tabular-nums; }
  .arrrow.sel .arrnum { color: var(--ink); }
  .arrbtns { display: flex; gap: 2px; flex: none; }
  .arrbtns button { width: 19px; height: 18px; padding: 0; font-size: 9.5px; line-height: 1;
                    border-radius: 3px; color: var(--dim); }
  /* Same size as a channel strip's title: it is the same name, and reading it at
     two sizes in two places made them feel like two different lists. */
  .arrname { flex: 1; min-width: 0; font-size: 12px; color: var(--dim); text-align: left;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
             text-transform: capitalize; }
  /* Solo gets its own colour: two lit buttons in the same accent said nothing about
     which was which, and solo is the one you leave on by accident. */
  .solobtn.on { background: var(--solo); color: #241a05; border-color: var(--solo); font-weight: 700; }
  .arrrow:hover .arrname { color: var(--ink); }
  /* The selected lane, outlined end to end in the same pale edge its strip carries,
     so the two halves of the desk agree on which channel you are on. */
  .arrrow.sel { box-shadow: inset 0 0 0 1px rgba(197,206,220,.32); border-radius: 4px; }
  .arrrow.sel .arrname { color: #fff; font-weight: 700; }
  .arrbars { flex: 1; display: flex; gap: 1px; height: 20px; }
  .arrbars { gap: 0; }
  /* A bar is the unit you point at — the beats inside it are a picture of what it
     plays, not sixteen separate targets. */
  .arrbar { flex: 1; display: flex; cursor: pointer; min-width: 0; position: relative; }
  .arrbar:hover { outline: 1px solid var(--accent); outline-offset: -1px; }
  /* The bar you clicked. White against black, and standing a few pixels proud of
     the row: no single hue is legible against twenty-one lane colours — teal
     vanished into the lead and the hats — but a marquee edge is legible on all of
     them, and the height break catches the eye before the colour does. */
  .arrbar.sel::after {
    content: ''; position: absolute; inset: -3px -1px; pointer-events: none;
    border-radius: 3px;
    box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px rgba(0,0,0,.9),
                0 0 9px rgba(255,255,255,.4);
  }
  .arrcell { flex: 1; background: #23272e; margin-right: 1px; pointer-events: none; }
  /* A tick on every downbeat, so 64 beat-cells still read as bars at a glance. */
  .arrcell.barstart { box-shadow: inset 1px 0 0 #454c58; }
  #arrplay { position: absolute; width: 2px; background: var(--hot); pointer-events: none;
             opacity: .9; }
  /* A bar you can see without looking for it: taller, its own shade, and a grip in
     the middle that says which way it moves. */
  #arrsplit { flex: none; height: 11px; background: #171a20; cursor: ns-resize;
              border-top: 1px solid #2b313b; border-bottom: 1px solid #2b313b;
              position: relative; }
  #arrsplit::after { content: ''; position: absolute; left: 50%; top: 3px;
                     width: 64px; height: 3px; margin-left: -32px; border-radius: 3px;
                     background: #4d5665; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  #arrsplit:hover { background: #1c2028; }
  /* Gone with the arrangement it resizes — see setArrangeCollapsed. Its eleven
     pixels come off the page chrome too, so the rack takes them. */
  #arrsplit.hidden { display: none; }
  #arrsplit:hover::after { background: #8d97a6; }
  #arrsplit.dragging::after { background: var(--ink); }
  /* fitStrips sets min-height here, in pixels: exactly one whole strip. That is the
     floor the arrangement above shrinks against, and it is measured rather than
     guessed because a strip's height depends on the longest effect chain in the
     song, which no stylesheet can know. */
  /* Never a vertical scrollbar here. The strips are sized to the rack instead — the
     splitter reserves a whole strip plus its padding, so the only way to run out of
     height is a window too short for one, and then the strip's own body scrolls (an
     EQ row goes out of sight) with the fader and buttons staying where they are. */
  /* The same panel as the timeline, the arrangement and the effects: the mixer was
     the one section showing the page through it, which read as a hole between two
     panels rather than as the third one. */
  #rackwrap { flex: 1; display: flex; min-height: 0; overflow-y: hidden;
              align-items: flex-start; background: var(--panel);
              border-bottom: 1px solid var(--line); }
  /* overflow-x: SCROLL, not auto — the six pixels are held whether or not there is
     anything to scroll, so the strips are the same height on a song with seven
     channels and a song with twenty. On auto, hiding a track group or widening the
     window took the bar away and every fader in the rack jumped six pixels, which
     reads as the desk twitching at a click that had nothing to do with it. It is
     also what fitStrips measures — offsetHeight minus clientHeight — so the height
     the strips are given already has the bar taken off it.
     (scrollbar-gutter was here for this and cannot do it: it only ever reserves the
     vertical gutter, and this rack has no vertical scrollbar to reserve.) */
  #rack { flex: 1; display: flex; gap: 6px; padding: 10px; overflow-x: scroll; overflow-y: hidden;
          align-items: flex-start; }
  /* The master, in the column the arrangement spends on names — so the first channel
     starts exactly where bar 1 starts above it, and a strip sits under the lane it
     belongs to all the way up the page. The 10px comes off for the rack's own left
     padding, which is what puts the first strip on that line.
     Centred in the column: it is one strip in a space wide enough for a name, and
     hard against either edge it read as a strip that had come loose. */
  #masterslot { width: calc(var(--gut) + var(--arrname) + var(--namegap) - 10px);
                padding: 10px 0; display: flex; justify-content: center; flex: none;
                align-items: flex-start; }
  /* The mixer's own header: the same fold and caption the timeline and arrangement
     carry, so the page is three named panels down the left edge rather than two and
     an unlabelled rack. */
  #mixhead { display: flex; align-items: center; flex: none; gap: 0;
             background: var(--panel);
             padding: 4px var(--gut) 4px var(--foldx); }
  /* Folded: the caption row and nothing else. The family switches filter strips that
     are not on screen, so they would be four buttons that do nothing visible. */
  #mixhead.folded #lanefilter { display: none; }
  /* Exactly as wide as the column the master and the lane names share, so the buttons
     start where the strips start. */
  #mixhead .capgrp { width: calc(var(--gut) + var(--arrname) + var(--namegap) - var(--foldx));
                     flex: none;
                     display: flex; align-items: center; gap: 8px; }
  /* One button per track family, each the width of the strip it stands over. These
     hide channels from the RACK only — the arrangement keeps every lane, and nothing
     is muted: a song you are mixing has to keep sounding like the song while you are
     looking at four of its channels. */
  #lanefilter { flex: 1; min-width: 0; display: flex; gap: 6px; overflow: hidden; }
  #lanefilter button { display: flex; align-items: center; gap: 5px;
                       width: var(--stripw); flex: none;
                       padding: 3px 7px; font-size: 9.5px; letter-spacing: .05em;
                       text-transform: uppercase; color: var(--ink);
                       background: var(--panel2); border: 1px solid var(--line);
                       border-radius: 5px; }
  #lanefilter button .n { margin-left: auto; font-variant-numeric: tabular-nums;
                          color: var(--dim); }
  #lanefilter button .grpicon { width: 11px; height: 11px; flex: none; }
  /* Hidden reads as switched off, not as missing: the button stays where it was, so
     putting the tracks back is the same click that took them away. */
  #lanefilter button.off { color: #5b6371; background: #1b1f25; border-color: #262c35; }
  #lanefilter button.off .grpicon { opacity: .4; }
  /* All: lit when nothing is hidden, which makes it the state as well as the switch. */
  #lanefilter button.all.on { color: #10231f; background: var(--accent); border-color: var(--accent); }
  #rackwrap.collapsed { display: none; }
  /* The sends are the last two strips in the rack's own row. Same strips as the
     channels — same head, same insert slots, same fader.

     margin-left: auto, which is two behaviours in one property. With room to spare
     the auto margin eats it and they sit against the right edge, where the desk's
     shape is one line of channels and the returns at the end of it. When the
     channels overflow there is no spare room for it to eat, it resolves to zero,
     and they queue up immediately after the last channel — where scrolling to the
     end of the rack finds them, rather than pinned over the strips still scrolling
     underneath.

     No rule down their left edge: the strips are already boxes with their own
     borders, and a full-height line beside them drew a division the desk does not
     have — the sends are strips in the same rack, not a separate panel. */
  #sendslot { display: flex; gap: 6px; flex: none; align-items: flex-start;
              margin-left: auto; }
  /* Three zones: a pinned name, a scrolling control area, and a pinned fader.
     The strips outgrew short windows once channel delay was added, and what got
     clipped was the instrument name at the top — the one thing you always need. */
  /* Height comes from fitStrips: exactly what this song's strip needs, so a tall
     window leaves its slack as a band under the rack rather than as a hole in the
     middle of every strip between the send rows and the pan pot. */
  .strip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    width: var(--stripw); flex: none; padding: 6px 7px; display: flex; flex-direction: column;
    min-height: 0; height: var(--striph, auto);
  }
  .strip .striphead { flex: none; }
  /* Scrolls if it must, but never shows chrome for it — a scrollbar down every
     channel is visual noise across a whole rack. Rows are tight enough that a
     normal window never needs it. */
  .strip .stripbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
                      display: flex; flex-direction: column; gap: 2px; padding-top: 2px;
                      scrollbar-width: none; -ms-overflow-style: none; }
  .strip .stripbody::-webkit-scrollbar { width: 0; height: 0; display: none; }
  #rack::-webkit-scrollbar { height: 6px; }
  #rack::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .strip .stripfoot { flex: none; }
  /* The master carries no tint of its own: it is a strip like the rest, and its own
     column already says which one it is. A lighter panel and a blue border on top of
     that read as a different kind of control rather than as the same one. */
  .strip.send { background: var(--panel2); border-color: #39414f; }
  .fxsel { width: 100%; padding: 2px 4px; font-size: 10px; margin-top: 1px; }
  /* The lane's colour behind its name and underlining it, rather than as a hairline
     above it: the name is what you look for when you are hunting for a channel, so
     the colour belongs with the name and not floating over the top of the strip.
     Full-bleed to the strip edges, which is why the negative margins. */
  /* On the name's line, not above it: the number and the name are one label read
     left to right, and a digit floating in the corner above the word read as a
     badge stuck on the strip. The height matches the h3's line box so the two
     centre on each other whatever the name does. */
  .stripnum { position: absolute; left: 7px; top: 6px; height: 14px;
              display: flex; align-items: center;
              font-size: 9px; color: #626b7a; font-variant-numeric: tabular-nums;
              opacity: 0; transition: opacity .12s ease; }
  /* Under the pointer only. The number answers "which strip is 7?" — a question you
     ask of one strip at a time, when you are already on it — and fourteen digits down
     the rack the rest of the time is a column of noise beside the names that are the
     thing you actually read. The arrangement rows keep theirs: that IS the list. */
  .strip:hover .stripnum { opacity: 1; }
  .strip .striphead {
    /* Barely there, and rising INTO the coloured rule at the bottom rather than
       away from it: the top of the head is plain panel, and the hue only shows in
       the last few pixels, where it reads as the line's own glow. */
    background: linear-gradient(180deg, rgba(0, 0, 0, 0) 52%, var(--lanedim, transparent));
    border-bottom: 3px solid var(--lane, var(--line));
    margin: -6px -8px 5px; padding: 6px 6px 4px;
    border-radius: 5px 5px 0 0; position: relative;
    transition: background .14s ease, box-shadow .14s ease;
  }
  /* Hovering the head lights the lane's own colour rather than a generic grey: the
     head is the strip's handle, and the answer to "which one am I about to click"
     should be the same hue the rule under it already carries. The wash covers the
     whole head — a tint that only touched the last few pixels read as the rule
     thickening rather than as the panel lighting up — and it stays faint, deepening
     towards the line so the head still has a direction. */
  .strip .striphead:hover {
    background: linear-gradient(180deg,
                color-mix(in srgb, var(--lane, #7d8794) 9%, transparent) 0,
                color-mix(in srgb, var(--lane, #7d8794) 15%, transparent) 55%,
                color-mix(in srgb, var(--lane, #7d8794) 26%, transparent) 100%);
  }
  .strip .striphead:hover h3 { color: #fff; }
  .strip .striphead:hover .stripnum { color: var(--ink); }
  .strip.selected:hover .stripnum { color: var(--ink); }
  /* No colour bar beside the name: the family mark to its left is already drawn in
     the lane's colour, and two colour cues for one fact is one too many. */
  .arrname { padding-right: 4px; }
  /* Bold means selected, here and in the arrangement — with every name bold there
     was nothing left for the selected one to be. */
  /* Capitalised for reading, lowercase in the data: the lane keys are what the mix
     file is written against, and a display style must never leak into those. */
  .strip h3 { margin: 0; font-size: 11.5px; text-align: center; letter-spacing: .04em;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
              color: var(--ink); font-weight: 400; text-transform: capitalize; }
  .strip.selected h3 { color: #fff; font-weight: 700; }
  /* The word on the strip, in the lane's own colour. The family MARK is on the
     arrangement row instead — see groupIcon(). */
  .strip .grp-tag { text-align: center; font-size: 8.5px; letter-spacing: .07em;
                    text-transform: uppercase; color: var(--lane, var(--dim));
                    opacity: .95; margin: 0 0 3px; }
  .grpicon { width: 13px; height: 13px; flex: none; fill: none; stroke: var(--lane, var(--dim));
             stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
  .grpfill { fill: var(--lane, var(--dim)); stroke: none; }
  .arrrow:hover .grpicon { opacity: 1; }
  /* label + value on one line, full-width slider under it — a 130px strip has no
     room for all three side by side, which is what collapsed every track to a dot. */
  .row { display: flex; flex-direction: column; gap: 0; margin-bottom: 2px; }
  .row .head { display: flex; justify-content: space-between; align-items: baseline; }
  .row .k { color: var(--dim); font-size: 9.5px; letter-spacing: .03em; line-height: 1.3;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .resettable { cursor: pointer; }
  .resettable:hover { color: var(--accent); text-decoration: underline dotted; }
  .row.inert { opacity: .38; }
  .row.inert .v { font-style: italic; }
  .row .v { font-size: var(--rowval); color: var(--ink); font-variant-numeric: tabular-nums;
            line-height: var(--rowlh); padding-left: 4px; }
  .row .v.typable { cursor: ns-resize; }
  .row .v.typable:hover { color: var(--accent); text-decoration: underline dotted; }
  /* A note division reads left to right instead, because the select IS the value:
     stacking the readout over it showed the same setting twice, spelled two ways.
     The select takes the slack so the label and the reading keep their width. */
  /* The label sits on the row's FIRST line, exactly where a slider row's label sits,
     so ticking Tempo Mode does not slide TIME down the card while FEEDBACK under it
     stays put. Hence the grid: one track a text line tall, held to the top of a row
     that is still a full --rowh, with the select centred on that line and free to
     overflow into the space the slider would have occupied below it. Centring the
     contents in the whole row instead — the obvious thing — is what dropped the
     label by half a slider. */
  .row.divrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
                grid-template-rows: var(--rowline); align-content: start;
                align-items: center; gap: 0 4px; min-height: var(--rowh); }
  /* Baseline, not centre, for the two bits of text: that is how .head sets them, and
     matching it is what makes the label land on exactly the same pixel in both modes
     rather than a third of one below. The select keeps its own centring — it is the
     thing that overflows the line, and it has no business in their baseline group. */
  .row.divrow .k, .row.divrow .v { flex: none; padding-left: 0; align-self: baseline; }
  /* Tighter than a stacked select's padding, and every pixel of it is spoken for:
     "1/16 triplet" against a two-decimal Hz reading leaves the control about 90px
     of a 168px column, and a squeezed native select runs its text under the arrow
     rather than eliding it. */
  .row.divrow .fxsel { flex: 1; width: auto; min-width: 0; margin-top: 0; padding: 2px 2px; }
  .draggy { user-select: none; -webkit-user-select: none; touch-action: none; }
  input, textarea, .typein { user-select: text; -webkit-user-select: text; }
  .typein { width: 46px; background: #0e1013; color: var(--ink); border: 1px solid var(--accent);
            border-radius: 2px; font: inherit; font-size: 9.5px; padding: 0 2px; text-align: right; }
  /* Hand-styled rather than accent-color: that paints the thumb and the filled
     track the same colour, so the handle vanished exactly where it sat, and left
     the unfilled half near-white. Dark groove, bright handle, clear either way. */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%;
                      height: var(--rowctl); margin: 0; display: block; background: none; }
  /* Chrome's default focus ring is a blue box around the whole control, which on a
     vertical fader draws two lines down the strip. */
  input[type=range]:focus { outline: none; }
  input[type=range]:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px;
                                    border-radius: 4px; }
  /* A hairline groove: the value is carried by the handle, so the rail only has to
     say where the travel is. */
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: #2b3138; border: 1px solid #363d47; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 13px; height: 13px; margin-top: -6px;
    border-radius: 50%; background: #cfd6e4; border: 1px solid #10131a;
    box-shadow: 0 1px 2px rgba(0,0,0,.55); cursor: pointer; }
  input[type=range]:hover::-webkit-slider-thumb { background: #fff; }
  input[type=range]:active::-webkit-slider-thumb { background: var(--accent); }
  input[type=range]::-moz-range-track {
    height: 3px; border-radius: 2px; background: #2b3138; border: 1px solid #363d47; }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: #cfd6e4;
    border: 1px solid #10131a; cursor: pointer; }
  /* Explicit pixel height, not height:100%: a vertical range input inside a flex
     item never resolves a percentage height, and collapses to just its thumb.
     Hence --faderh, which fitStrips measures the rack for — the fader shrinks so
     the rows above it survive a short window. */
  /* Fader and meter are one group, centred together; the level reads under the
     group, not under the fader. */
  .faderwrap { display: flex; gap: 10px; justify-content: center;
               height: var(--faderh); flex: none; }
  /* Selector must out-specify input[type=range] above, or its 14px height wins. */
  input[type=range].fader { writing-mode: vertical-lr; direction: rtl;
           width: 24px; height: var(--faderh); }
  input[type=range].fader::-webkit-slider-runnable-track { width: 5px; height: auto; }
  /* A moulded silver cap: neutral across a rack of fourteen, because a wall of
     coloured caps is a wall of nothing. It goes teal when you are on it — hovering
     or selected — so the accent appears exactly where you are working. One colour
     for "here", not fourteen: a cap that changed hue per channel read as a state
     rather than as a position. */
  input[type=range].fader::-webkit-slider-thumb {
    width: 30px; height: 9px; border-radius: 5px; margin-top: 0; margin-left: -13px;
    /* Lit from above rather than shaded top to bottom: the highlight sits off the
       cap's top edge, so it reads as a moulded piece catching light instead of a
       painted rectangle. */
    background: radial-gradient(150% 260% at 50% -60%, #ffffff 0%, #dde4f0 34%, #939eb0 100%);
    border: 1px solid #161a20;
    box-shadow: 0 1px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5);
    transition: box-shadow .12s ease; }
  .strip:hover input[type=range].fader::-webkit-slider-thumb,
  .strip.selected input[type=range].fader::-webkit-slider-thumb {
    background: radial-gradient(150% 260% at 50% -60%, #f2fffb 0%, #9df0dd 34%, #34a48f 100%);
    box-shadow: 0 1px 3px rgba(0,0,0,.5), 0 0 9px rgba(78,201,176,.45),
                inset 0 1px 0 rgba(255,255,255,.55); }
  input[type=range].fader::-moz-range-thumb {
    width: 30px; height: 9px; border-radius: 5px; border: 1px solid #161a20;
    background: radial-gradient(150% 260% at 50% -60%, #ffffff 0%, #dde4f0 34%, #939eb0 100%); }
  input[type=range].fader:hover { accent-color: var(--ctl-hi); }
  /* As narrow as the fader's own groove: a meter is a level, not a graphic, and the
     width it was taking was width the strip needed elsewhere. */
  .meter { width: 7px; height: var(--faderh); background: #0e1013;
           border: 1px solid var(--line); border-radius: 2px; position: relative; overflow: hidden; }
  .meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
             background: linear-gradient(to top, #3fb950 0%, #d9a441 78%, var(--hot) 94%); }
  /* The held peak: where the loudest moment of the last second and a half was. */
  .meter b { position: absolute; left: 0; right: 0; height: 2px; bottom: 0;
             background: #eaf2ff; box-shadow: 0 0 3px rgba(234,242,255,.7); opacity: 0; }
  .meter.clip { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot); }
  /* One centred column, as on a console: the fader with its meter and level, then
     pan, then mute and solo — each with air around it, so three controls read as
     three rather than as one stack. */
  .faderrow { display: flex; align-items: flex-start; justify-content: center; }
  .fadercol { display: flex; flex-direction: column; align-items: center; gap: 3px;
              flex: 1; min-width: 0; }
  /* Fixed height whether or not it holds a pot: the master has no panner, and its
     buttons still have to sit on the same line as everyone else's. */
  .panrow { height: 42px; margin-top: 11px; display: flex; justify-content: center;
            align-items: center; }
  /* The same pair of buttons as an arrangement row carries, at the same size —
     they are the same two controls, so they should not be two different shapes.
     Centred rather than stretched: a full-width M is not more mutable. */
  .ctlbtns { display: flex; gap: 4px; margin-top: 12px; justify-content: center; }
  .ctlbtns button { flex: none; width: 24px; height: 21px; padding: 0; font-size: 10.5px;
                    line-height: 1; border-radius: 4px; color: var(--dim); }
  /* The master has nothing to mute, and every strip's foot ends on one line. */
  .gap-btns { height: 18px; margin-top: 12px; }
  /* The limiter takes the M/S line on the master: one button the width of the pair,
     so the row lands where the eye already goes for a strip's switches. Spelled out
     rather than abbreviated — there is one of it, and it has the room. */
  .ctlbtns button.limbtn { width: 52px; letter-spacing: .02em; font-size: 9px; }
  .ctlbtns button.limbtn:hover { border-color: var(--lim); }
  .ctlbtns button.limbtn.on { background: var(--lim); border-color: var(--lim);
                              color: #180f28; font-weight: 700; }
  /* A line of its own can afford a bigger pot than the slot beside the fader could,
     and the number inside the ring is the readout — at 34px it was nine pixels of
     type. Still smaller than the fader, which is the strip's main control. The SVG
     scales with it, stroke and number included. */
  .panpot { width: 42px; height: 42px; margin: 0 auto; display: block; cursor: ns-resize;
            touch-action: none; }
  /* A fine ring, not a donut: the arc is a reading, and 5px of it was a graphic. */
  .pottrack { fill: none; stroke: #3a4048; stroke-width: 2.6; stroke-linecap: round; }
  .potarc { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; }
  .potface { fill: #2b3038; }
  .pottext { fill: var(--dim); font: 400 12px var(--font); cursor: ns-resize;
             user-select: none; -webkit-user-select: none; }
  .panpot:hover .pottext { fill: var(--ink); }
  .panholder { position: relative; }
  .panin { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
           width: 38px; text-align: center; }
  .panpot:hover .potface { fill: #333a44; }
  /* The bus strip's own device, summarised: what it is set to, and the way in to
     the card that changes it. */
  .devlink { display: block; width: 100%; margin-bottom: 5px; padding: 3px 2px;
             font-size: 8.5px; letter-spacing: 0; color: var(--ink);
             background: #232a33; border-color: #39414f; text-align: center;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .devlink::after { content: ' \25BE'; color: var(--dim); }
  .devlink:hover { background: #2b3542; }
  /* A channel playing a voice from the catalogue rather than the engine's own. Lit,
     because it is the one thing on a strip that changes what the channel IS rather
     than what has been done to it — and because a song that sounds unfamiliar should
     say why on the face of the strip, not only in the mix file. */
  .voicepick.on { color: var(--accent); border-color: #3d5a66; background: #1e2a30; }
  /* A duplicated track with nothing chosen yet. It has no engine voice to fall back
     on — the preset is the whole reason the strip exists — so it is silent until it
     is given one, and a strip that is silent for a reason you can fix has to say so
     on its face rather than in a tooltip. Warn, not error: nothing is broken. */
  .voicepick.voiceneeded { color: var(--solo); border-color: #5b4a20;
                           background: #2a2417; border-style: dashed; }
  .voicepick.voiceneeded:hover { background: #332c1c; }
  /* A channel on the engine's own voice, where the library has a name for what that
     is. Dimmed and in the preset's own case rather than the row's upper case, because
     it is a reading and not a setting: nothing is in the mix file, and there is no
     "back" to go to. The lit state above is what a CHOICE looks like. */
  .voicepick.voicenamed { color: var(--dim); text-transform: none; font-style: italic; }
  .voicepick.voicenamed:hover { color: var(--ink); }
  /* One preset along, either way, without opening the library — the fastest way to
     hear a family is to hear it in order. Inside the button rather than beside it so
     the row's box is unchanged (the whole rack's EQ lines up against it), and hidden
     until the strip is under the pointer: forty channels do not need eighty arrows
     sitting on them. The background is inherited so they mask the label's ends in
     whichever of the row's three states it is in. */
  .voicepick { position: relative; }
  .voicestep { display: none; position: absolute; top: 0; bottom: 0; width: 13px;
               align-items: center; justify-content: center; font-size: 12px;
               line-height: 1; color: var(--dim); background-color: inherit; }
  .voicestep-prev { left: 0; }
  .voicestep-next { right: 0; }
  /* Inboard of the next arrow, because it belongs to the same gesture: step through
     the library, stop on one, open it up. Only drawn when there is a preset to open. */
  .voiceedit { right: 13px; font-size: 10px; }
  .voicepick:hover .voicestep { display: flex; }
  .voicestep:hover { color: var(--accent); }
  .db { text-align: center; font-size: 11px; width: 100%; white-space: nowrap; }
  .db.typable { cursor: ns-resize; }
  .db.typable:hover { color: var(--accent); text-decoration: underline dotted; }
  .btns { display: flex; gap: 4px; }
  .btns button { flex: 1; padding: 3px 0; font-size: 10px; }
  /* Fold buttons: a drawn chevron that turns over, rather than a glyph swapped for
     another glyph — the two triangles sat on different baselines and the button
     jumped as it changed. */
  /* Square, and no wider than the digits under it need: a 28x24 button is a
     rectangle holding a symmetrical glyph, and the column it heads is one or two
     numerals wide. Six pixels off the column is six more for the names. */
  .foldbtn { width: 22px; height: 22px; padding: 0; display: grid; place-items: center;
             color: var(--dim); }
  .foldbtn:hover { color: var(--accent); }
  /* The browser's focus ring is a blue rectangle in a desk with none — same shape
     as the button, in the desk's own accent. */
  .foldbtn:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  .foldbtn svg { width: 13px; height: 13px; fill: none; stroke: currentColor;
                 stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
                 transition: transform .16s ease; }
  .foldbtn.folded svg { transform: rotate(180deg); }
  button:disabled { opacity: .35; cursor: default; }
  button:disabled:hover { border-color: var(--line); }
  .insthead { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line);
              font-size: 8.5px; letter-spacing: .05em; color: var(--dim);
              text-align: center; cursor: pointer; }
  .insthead:hover { color: var(--ink); }
  .insthead::before { content: '\25B8 '; }
  .insthead.on { color: var(--accent); }
  .insthead.on::before { content: '\25BE '; }
  /* Reset lives on the strip's right-click menu now. A button per strip was a whole
     row of height on all 14 of them to hold something you press once an hour. */
  #ctxmenu { position: fixed; z-index: 12; display: none; min-width: 176px; padding: 4px;
             background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
             box-shadow: 0 10px 26px rgba(0,0,0,.55); }
  #ctxmenu.show, #notepop.show { display: block; }
  /* The overflow menu: the header was thirteen buttons wide and wrapping onto two
     rows, which cost the rack a whole line of window for things pressed once an
     hour. What stays out is what you use WHILE mixing — transport, limiter, A/B,
     undo. Saving is not one of them: it happens once, at the end, to a file the
     desk does not otherwise talk about. */
  #moremenu { position: fixed; z-index: 13; display: none; min-width: 210px; padding: 5px 4px 7px;
              background: var(--panel2); border: 1px solid var(--line); border-radius: 7px;
              box-shadow: 0 12px 30px rgba(0,0,0,.6); }
  #moremenu.show { display: block; }
  #moremenu button { display: block; width: 100%; text-align: left; border: 1px solid transparent;
                     background: none; padding: 5px 9px; font-size: 11.5px; color: var(--ink); }
  /* `display: block` above out-specifies the browser's own rule for [hidden], so an
     item that hides itself — Restore deleted tracks — needs saying twice. */
  #moremenu button[hidden] { display: none; }
  #moremenu button:hover { background: #313a47; color: var(--accent); }
  /* "Plumber Panic is saved" is a fact, not an offer: it does not light up under the
     pointer, because there is nothing there to press. */
  #moremenu button:disabled, #moremenu button:disabled:hover {
    background: none; color: var(--dim); font-size: 11px;
  }
  #moremenu .ctxhead { font-size: 9px; color: var(--dim); text-transform: uppercase;
                       letter-spacing: .06em; padding: 6px 9px 4px; }
  #moremenu .morerow { display: flex; align-items: center; gap: 8px; padding: 2px 9px 4px;
                       font-size: 11.5px; color: var(--dim); }
  #moremenu .morerow select { flex: 1; font-size: 11px; padding: 3px 6px; }
  #moremenu .morerow input[type=number] { width: 62px; font-size: 11px; padding: 3px 6px; }
  #moremenu .morerow .unit { font-size: 10px; color: var(--dim); }
  #more { font-size: 15px; line-height: 1; padding: 3px 10px 6px; }
  /* What one beat of one lane actually plays. Same furniture as the menu — it is
     the same gesture, a click on something asking what is in it. */
  #notepop { position: fixed; z-index: 12; display: none; padding: 6px 4px 5px;
             background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
             box-shadow: 0 10px 26px rgba(0,0,0,.55); min-width: 132px; }
  #notepop .ctxhead { font-size: 9px; color: var(--dim); text-transform: uppercase;
                      letter-spacing: .06em; padding: 0 8px 5px; }
  /* A bar of the lane as a piano roll: sixteenths across, pitch up the side. */
  #notepop .roll { display: flex; flex-direction: column; gap: 1px; padding: 2px 8px 4px; }
  #notepop .rollrow { display: flex; align-items: center; gap: 7px; }
  #notepop .rolln { width: 26px; flex: none; text-align: right; font-size: 9px;
                    color: #666e7d; font-variant-numeric: tabular-nums; }
  #notepop .rolln.tonic { color: var(--dim); }        /* the C of each octave */
  #notepop .rollcells { display: flex; gap: 1px; }
  #notepop .rollcell { width: 9px; height: 9px; border-radius: 2px; background: #23272e; }
  #notepop .rollcell.downbeat { margin-left: 3px; }   /* a gap on every beat */
  #notepop .rollcell.on { background: var(--lane); }
  #notepop .rollquiet { font-size: 10px; color: #5d6470; padding: 2px 0 1px; }
  /* The effect catalogue, grouped and priced. It was a 22-line dropdown, which
     is a list you scroll rather than a list you read — and it hid what each effect
     costs, which is the whole reason the costs were measured. */
  /* The way to add an effect is an empty slot at the end of the chain, the same
     shape as the cards beside it — a button in the corner of the header was a long
     way from the rack it filled, and said nothing about where the effect would go. */
  /* A square, not a full-height card: it is a place to put the next effect, not an
     effect, and a card-shaped hole reads as one that failed to load. */
  .devaddcard { flex: none; width: 78px; height: 78px; align-self: center; padding: 0;
                background: none; border: 1px dashed #343b46; border-radius: 6px;
                display: grid; place-items: center; cursor: pointer; }
  .devaddcard::after { content: '+'; font-size: 34px; font-weight: 400; line-height: 1;
                       color: #fff; opacity: 0; transition: opacity .12s ease; }
  /* On a channel with nothing on it the square is the only thing in the panel, and an
     empty outline in an empty rack is furniture rather than an offer. The plus is
     drawn faintly there — enough to say what the square is for, not so much that it
     reads as a control waiting to be pressed. Once the chain has something in it the
     cards say what the rack is, and the plus goes back to arriving on hover. */
  .devaddcard.first::after { opacity: .3; }
  .devaddcard:hover { border-color: #3f6058; background: rgba(78,201,176,.05); }
  .devaddcard:hover::after { opacity: 1; }
  .devaddcard:disabled { opacity: .35; cursor: default; }
  #fxpicker { position: fixed; z-index: 13; display: none; padding: 9px 8px;
              background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
              box-shadow: 0 14px 34px rgba(0,0,0,.6); }
  #fxpicker.show { display: flex; gap: 12px; align-items: flex-start; }
  /* The song list. Thirty-four tracks in a dropdown is a scroll; in three columns
     with their kinds named it is a glance. */
  #songpicker { position: fixed; z-index: 13; display: none; padding: 9px 8px;
                background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
                box-shadow: 0 14px 34px rgba(0,0,0,.6); max-height: 70vh; overflow-y: auto; }
  #songpicker.show { display: flex; gap: 12px; align-items: flex-start; }
  #songpicker .fxgroup { min-width: 168px; }
  #songpicker button.on { background: #2f4a44; color: var(--accent); }
  .songicon { width: 15px; height: 15px; fill: none; stroke: currentColor;
              stroke-width: 1.35; stroke-linejoin: round; stroke-linecap: round; }
  #songbtn { display: grid; place-items: center; padding: 4px 9px; }
  #nowsong { color: var(--ink); font-weight: 700; }
  /* The voice library. Sixty-five presets in a context menu is a scroll you cannot
     read; in columns by category it is a glance, the way the effect catalogue is.
     Wider than the fx picker because a preset earns its place by what it is FOR, and
     that takes a sentence. */
  #voicepicker { position: fixed; z-index: 13; display: none; padding: 9px 8px;
                 background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
                 box-shadow: 0 14px 34px rgba(0,0,0,.6);
                 max-height: 76vh; max-width: 94vw; overflow: auto; }
  /* Wraps rather than running off the edge. Eleven categories in one row put the
     drums off-screen on the kick strip, which is the one place they are the answer. */
  /* The search box spans the panel; the columns wrap underneath it. */
  #voicepicker.show { display: block; max-width: min(1180px, 94vw); }
  #voicepicker .voiceresults { display: flex; flex-wrap: wrap; gap: 4px 12px;
                               align-items: flex-start; }
  /* Lane, search and the way back, on one row. Engine default was a category of one
     and spent a 150px column saying a single word; it is chrome, like the search. */
  #voicepicker .voicehead { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
  #voicepicker .voicewho { font-size: 9px; letter-spacing: .07em; color: var(--dim);
                           text-transform: uppercase; white-space: nowrap; }
  #voicepicker .voicesearch { flex: 1; min-width: 140px; margin: 0; padding: 5px 8px;
                              font: inherit; font-size: 11px; color: var(--ink);
                              background: #1b2129; border: 1px solid var(--line);
                              border-radius: 4px; }
  /* Sized to its label rather than to a column, and outlined so it reads as the
     control it is — the buttons in the columns below are borderless until hovered. */
  #voicepicker .voicedefault { width: auto; flex: none; white-space: nowrap;
                               background: #1b2129; border-color: var(--line); }
  /* Drums or pitched, next to the lane's name because it is a fact about the lane —
     the panel opens on the kind the strip plays, and `all` puts the library back. */
  #voicepicker .voicekinds { display: flex; flex: none; gap: 2px; padding: 2px;
                             background: #1b2129; border: 1px solid var(--line);
                             border-radius: 4px; }
  #voicepicker .voicekind { width: auto; flex: none; padding: 3px 8px; font-size: 10px;
                            letter-spacing: .04em; border-radius: 3px; }
  #voicepicker .voicekind.on { background: #2f4a44; color: var(--accent); }
  #voicepicker .voicesearch::placeholder { color: var(--dim); }
  #voicepicker .voicesearch:focus { outline: none; border-color: var(--accent); }
  #voicepicker .voicesearch-none { padding: 4px 6px; font-size: 11px; color: var(--dim); }
  /* The way out of a filter that is hiding the answer, offered where the answer would
     have been. */
  #voicepicker .voicesearch-more { width: auto; margin-top: 4px; padding: 3px 6px;
                                   font-size: 10px; color: var(--accent);
                                   border-color: #3d5a66; }
  /* Where Engine default sits on every other lane. A layer has none — see voiceRow —
     so the space says what the lane IS instead of offering a choice that silences it. */
  #voicepicker .voicewhy { font-size: 10px; line-height: 1.35; color: var(--dim);
                           max-width: 260px; }
  #voicepicker .fxgroup { display: flex; flex-direction: column; gap: 2px; min-width: 150px; }
  #voicepicker .fxgroup h5 { margin: 0 0 2px; padding: 0 6px; font-size: 9px; letter-spacing: .07em;
                             color: var(--dim); text-transform: uppercase; font-weight: 400; }
  #voicepicker button { display: flex; justify-content: space-between; align-items: baseline;
                        gap: 10px; width: 100%; text-align: left; background: none;
                        border: 1px solid transparent; padding: 4px 6px; font-size: 11px;
                        border-radius: 4px; color: var(--ink); }
  #voicepicker button:hover { background: #313a47; color: var(--accent); }
  #voicepicker button.on { background: #2f4a44; color: var(--accent); }
  /* Engine presets are the game's own voices, and saying so is the difference
     between "a synth called Square" and "the sound this lane already makes". */
  #voicepicker .vkind { color: #5d6470; font-size: 8.5px; letter-spacing: .06em; }
  /* The reserved row on a lane that cannot take a preset. Present so the EQ below it
     lands on the same line as every other strip's, quiet so it is not read as a
     control that is broken. */
  .voicenone { color: #454c58; cursor: default; background: #1c222a; border-style: dashed; }
  .voicenone::after { content: none; }
  #voicepicker button.on .vkind { color: var(--accent); }
  /* Into the editor from the strip's own header, on hover — beside the ✎ on the voice
     row and the two items on the right-click menu. Not in the preset picker: choosing
     a sound and shaping one are different jobs, and the panel for the first was not
     the place to hide the second.
     Absolutely placed, not in the flow: the head's contents are aligned against every
     other strip's to the pixel, and an inline button would move them. */
  .stripedit { display: none; position: absolute; top: 2px; right: 3px; width: auto;
               padding: 1px 3px; font-size: 10px; line-height: 1; color: var(--dim);
               background: none; border: none; }
  .striphead:hover .stripedit { display: block; }
  .stripedit:hover { color: var(--accent); background: none; }
  .stripedit::after { content: none; }

  /* ---- The preset editor -----------------------------------------------------
     A floating window like the keyboard, for the same reason: you leave it open and
     keep working — play the song, move a fader, step a lane — while the sound changes
     under you. Above the pickers in the stack and below the keyboard, which is the
     order you reach for them in. */
  /* ---- strip + editor, as ONE object ------------------------------------------
     The wrapper carries everything that draws a container — border, radius, background,
     the selected outline — and the strip and the panel inside it carry none of it. So
     opening the editor does not put a second box next to a channel; it makes that
     channel wider. A divider marks where the controls stop and the sound starts. */
  .voicepair { display: flex; flex: none; align-items: stretch;
               background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
               height: var(--striph, auto); min-height: 0; }
  .voicepair.selected { border-color: #78828f; box-shadow: 0 0 0 1px rgba(197,206,220,.3); }
  /* Both children give up their own frame — that is what makes the pair one object.
     `.strip.selected` is listed explicitly to out-weigh it: it carries the selected
     box-shadow, ties this rule on specificity and wins on order, which drew a bright
     outline right round the inner strip and put a line straight down the join. Its
     text treatments (white bold name) are wanted and are left alone. */
  .voicepair > .strip,
  .voicepair > .strip.selected,
  .voicepair > #voiceedit { background: none; border: none; border-radius: 0;
                            box-shadow: none; height: auto; }
  /* The divider starts BELOW the head band, so the band — its wash and its coloured
     rule — runs unbroken across the pair and reads as one header over one object.
     Carried by the strip's body and foot rather than by the strip, because together
     they are exactly everything under the header; the negative margin pushes the line
     back out to the strip's true edge, past its padding. */
  .voicepair > .strip .stripbody,
  .voicepair > .strip .stripfoot { border-right: 1px solid var(--line);
                                   margin-right: -7px; padding-right: 7px; }
  /* The head bands meet and have to read as one, so they are the same height to the
     pixel and their INNER corners are squared: two 5px radii facing each other put a
     notch in the middle of what is meant to be one continuous band, which was the one
     thing still giving the join away. */
  /* -7px, not the -8px a lone strip uses: that extra pixel is there to cover the
     strip's own 1px border, and inside the pair there is no border to cover — so it
     overshot into the panel and left a hairline down the middle of the head band. */
  .voicepair > .strip .striphead { margin: -6px -7px 5px; border-radius: 5px 0 0 0; }
  .voicepair > #voiceedit .vehead { border-radius: 0 5px 0 0; }

  /* The editor itself — inserted directly after the channel being edited, so the sound
     and its controls are side by side and the thing you are shaping is the thing you
     are looking at. Everything else shuffles right, which is what a rack does when you
     put something in it.
     A column with the ends pinned: the name at the top and Save at the bottom stay put,
     and only the controls between them scroll. A MonoSynth is sixteen sliders — enough
     to push a footer off the bottom, which put the one button the whole thing exists
     for behind a scroll nobody knew was there. */
  /* Three strips wide, written as three strips: the rack's own column and gap, so it
     stays exactly three channels across whatever `--stripw` becomes. The width buys
     the pot labels room to be read at the same size as HIGH/MID/LOW beside them —
     at 310px they were 7px and squinting. */
  #voiceedit { display: none; position: relative; flex: none;
               width: calc(var(--stripw) * 3 + 12px); flex-direction: column;
               height: var(--striph, auto); min-height: 0; overflow: hidden;
               padding: 6px 8px 7px;
               background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  #voiceedit.show { display: flex; }
  #voiceedit .vehead, #voiceedit .veused, #voiceedit .venote, #voiceedit .vefoot { flex: none; }
  /* The channel strips' own header, to the pixel: name over a tag over the coloured
     rule, with the strip's own gradient washing into it. Same two lines, same fonts,
     same 3px rule — so the panel's header and its strip's line up across the gap and
     the pair reads as one thing. (`--lane`/`--lanedim` are copied from the strip when
     the panel is placed.) */
  #voiceedit .vehead { position: relative; display: block;
                       margin: -6px -8px 10px; padding: 6px 6px 4px;
                       min-height: 0;
                       background: linear-gradient(180deg, rgba(0, 0, 0, 0) 52%, var(--lanedim, transparent));
                       border-bottom: 3px solid var(--lane, var(--line));
                       border-radius: 5px 5px 0 0; }
  #voiceedit .vetitle { margin: 0; font-size: 11.5px; text-align: center; font-weight: 400;
                        letter-spacing: .04em; color: var(--ink);
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The category, in the group tag's clothes — same size, same lane colour, same slot. */
  #voiceedit .vetag { text-align: center; font-size: 8.5px; letter-spacing: .07em;
                      text-transform: uppercase; color: var(--lane, var(--dim));
                      opacity: .95; margin: 0 0 3px; }
  /* Borderless, like every other ✕ on the desk — it was the one button here wearing a
     box, which made it read as a control rather than as a way out. */
  #voiceedit .veclose { position: absolute; top: 4px; right: 5px; width: auto; padding: 1px 4px;
                        font-size: 11px; line-height: 1; color: var(--dim);
                        background: none; border: none; }
  #voiceedit .veclose:hover { color: var(--hot); background: none; }
  #voiceedit .veclose::after { content: none; }
  #voiceedit .vesub { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  /* Not inside a `.row`, so it misses `.row .k` and has to say the same thing itself —
     and it takes the pick labels' width, so the synth dropdown starts on the same x as
     every pill group below it. */
  #voiceedit .vesublabel { flex: none; width: 74px; font-size: 9.5px; letter-spacing: .03em;
                           color: var(--dim); text-transform: uppercase; }
  #voiceedit .vesynth { flex: 1; width: auto; min-width: 0; font-size: 10.5px; padding: 4px 6px; }
  /* A preset is library-wide, so who else plays it is the first thing worth knowing —
     above the controls, not buried in a tooltip on the save button. */
  #voiceedit .veused { margin: 0 0 6px; padding: 4px 7px; font-size: 10px; line-height: 1.4;
                       color: var(--solo); background: #221d16;
                       border: 1px solid #3a2f1d; border-radius: 4px; }
  #voiceedit .venote { width: 100%; margin: 0; padding: 4px 6px; font: inherit;
                       font-size: 9.5px; line-height: 1.4; color: var(--ink); resize: vertical;
                       background: #1b2129; border: 1px solid var(--line); border-radius: 4px; }

  /* ---- the save sheet ---------------------------------------------------------
     How the preset is FILED, asked at the moment it is filed. Neither field is a
     sound — you cannot hear a category — and while they sat in the panel they cost
     two rows of controls on every edit. Over the controls rather than beside them,
     because it is the last thing you do and the only thing you are doing. */
  #voiceedit .vesheet { position: absolute; inset: 0; z-index: 2; display: flex;
                        flex-direction: column; gap: 6px; padding: 10px;
                        background: var(--panel2); border-radius: 5px; }
  #voiceedit .vesheet h4 { margin: 0 0 2px; font-size: 11px; color: var(--ink);
                           text-transform: none; letter-spacing: 0; }
  #voiceedit .vefield { display: flex; flex-direction: column; gap: 3px; }
  #voiceedit .vefield .k { font-size: 8px; letter-spacing: .05em; color: var(--dim);
                           text-transform: uppercase; }
  #voiceedit .vefield .fxsel { width: 100%; font-size: 10.5px; padding: 4px 5px; }
  /* The name field. It used to live in the panel header and carried its styling with
     it; moving it here left it on the browser default, which in a dark panel is a
     white box. */
  #voiceedit .vename { width: 100%; padding: 5px 7px; font: inherit; font-size: 11px;
                       color: var(--ink); background: #1b2129;
                       border: 1px solid var(--line); border-radius: 4px; }
  #voiceedit .vename:focus { outline: none; border-color: var(--accent); }
  /* Equal halves, the way the panel's own three are equal thirds. */
  #voiceedit .vesheetfoot { display: flex; gap: 5px; margin-top: auto; }
  #voiceedit .vesheetfoot > button { flex: 1 1 0; width: auto; min-width: 0; margin: 0;
                                     padding: 6px 8px; font-size: 10.5px; }
  #voiceedit .vesheetfoot .devlink::after { content: none; }
  #voiceedit .venote:focus { outline: none; border-color: var(--accent); }
  #voiceedit .venote::placeholder { color: var(--dim); }
  /* The only part that scrolls. Its own scrollbar rather than the panel's, so the
     name row and the save row stay where you left them. */
  #voiceedit .verack { display: flex; flex-direction: column; gap: 0;
                       flex: 1; min-height: 0; overflow-y: auto;
                       /* Reserved, so the controls do not shift sideways the moment a
                          taller synth makes the bar appear. */
                       scrollbar-gutter: stable; }
  /* The same 6px bar the rack and the device shelf use — narrow enough to read as an
     edge rather than as a column, in a panel only three strips wide. */
  #voiceedit .verack::-webkit-scrollbar { width: 6px; }
  #voiceedit .verack::-webkit-scrollbar-track { background: transparent; }
  #voiceedit .verack::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  #voiceedit .verack::-webkit-scrollbar-thumb:hover { background: #4a5361; }
  /* A rule between sections, not a box around each. Six bordered cards inside a
     bordered panel inside a bordered strip is three nested frames to say one thing,
     and the frames were louder than the controls they held. A line and some air do
     the same job — the title is what names the section, and it was doing that
     already. */
  #voiceedit .vegroup { width: auto; margin: 0; padding: 0; gap: 0;
                        background: none; border: none; border-radius: 0; }
  /* No rules at all in the end. A heading with space around it already says where one
     section stops and the next starts; the line was a second answer to a question that
     had been answered. Centred, like every other card title on the desk — the effects
     rack does it, the send returns do it, and a panel inside the rack should not be
     the one place that does not. */
  #voiceedit .vegroup + .vegroup { margin-top: 15px; }
  #voiceedit .vegroup .devbar { padding: 0 0 6px; }
  #voiceedit .vegroup h4 { font-size: 11px; letter-spacing: .06em; }
  /* Two columns of controls: an envelope reads as a shape when its four numbers are
     side by side, and as a list when they are stacked. Tight enough for a 310px strip —
     the label and the value share a line, and the slider gets the one under it. */
  /* Three columns of pots that fill left-to-right. The effects rack's own .devgrid
     flows the other way — down four rows, then into a new 168px column, which is right
     for a panel that can grow sideways and wrong for one pinned to a strip's width: the
     second column landed off the edge and every group came out as a single stack.
     Both the flow and the fixed rows have to be undone, not just the columns. */
  /* The ROW gap has to clear a POT, not a line of text. A potrow is its label stacked
     straight onto a 42px ring, and `.vepot` pulls whatever follows up by 3px of its
     own — so at the 1px this started on, a second row of pots put its labels 2px INTO
     the rings above them. 11px leaves 8px of daylight. One number, and every card in
     both editors depends on it: the synth groups, the drum sections and Taps are all
     this same grid. */
  #voiceedit .devgrid { display: grid; grid-auto-flow: row;
                        grid-template-columns: repeat(4, 1fr);
                        grid-template-rows: none; grid-auto-columns: auto; gap: 11px 2px; }
  #voiceedit .devgrid .row { margin: 0; }

  /* ---- pots -----------------------------------------------------------------
     The name over the knob and the reading inside its ring — the layout of every
     hardware panel, and the reason a pot fits in a third of the width a slider needed:
     a slider has to be long enough to aim along, where a knob only has to be big
     enough to grab. */
  #voiceedit .potrow { display: flex; flex-direction: column; align-items: center; gap: 0; }
  #voiceedit .potrow .k { font-size: 9.5px; letter-spacing: .03em; color: var(--dim);
                          text-transform: uppercase; text-align: center; line-height: 1;
                          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                          max-width: 100%; }
  /* The unit belongs to the name, not to the reading — there is no room for it in the
     ring, and it never changes, so it is chrome rather than data. */
  #voiceedit .potrow .kunit { color: #5d6470; }
  /* The same 42px as the pan pots on every strip: one knob size on the desk, so a
     preset's filter feels like the pan it is sitting beside rather than like a smaller
     relative of it. Four fit across because the LABEL is what sets the column width,
     not the knob. */
  #voiceedit .vepot { width: 42px; height: 42px; margin: 0 auto -3px; }
  /* Small enough for `200ms` inside the ring — the reading is the point of a pot, and
     a value abbreviated to fit is a pot you cannot read. */
  #voiceedit .vepot .pottext { font-size: 8px; }
  #voiceedit .vepot .potface { r: 13; }
  #voiceedit .potrow .panin { font-size: 9px; }

  /* ---- segmented pills --------------------------------------------------------
     A set of four you can see beats a menu that hides three of them. Spans the group's
     full width, so it reads as one control rather than as buttons that happen to be
     adjacent. */
  /* Label and pills on ONE line. `.devgrid .row` zeroes every row's margin and
     out-specifies a bare `.segrow`, so this has to carry the same weight to land.
     No margin of its own any more: keeping a pill row clear of the pots under it is
     what the grid's row gap now does for every row alike, and a margin on top of that
     spaced the pills differently from everything else in the same card. */
  #voiceedit .devgrid .segrow { grid-column: 1 / -1; display: flex; flex-direction: row;
                                align-items: center; gap: 8px; margin: 0; }
  /* One width for every pick label, so the pill groups start on the same x down the
     whole panel rather than stepping in and out with the length of the word. */
  #voiceedit .segrow .k { flex: none; width: 74px; font-size: 9.5px; letter-spacing: .03em;
                          color: var(--dim); text-transform: uppercase; }
  #voiceedit .segrow .seg { flex: 1; min-width: 0; }
  #voiceedit .seg { display: flex; gap: 2px; padding: 2px; background: #1b2129;
                    border: 1px solid var(--line); border-radius: 6px; }
  #voiceedit .segbtn { flex: 1; width: auto; margin: 0; padding: 3px 2px; font-size: 9.5px;
                       font-weight: 700; letter-spacing: .04em; color: var(--dim);
                       background: none; border: none; border-radius: 4px;
                       white-space: nowrap; }
  #voiceedit .segbtn::after { content: none; }
  #voiceedit .segbtn:hover { background: #2b3542; color: var(--ink); }
  /* Filled, with dark text on it — the selected pill is the one thing in the panel
     that has to be readable at a glance from across the rack. */
  #voiceedit .segbtn.on { background: var(--accent); color: #16211f; }
  #voiceedit .segbtn.on:hover { background: var(--accent); color: #16211f; }
  #voiceedit .veswitch { width: auto; flex: none; margin-left: auto; padding: 2px 8px;
                         font-size: 9px; letter-spacing: .06em; }
  #voiceedit .veswitch.on { background: #2f4a44; color: var(--accent); border-color: #2f4a44; }
  /* The tap stepper: a count with a button either side, on one row. */
  #voiceedit .veinline { display: flex; align-items: center; justify-content: space-between; }
  #voiceedit .vestep { display: flex; align-items: center; gap: 2px; }
  #voiceedit .vestep button { width: 20px; padding: 1px 0; text-align: center; }
  #voiceedit .vestep .v { min-width: 16px; text-align: center; }
  #voiceedit .devnote { grid-column: 1 / -1; }
  /* Three buttons of one size, and no rule above them. The rule was fencing off a peak
     readout and an UNSAVED flag that have both gone: the flag was the save button said
     twice — it is dark until there is something to write — and the peak moved to the
     save sheet, where it is next to the thing you would do about it. */
  #voiceedit .vefoot { display: flex; align-items: stretch; gap: 5px; margin-top: 8px; }

  #fxpicker .fxgroup { display: flex; flex-direction: column; gap: 2px; min-width: 128px; }

                      letter-spacing: .06em; padding: 3px 9px 5px; }

  #oskbtn { display: grid; place-items: center; padding: 4px 9px; }
  .oskicon { width: 15px; height: 15px; }
  .oskicon .body { fill: currentColor; }
  #osk { position: fixed; z-index: 14; display: none; left: 0; top: 0;

  /* Why nothing is coming out — muted, or not the soloed channel. Only drawn when

  #osk .oskwarn { font-size: 9px; color: var(--solo); text-transform: uppercase;

  #osk .sp { flex: 1; min-width: 12px; }

  #osk .oskctl { display: flex; align-items: center; gap: 6px; padding: 7px 10px 5px; }

  #osk .oskoct { font-size: 11px; color: var(--accent); font-weight: 700;
