  #voicelib .vledit.collapsed { padding-left: 0; border-left: none; }
  /* The band under the list: bench controls, then the keys. */
  #voicelib .vlfoot { flex: none; display: flex; flex-direction: column;
                      margin: 9px -8px -9px 0; padding: 8px 10px 9px 0;
                      border-top: 1px solid var(--line); }
  #voicelib .vlkeys:empty { display: none; }
  #voicelib .vlkeys.collapsed { display: none; }
  #voicelib .vlfoot .vlbench { margin: 0; }
  #voicelib .vlkeys { display: flex; justify-content: center; margin-top: 8px; }
  /* The way back from a folded region. Vertical beside the editor, horizontal under the
     bench — each reads along the edge it would expand from, so the WORD lies where the
     thing it names is about to appear. That placement is the whole signal; the chevron
     that used to sit next to it said the same thing again, in a shape you had to read
     past to reach the word. */
  #voicelib .vlrail { width: auto; flex: none; align-self: stretch; padding: 6px 3px;
                      font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
                      color: var(--dim); background: var(--input);
                      border: 1px solid var(--line); border-radius: 4px;
                      writing-mode: vertical-rl;
                      display: flex; align-items: center; justify-content: center; }
  #voicelib .vlrail:hover { color: var(--accent); border-color: var(--accent-line); }
  /* Full width, the way the editor's rail is full height. Each rail is the whole edge
     of the space its panel will come back into, so its size says how much room is
     waiting rather than making you aim at a tab. */
  #voicelib .vlfoot > .vlrail { writing-mode: horizontal-tb; align-self: stretch;
                                width: 100%; margin-top: 8px; padding: 5px 14px; }
  /* Thin, like the editor's rack and the device shelf — a scrollbar in a panel this
     dense should read as an edge rather than as a column. */
  #voicelib .vlresults { scrollbar-gutter: stable; }
  /* The header is also the handle — the one thing every floating panel has ever done. */
  #voicelib .vlhead { display: flex; align-items: center; gap: 8px; flex: none;
                      margin: -9px -8px 8px; padding: 8px 10px;
                      border-bottom: 1px solid var(--line); cursor: grab; }
  #voicelib .vlhead.dragging { cursor: grabbing; }
  #voicelib .vltitle { font-size: 11px; color: var(--ink); font-weight: 700;
                       text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  #voicelib .voicesearch { flex: 1; min-width: 140px; margin: 0; padding: 5px 8px;
                           font: inherit; font-size: 11px; color: var(--ink);
                           background: var(--input); border: 1px solid var(--line);
                           border-radius: 4px; }
  #voicelib .voicesearch::placeholder { color: var(--dim); }
  #voicelib .voicesearch:focus { outline: none; border-color: var(--accent); }
  #voicelib .voicekinds { display: flex; flex: none; gap: 2px; padding: 2px;
                          background: var(--input); border: 1px solid var(--line); border-radius: 4px; }
  #voicelib .voicekind { width: auto; flex: none; padding: 3px 8px; font-size: 10px;
                         letter-spacing: .04em; border-radius: 3px; }
  #voicelib .voicekind.on { background: var(--primary); color: var(--accent); }
  /* What a preset is built from, as a filter. Sized for `Membrane (12)`. */
  #voicelib .vlsynth { width: 118px; flex: none; font-size: 10.5px; padding: 4px 6px; }
  /* ---- the standard close ------------------------------------------------------
     One mark, one meaning, one size, on every window the desk puts up. They had drifted
     — a 19px ✕ here, an 11px `×` on the step sequencer, an SVG glyph on the keyboard —
     and a close button you have to find and identify on each panel is three controls
     wearing one job. Borderless, because a ✕ is already a button shape; hot on hover,
     because closing is the one thing here you might not have meant.
     `.popclose` is the class; anything that closes a window wears it. */
  /* A fixed square, not padding around a glyph. The ✕ and the fold chevrons sit in the
     same column an inch apart — the window's close above the editor's put-away — and
     boxes sized to their own contents put their centres six pixels out of line, which
     is exactly the sort of thing you see without being able to name. Same box, same
     centre, whatever mark is in it. */
  .popclose, .vefold, .oskfold { width: 28px; height: 28px; flex: none; padding: 0;
              display: inline-grid; place-items: center; }
  .popclose { font-size: 19px; line-height: 1;
              color: var(--dim); background: none; border: none; }
  .popclose:hover { color: var(--hot); background: none; border-color: transparent; }
  .popclose::after { content: none; }
  /* ---- the bench strip
     What is on the bench and the figure it is played with. Its own band above the
     columns, because it is about the ONE preset you have chosen and everything below
     it is about choosing another. */
  #voicelib .vlbench { display: flex; align-items: center; gap: 6px; flex: none;
                       margin: 0 0 9px; padding: 6px 8px;
                       background: var(--input); border: 1px solid var(--line); border-radius: 5px; }
  #voicelib .vlbenchwhat { flex: 1; min-width: 0; font-size: 11.5px; color: var(--ink);
                           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #voicelib .vlbenchwhat.none { color: var(--dim); }
  /* Octave, as a stepper reading the note it lands on. One outlined group rather than
     three loose buttons: − A2 + is one control, and the reading in the middle is the
     part you look at. Same furniture as the kind chips above it. */
  #voicelib .vloct { display: flex; flex: none; align-items: stretch; gap: 2px; padding: 2px;
                     background: var(--input); border: 1px solid var(--line); border-radius: 4px; }
  #voicelib .vloctbtn { width: 20px; flex: none; padding: 2px 0; font-size: 11px;
                        line-height: 1; text-align: center; border-radius: 3px; }
  /* Tabular and fixed-width: the reading changes as you step, and a group that resizes
     under the pointer moves the very button you are clicking. */
  #voicelib .vloctnow { width: 34px; flex: none; padding: 2px 0; font-size: 10px;
                        text-align: center; color: var(--accent); background: none;
                        border: none; font-variant-numeric: tabular-nums; }
  #voicelib .vloctnow:hover:not(:disabled) { background: var(--hover); }
  #voicelib .vloct button:disabled { opacity: .3; }
  #voicelib .vlonce { width: auto; flex: none; padding: 3px 10px; font-size: 10px; }
  /* Square, and the width of its own glyph: ▶ and ■ are one control in two states, and
     a button that changes width when you press it reads as two buttons. */
  #voicelib .vlplay { width: 26px; flex: none; padding: 3px 0; font-size: 10px;
                      text-align: center; }
  #voicelib .vlplay.on { background: var(--primary); color: var(--accent); border-color: var(--accent-line); }
  /* A song is playing, so pressing this joins it rather than starting something beside
     it. Marked on the border only — it is a fact about what the button will do, not a
     state of the button, and filling it would make it look already pressed. */
  #voicelib .vlplay.sync { border-color: var(--accent-line); color: var(--accent); }
  /* Wide enough for `I – V – ♭VII`, which is the longest thing in the list — a select
     that ellipsises its own options is a select you have to open to read. */
  #voicelib .vlpat { width: 124px; flex: none; font-size: 10.5px; padding: 3px 5px; }
  #voicelib .vlrate { width: 62px; flex: none; font-size: 10.5px; padding: 3px 5px; }
  /* ---- the catalogue: a grid of category drawers -------------------------------
     It was a wrapping flex row of bare columns, which is a masonry layout without the
     masonry: KICKS has twenty presets and ORGANS has four, so a row was as tall as its
     tallest category and everything shorter left a hole under it. Worse, the wrap point
     moved with the window, so the category you knew was third from the left was third
     from the left at one width and second on the next row at another.
     A grid fixes the columns. Each category is a CARD, so a hole under a short one reads
     as the end of that card rather than as a gap in the list, and the cards line up on
     both axes however many presets each has.
     `auto-fill` rather than the three columns this pattern usually wants: the window is
     1000–1500px wide and a preset row is a short name and a badge, so three columns would
     be 480px of mostly nothing. The min is the width a card needs for its longest name,
     and the count follows from the width you gave the window. */
  /* `grid-auto-rows: min-content` is load-bearing, not tidiness. This box is a flex child
     with a DEFINITE height — 550px once the editor and the keyboard dock into the
     workspace — and auto rows in a definite-height grid get fitted to it: three rows came
     out at exactly (550 − gaps) / 3, and since a card is `align-self: start` it kept its
     own height and simply drew over the card below. Basses ran 66px into Bells & Mallets.
     Sizing the rows to their content and letting the whole grid overflow is what makes
     `overflow-y: auto` above the thing that handles the excess. */
  #voicelib .vlresults { display: grid; gap: 7px;
                         grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
                         grid-auto-rows: min-content;
                         align-content: start; flex: 1; min-height: 0; overflow-y: auto; }
  /* Stretched, not `align-self: start`: every card in a row is as tall as the tallest
     one beside it, so a category with four presets is a card with room under them
     rather than a short box floating above a hole. The grid already lines the cards up
     on both axes; this is what makes them look like one shelf.
     And NOT `overflow: hidden`, which is what was cutting the long ones off. Hiding
     overflow zeroes a grid item's automatic minimum size, so the auto row sized itself
     from the card's min-content rather than its real height and the last preset or two
     were clipped mid-row. The rounded top corner it was there for belongs to the head,
     which now carries its own radius. */
  #voicelib .vlcat { border: 1px solid var(--line); border-radius: 6px; background: var(--input);
                     display: flex; flex-direction: column; }
  /* A titled bar across the top of the card rather than a word floating above a column.
     The category was an `h5` with nothing around it, so where one list ended and the next
     began was a matter of counting the gap — the outline says it, and the filled bar says
     which end of the card the name belongs to.
     Not a control. It was briefly a button that shut the card, and it is a heading again:
     everything in the library is visible, and the only thing that scrolls is the list. */
  #voicelib .vlcathead { margin: 0; flex: none; padding: 6px 8px; background: var(--panel2);
                         border-bottom: 1px solid var(--seam); border-radius: 5px 5px 0 0;
                         font-size: 9px; letter-spacing: .07em; text-transform: uppercase;
                         color: var(--dim); font-weight: 400;
                         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Grows into whatever height the row's tallest card set, so the spare room is INSIDE
     the card, under the last preset, and the cards end on one line. */
  #voicelib .vlcatlist { display: flex; flex-direction: column; gap: 1px; padding: 3px;
                         flex: 1; }
  #voicelib .fxgroup { display: flex; flex-direction: column; gap: 2px; min-width: 150px; }
  #voicelib .fxgroup h5 { margin: 0 0 2px; padding: 0 6px; font-size: 9px; letter-spacing: .07em;
                          color: var(--dim); text-transform: uppercase; font-weight: 400; }
  /* Scoped to the ROWS, not to the window and not to the results grid.
     This is a preset row: full width, name left, synth right. Written as `#voicelib
     button` it was also every button in the editor and the keyboard, which now live
     inside this window — so the octave steppers became 900px slabs, MIDI and catch keys
     lost their frames, and `space-between` pushed every label to the edge of whatever
     box it was in. Naming `.vlresults` fixed those and then caught the category heads,
     which are buttons in the grid too. A rule this opinionated has to name the thing it
     is describing, which is a row in a drawer. */
  #voicelib .vlcatlist button { display: flex; justify-content: space-between;
                     align-items: center; gap: 8px; width: 100%; text-align: left;
                     margin: 0; background: none; border: 1px solid transparent;
                     padding: 3px 5px; font-size: 11px; border-radius: 4px;
                     color: var(--ink); }
  #voicelib .vlcatlist button:hover { background: var(--hover); color: var(--accent); }
  #voicelib .vlcatlist button.on { background: var(--primary); color: var(--accent); }
  #voicelib .vlcatlist button::after { content: none; }
  #voicelib .vlcatlist button > span:first-child { min-width: 0; overflow: hidden;
                     text-overflow: ellipsis; white-space: nowrap; }
  /* A badge rather than trailing grey text. Right-aligned either way, but a pill says
     this is a PROPERTY of the row — the thing it is built from — where loose text at the
     end of a line reads as more of the name. Kept very quiet: there is one on every row
     of a hundred, so anything with real contrast becomes a second column you have to
     read past to find a preset.
     Quiet is not the same as unreadable, and this went past it twice. #6d7481 on #242c36
     is 3:1, under the 4.5 a body colour needs, at a size where the shortfall bites
     hardest; 9px at #8a93a1 cleared the threshold on paper and still read as something
     you had to lean in for. 10px against the row's 11 keeps the badge subordinate to the
     name — which is the whole reason it is quiet — and #a8b0bd is 6:1, comfortably
     legible rather than technically legible. The padding goes with the type: 1px of it
     under 10px type is a pill with the label wedged into it. */
  #voicelib .vkind { flex: none; color: color-mix(in srgb, var(--dim) 55%, var(--ink)); font-size: 10px; letter-spacing: .06em;
                     padding: 2px 6px; border-radius: 3px; background: var(--panel2); }
  #voicelib .vlcatlist button:hover .vkind { background: var(--hover); color: color-mix(in srgb, var(--dim) 55%, var(--ink)); }
  #voicelib .vlcatlist button.on .vkind { background: var(--accent-wash); color: var(--accent); }
  #voicelib .voicesearch-none { padding: 4px 6px; font-size: 11px; color: var(--dim); }
  #fxpicker .fxgroup { display: flex; flex-direction: column; gap: 2px; min-width: 128px; }
  #fxpicker .fxgroup h5 { margin: 0 0 2px; padding: 0 6px; font-size: 9px; letter-spacing: .07em;
                          color: var(--dim); text-transform: uppercase; font-weight: 400; }
  #fxpicker button { display: flex; justify-content: space-between; align-items: baseline;
                     gap: 12px; width: 100%; text-align: left; background: none;
                     border: 1px solid transparent; padding: 4px 6px; font-size: 11px;
                     border-radius: 4px; color: var(--ink); }
  #fxpicker button:hover { background: var(--hover); color: var(--accent); }
  #fxpicker .cost { color: var(--faint); font-size: 9px; font-variant-numeric: tabular-nums; }
  #ctxmenu .ctxhead { font-size: 9px; color: var(--dim); text-transform: uppercase;
                      letter-spacing: .06em; padding: 3px 9px 5px; }
  #ctxmenu button { display: block; width: 100%; text-align: left; border: 1px solid transparent;
                    background: none; padding: 5px 9px; font-size: 11px; color: var(--ink); }
  #ctxmenu button:hover { background: var(--hover); border-color: transparent; color: var(--accent); }
  /* ---- The on-screen keyboard -----------------------------------------------
     A floating window, not a menu: it stays open while you work on a channel, so
     nothing about it is dismiss-on-click. Above the pickers in the stack because
     they are things you open, use and close, and this is a thing you play. */
  /* Three pictures, three panels, drawn to the same recipe: solid shapes in currentColor,
     with anything that should read as a gap cut out as a HOLE (`fill-rule: evenodd`)
     rather than painted in the panel's colour. A hole is whatever is behind the icon, so
     it survives the button lighting up teal — a second colour would go light-on-light
     there and the picture would vanish at exactly the moment it is telling you something. */
  .oskicon .body, .seqicon .body, .rollicon .body { fill: currentColor; }
  /* ---- MIDI in ---------------------------------------------------------------------
     A five-pin DIN, which is what the socket on the back of a MIDI keyboard looks like.
     Ring stroked, pins filled, both in currentColor — and NO colour rule of its own for
     the lit state, deliberately. `button.on` already paints the teal background and sets
     `color: var(--on-accent)` for whatever is drawn on it, exactly as it does for the
     four icons beside this one. Overriding `color` here to teal was teal-on-teal: the
     button lit up as a solid block with the socket invisible inside it. */
  .midiicon .ring { fill: none; stroke: currentColor; stroke-width: 1.3; }
  .midiicon .pin { fill: currentColor; stroke: none; }

  /* ---- Record ----------------------------------------------------------------------
     The colour is the state, and there are only two worth telling apart at a glance:
     a red dot sitting in the row like every other button, and — while it is actually
     writing — the whole button red with a white dot in it. That is what a record button
     has looked like since tape, and it reads from across the room without being read.

     `--hot` rather than a hand-picked red: it is the desk's own red, defined in all nine
     themes including the parchment ones, and it is already the playhead's colour. */
  .recicon .body { fill: var(--hot); }
  /* Armed but not rolling — the transport has not started yet. Still the red-dot-on-black
     resting look, with the ring lit and the dot breathing to say it is waiting on you. */
  #recbtn.on { border-color: var(--hot); }
  #recbtn.on .body { animation: recpulse 1.4s ease-in-out infinite; }
  /* Rolling. White on red: the one state that should never be mistaken for any other. */
  #recbtn.live { background: var(--hot); border-color: var(--hot); }
  #recbtn.live .body { fill: #fff; animation: recpulse 1s ease-in-out infinite; }
  /* The count rides on the corner rather than widening the button: the header has no
     room to grow, and a number that pushed everything along as you played would move the
     buttons out from under the pointer. Only ever drawn while a take is running. */
  #recbtn { width: var(--ctlh); height: var(--ctlh); padding: 0; position: relative;
            border-radius: 6px; border-color: transparent;
            background: var(--traybtn); color: var(--ink); }
  #recbtn:hover { background: var(--traybtn-hi); border-color: transparent; color: #fff; }
  #recbtn svg { width: var(--ctlicon); height: var(--ctlicon); fill: currentColor; }
  #recbtn[data-count]:not([data-count=""])::after {
    content: attr(data-count); position: absolute; top: -5px; right: -5px;
    min-width: 13px; padding: 0 2px; border-radius: 7px;
    background: var(--hot); color: #fff;
    font: 700 9px/13px ui-monospace, SFMono-Regular, Menlo, monospace;
    text-align: center; pointer-events: none;
    box-shadow: 0 0 0 1.5px var(--panel);
  }
  @media (prefers-reduced-motion: reduce) {
    #recbtn.on .body, #recbtn.live .body { animation: none; }
  }
  #osk { position: fixed; z-index: 14; display: none; left: 0; top: 0;
         background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
         box-shadow: 0 18px 44px color-mix(in srgb, var(--deep) 66%, transparent); user-select: none; }
  #osk.show { display: block; }
  /* ---- docked along the bottom of the preset library --------------------------
     Its second home. Floating it is a window you place; here it is the bottom band of
     a workspace, so it gives up the frame, the shadow and the position entirely — a
     `position: fixed` left/top on a node inside a flex row puts it somewhere else. */
  #osk.docked { position: static; background: none; border: none; border-radius: 0;
                box-shadow: none;
                /* The band is the width of the workspace, not of the keys in it. A scale
                   with few notes no longer stretches to fill the slot — see
                   DOCK_KEY_MAX — and without this the whole thing shrank to the
                   keyboard, taking the title bar and the fold mark on the right of it
                   left along with the keys. The chrome stays put; only the keys get
                   shorter. */
                width: 100%; }
  /* Left-aligned, so the title starts on the same x as the first white key below it and
     the band reads as one object rather than as a caption floating over a keyboard.
     Centring it put the name off the left edge entirely once the keys got wide. */
  #osk.docked .oskhead { border-bottom: none; cursor: default; padding: 0 2px 5px; }
  /* Title left with the keys, buttons in the middle of the band, fold mark on the right.
     Two spacers of equal flex is what centres the middle group without it caring how
     wide the title on the left happens to be — a preset called `DS Crack Snare` would
     otherwise shove the buttons off-centre by the difference. */
  /* The fold stays out of the flow, pinned right, with padding held back for it: it is
     the end of the row rather than another item in it. Docked only — floating, the ✕ is
     an ordinary item at the end of the row. */
  #osk.docked .oskhead { position: relative; padding-right: 34px; }
  #osk.docked .oskfold { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); }
  /* Every button in this band is the same control at the same size, with its label in
     the middle of it — the desk's own button, which is what the editor's Revert/Delete
     row beside it is too. Sized to the label rather than to the row: `flex: none` is
     what stops a flex child from being handed the leftover width. */
  #osk.docked .oskhead button {
    flex: none; width: auto; min-width: 74px; padding: 4px 10px;
    font-size: 10px; text-align: center;
    /* The same fill and frame as the editor's Revert/Delete row a few pixels to the
       right — they are the same kind of control and sat side by side looking like two
       different toolkits. */
    background: var(--panel2); border-color: var(--line2); }
  #osk.docked .oskhead button:hover {
    background: var(--hover); border-color: var(--accent); }
  /* Selected is selected, and it is the desk's own mark for it. The fill above carries an
     element selector and so out-specifies `button.on` — which set the label to near-black
     for an accent face it no longer had, leaving MIDI and Keyboard switched ON in dark
     ink on this band's dark grey. Unreadable, and not what any other on control here
     looks like. */
  #osk.docked .oskhead button.on, #osk.docked .oskhead button.on:hover {
    background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  /* The steppers are a glyph, not a word, so they are sized to the glyph. Written with
     the parent class so they out-specify the rule above — `#osk.docked .oskhead button`
     carries an element selector, which a plain `#osk.docked .oskup` cannot beat. */
  #osk.docked .oskhead .oskdown, #osk.docked .oskhead .oskup { min-width: 34px; padding: 4px 0; }
  /* And the fold is not a labelled button at all — it keeps its shared 28px square, or
     the 74px minimum above makes it wide enough to sit under the button beside it. */
  #osk.docked .oskhead .oskfold { min-width: 0; width: 28px; padding: 0; }
  /* Neither of these is a menu, and `.devlink`'s caret would say they were. */
  #osk.docked button::after { content: none; }
  /* Folds down, and says so. Same mark as the editor's — see foldIcon. */
  #osk .oskfold { line-height: 0; color: var(--dim); background: none; border: none; }
  #osk .oskfold:hover { color: var(--accent); background: none; }
  #osk .oskfold::after { content: none; }

  /* ---- the fold mark ----------------------------------------------------------
     Two hard mitred angles, drawn rather than typed. A `›` inherits the font's weight
     and its idea of a corner, which at this size is thin and soft and reads as
     decoration; this reads as a control. Square caps and a mitre join on purpose —
     the point of the shape is that the angles are exact. */
  .foldicon { width: 15px; height: 15px; display: block; fill: none;
              stroke: currentColor; stroke-width: 2.4;
              stroke-linecap: square; stroke-linejoin: miter; }
  /* One chevron is a stepper; two is a panel. The pair is a toggle: `»` reveals the
     editor, `«` puts it away, and the same two rotated a quarter turn do the keyboard.
     So one shape means "this panel", and which way it points means which way it goes. */
  .foldicon.fold-left { transform: rotate(180deg); }
  .foldicon.fold-down { transform: rotate(90deg); }
  .foldicon.fold-up { transform: rotate(-90deg); }
  /* On the strip header, where the pencil was. A ✎ says "edit something"; this says
     "the editor opens, over there" — which is the thing the button actually does, and
     it is the same mark that closes it again. */
  .stripedit .foldicon { width: 13px; height: 13px; stroke-width: 2.6; }
  /* No heights here any more, for either board. A key is a shape — KEY_W by KEY_H, with
     the black one inside it — and the builder scales that whole set by whatever width the
     band gave it, so both boards are the same instrument at two sizes. Two hard-coded
     pairs of heights is what made the docked one a stub: its keys are wider than the
     floating board's, and the same 132px against 49 across is not the same key as 132
     against 39. See buildOskKeys.
     Only the type is still set here, and it does NOT scale: the labels are read at the
     size labels are read at, whatever the key under them is doing. */
  #osk.docked .oskkeys { margin: 0; }
  #osk.docked .oskname { font-size: 10px; }
  #osk.docked .oskletter { font-size: 9px; line-height: 11px; height: 11px;
                           margin-bottom: 7px; }
  /* Pads never dock — they are drawn for a percussion CHANNEL and the bench always
     draws keys (see oskIsKit) — so they keep the scale they had. */
  #osk.docked .oskpads { zoom: 1.35; margin: 0; }
  /* ONE row, wherever the keyboard is: name, octave, range, key, and the two buttons that
     say what plays it. Docked was already this; floating was a title bar with a control
     row under it, which is two bands to scan where there is width for one and made the
     same keyboard a different panel depending on where it was sitting. See buildOsk.
     `flex-wrap` is the out: at a width that cannot take the row it becomes two, which is
     where the floating board started rather than a layout that breaks. */
  #osk .oskhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
                  padding: 6px 7px 6px 10px;
                  border-bottom: 1px solid var(--line); cursor: grab; }
  #osk .oskhead.dragging { cursor: grabbing; }
  /* The name takes the left and every control takes the right, held apart by `.sp`. Sized
     to itself, not to the row: without `flex: none` the octave group slides along by
     however many characters the preset happens to be called, and picking a different one
     moves the button you were about to press. */
  #osk .osktitle { flex: none; font-size: 11px; color: var(--ink); font-weight: 700;
                   text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  /* Why nothing is coming out — muted, or not the soloed channel. Only drawn when
     there is something to say, and in the title bar rather than as a caption. */
  #osk .oskwarn { font-size: 9px; color: var(--solo); text-transform: uppercase;
                  letter-spacing: .05em; white-space: nowrap; }
  #osk .sp { flex: 1; min-width: 12px; }
  #osk .oskcatch, #osk .oskmidi, #osk .oskrec { font-size: 10px; padding: 3px 8px; }
  /* ---- record ------------------------------------------------------------------
     Two states that must not look alike: ARMED is waiting for the transport, LIVE is
     writing notes into the song. Amber then red, which are `--solo` and `--hot` — the
     desk's own two state colours, defined in every one of the nine themes including the
     light ones. A third colour invented here would be a third thing to learn, and a
     hand-picked red is the one that goes illegible on the parchment themes.

     The dot is a `::before` rather than a child span on purpose: the buffered count is
     written with `textContent`, which would take a child element out with it every time
     a note landed. */
  #osk .oskrec { font-variant-numeric: tabular-nums; }
  #osk .oskrec::before { content: ''; display: inline-block; width: 7px; height: 7px;
                         border-radius: 50%; margin-right: 5px; vertical-align: baseline;
                         border: 1.5px solid currentColor; box-sizing: border-box; }
  #osk .oskrec.on { color: var(--solo); border-color: var(--solo); }
  #osk .oskrec.live { color: var(--hot); border-color: var(--hot); }
  /* Filled only once it is actually recording — hollow reads as "ready", solid as "on",
     and that is the whole distinction the two states are asking you to make. */
  #osk .oskrec.live::before { background: currentColor; animation: recpulse 1s ease-in-out infinite; }
  @keyframes recpulse { 50% { opacity: .25; } }
  /* The window itself, so the state is legible from wherever your eyes are — you are
     looking at your hands or at the timeline, not at one button in a title bar. */
  #osk.recording { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot), 0 10px 34px #0009; }
  @media (prefers-reduced-motion: reduce) {
    #osk .oskrec.live::before { animation: none; }
  }
  #osk .oskclose { padding: 2px 5px; line-height: 0; border-color: transparent;
                   background: none; color: var(--dim); }
  #osk .oskclose:hover { color: var(--hot); border-color: transparent; }
  #osk .oskclose .pwr { width: 12px; height: 12px; fill: none; stroke: currentColor;
                        stroke-width: 1.5; stroke-linecap: round; }
  /* The steppers, wherever they are drawn. `.oskctl` is the box they are BUILT in and it
     is never appended to anything — see buildOsk — so a rule hung off it styled nothing. */
  #osk .oskdown, #osk .oskup { padding: 2px 8px; font-size: 10px; line-height: 1.4; }
  #osk .oskoct { font-size: 11px; color: var(--accent); font-weight: 700;
                 font-variant-numeric: tabular-nums; min-width: 26px; text-align: center; }
  /* `C2 – C5` is one reading, not three lines: in a flex row it otherwise takes the
     narrowest box it can and stacks. It sits with the octave it describes rather than
     being pushed to the far end — with one row there is no far end to push it to. */
  #osk .oskrange { font-size: 10px; color: var(--dim); white-space: nowrap; }
  /* The key to play in. Two controls with one label over the pair — they are one
     setting asked as two questions.
     Air either side of it, so it reads as its own thing. The row is one 10px gap between
     every item, which makes eight controls in a line with nothing saying which belong
     together — and there are three groups in it: the octave with the range it describes,
     the key, and the two buttons that say what plays it. A wider gap at each seam is the
     whole separation; a rule or a divider would be drawing a line where a space says it.
     One margin per SEAM, not one per group — a matching margin on the scale's RIGHT would
     add to MIDI's rather than replace it, and that seam came out 34px against 26. Each
     seam is named once: the scale opens the middle group, MIDI opens the last. */
  #osk .oskscale { display: flex; align-items: center; gap: 5px; margin-left: 16px; }
  #osk .oskmidi { margin-left: 16px; }
  #osk .oskscalek { font-size: 9px; letter-spacing: .06em; text-transform: uppercase;
                    color: var(--dim); white-space: nowrap; }
  #osk .oskroot { width: 52px; font-size: 10px; padding: 3px 4px; }
  #osk .oskscalekind { width: 122px; font-size: 10px; padding: 3px 4px; }
  #osk .oskroot:disabled { opacity: .4; }
  /* Outside the key: still a key, still plays, just not one of the ones you are aiming
     for. Enough contrast to scan past, not so little that it reads as broken or
     disabled — a greyed-out key on a keyboard means "this will not sound". */
  /* `offscale` survives for the chromatic-with-a-key case that no longer exists in the
     layout — a key now draws only its own notes, so nothing is off it. Kept because it
     costs nothing and the alternative is a rule that has to be re-derived if the piano
     ever wants a scale drawn over it again. */
  /* ---- every state below paints background-COLOR, never `background` -----------
     The face is a colour PLUS a `background-clip` that keeps it out of the gap either
     side of the key (see .oskkey.white), and the shorthand resets the clip along with
     everything else — a lit key would bleed its accent into both gaps and a run of them
     would go back to reading as one bar. Nor does any state touch the border, which is
     what the gap is made of.
     The modelling is `box-shadow`, which no state touches either, so a key keeps its
     shape whatever colour it happens to be wearing. */
  #osk .oskkey.white.offscale { background-color: #9aa2b0; color: #6a7280; }
  #osk .oskkey.white.offscale:hover { background-color: #b6bdc9; }
  #osk .oskkey.black.offscale { background-color: #131519; color: var(--line2); }
  #osk .oskkey.black.offscale:hover { background-color: #1d2127; }
  /* ---- in a key: one kind of key ---------------------------------------------
     A scale has five or seven notes where a piano has twelve, so drawn as a piano it is
     mostly gaps. Uniform keys means every key belongs and none has to be aimed past. The
     root is marked, because the C's are no longer where the octaves visibly start — in A
     minor pentatonic there is no C to count from.
     Nothing about the key ITSELF changes here: same moulded white key, same air either
     side. A scale is this keyboard with the notes you did not want taken out of it, not
     a second instrument that happens to live in the same window. */
  #osk .oskkey.scalekey.tonic { background-color: #c3cbd8; }
  #osk .oskkey.scalekey.tonic:hover { background-color: #d5dce7; }
  #osk .oskkey.scalekey.tonic .oskname { color: #4a525f; font-weight: 700; }
  /* The channel is sounding — whatever it is sounding. A percussion lane's own note
     is nowhere near this keyboard, and "the kick is playing" is still the answer. */
  /* In the title bar, last of the MIDI/Keyboard group, so it takes the row's own gap and
     nothing more. It used to end the control row below with `margin-left: auto`; here
     that would shove it and the fold mark apart — the far end of the bar rather than the
     end of the group it reads for. */
  #osk .oskpulse { width: 7px; height: 7px; border-radius: 50%; background: var(--line2);
                   transition: background .05s ease; }
  #osk .oskpulse.on { background: var(--accent); box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 70%, transparent); }
  /* A note the keyboard cannot show lights the octave button that would reach it. */
  #osk .oskdown.offscreen, #osk .oskup.offscreen { color: var(--accent); border-color: var(--accent); }
  /* ---- the board: a chassis with keys set into it -------------------------------
     Built the way a small MIDI controller is: a dark frame all the way round, and every
     key a separate moulded object with air either side of it. What was here before was
     keys butted edge to edge with a hairline scratched between them — which is how a
     piano is DIAGRAMMED, not how one looks, and at the docked size that hairline was the
     only thing saying where one key ended and the next began.
     `content-box` on purpose. The width is set inline in pixels by the builder and it is
     the width of the KEYS; the frame is a border so it adds around that number rather
     than eating into it. A border is also the only thing that could inset the keys at
     all — they are absolutely positioned, so they lay out from the padding box and
     padding would have moved them nowhere. The 5px is duplicated in JS as OSK_CHASSIS,
     which is what fitDockedKeys has to leave room for; the same bargain KEY_W already
     makes with the inline widths. */
  #osk .oskkeys { position: relative; height: var(--oskwhiteh, 129px); margin: 0 10px 10px;
                  box-sizing: content-box;
                  border: 5px solid var(--deep); border-radius: 9px; background: var(--deep);
                  box-shadow: 0 2px 7px rgba(0,0,0,.5),
                              inset 0 1px 0 rgba(255,255,255,.055); }
  /* Absolute inside a relative box, whites then blacks: the blacks are painted after
     so they sit over their neighbours without a z-index to keep in step. */
  #osk .oskkey { position: absolute; top: 0; border-radius: 2px 2px 5px 5px;
                 display: flex; flex-direction: column; justify-content: flex-end;
                 align-items: center; gap: 2px; padding-bottom: 4px; cursor: pointer; }
  /* ---- a white key --------------------------------------------------------------
     The air either side is a TRANSPARENT BORDER with the face clipped inside it, not a
     narrower key. The layout puts keys on an exact pixel grid — see fitDockedKeys — and
     taking two pixels off each width would have put every face back on a different
     fraction of a pixel, which is the thing that made them look unequal in the first
     place. Done this way the gap is the chassis seen between two keys rather than a line
     painted on them, and the grid survives.
     The moulding is all inset shadow: a shade where the frame overhangs the top, a lip
     along the bottom, a highlight down the left edge. Shadows rather than a gradient
     because `lit` and `sung` repaint the colour and a background-image would have gone
     with it — this way a key keeps its shape the whole time it is sounding. */
  #osk .oskkey.white { height: var(--oskwhiteh, 129px); background-color: #e9ecf2; color: #737b8a;
                       border: none;
                       border-left: 1px solid transparent;
                       border-right: 1px solid transparent;
                       background-clip: padding-box;
                       box-shadow: inset 0 3px 4px -2px rgba(20,26,38,.40),
                                   inset 0 -5px 5px -4px rgba(20,26,38,.45),
                                   inset -3px 0 4px -3px rgba(20,26,38,.30),
                                   inset 1px 0 0 rgba(255,255,255,.55); }
  /* Shorter, darker, and sitting ON the whites rather than between them — so this one
     gets a real drop shadow, which is the whole reason the black row reads as raised
     above the white row instead of as holes cut in it.
     Both heights come in from the builder, scaled off the key width the band gave it —
     see BLACK_H. The white keys' LETTERS are placed off the black one too, so they sit
     just below where the black row ends whatever size the board came out at. The
     fallbacks are the floating board's own numbers, which is what they measure before the
     first build sets them. */
  #osk .oskkey.black { height: var(--oskblackh, 81px); background-color: #171b22; color: #7d8695;
                       border: none; border-radius: 0 0 4px 4px;
                       box-shadow: 0 2px 4px rgba(0,0,0,.55),
                                   inset 0 1px 0 rgba(255,255,255,.10),
                                   inset 0 -6px 6px -4px rgba(0,0,0,.75); }
  #osk .oskkey.white:hover { background-color: #f2f4f8; }
  #osk .oskkey.black:hover { background-color: #232833; }
  /* Two different things light a key, and they must not look the same. `lit` is YOU:
     full accent, the same teal as everything else on this desk that is ON. `sung` is
     the SONG playing through the channel — the same colour a shade back, so a part
     running under your hands reads as the track rather than as your own playing. */
  #osk .oskkey.white.sung { background-color: color-mix(in srgb, var(--accent) 55%, #fff); }
  #osk .oskkey.black.sung { background-color: color-mix(in srgb, var(--accent) 45%, var(--panel)); color: color-mix(in srgb, var(--accent) 26%, #fff); }
  #osk .oskkey.white.lit { background-color: var(--accent); color: var(--on-accent); }
  /* A black key lit in the same bright accent as a white one stops being a black key —
     in a chord the two rows merge into one colour and the shape you are playing
     disappears. So it lights DARKER: unmistakably on, and still the dark row. */
  #osk .oskkey.black.lit { background-color: color-mix(in srgb, var(--accent) 78%, var(--panel)); color: color-mix(in srgb, var(--accent) 14%, #fff); }
  /* ---- two label rows, and a key always has both ------------------------------
     The note name and the letter are stacked bottom-up, so a key with a NAME on it
     pushed its letter up a row while its neighbours' letters stayed on the floor — A sat
     above C2 and S sat beside C2, one row lower. Every seventh letter out of line, which
     is exactly where the eye is trying to count from.
     Only the C's are named, so the row cannot be there only when it is filled: both
     labels keep their line whether or not there is anything on it, and the letters run
     straight across. `flex: none` because an empty box is one a flex column will
     otherwise happily crush back to nothing. */
  #osk .oskname { font-size: 8px; line-height: 10px; height: 10px; flex: none;
                  letter-spacing: .02em; opacity: .8; }
  #osk .oskkey.black .oskname { display: none; }   /* no room, and C# is not the one you hunt for */
  /* Which computer key plays which note — drawn only while the keyboard is catching
     them, because a letter on a key you can only click is a letter that does
     nothing. */
  /* Each kind of key gets its own ink rather than the key's own colour at half
     opacity. Inherited and faded, the letter on a BLACK key was a dark grey at 50% over
     a near-black face — W, E, T, Y and U were, in practice, not there.
     A reminder of which computer key plays which note, glanced at while you learn the
     row and ignored afterwards — so it sits well back from the note name, and further
     back than it used to: smaller, lighter, and lifted clear of the name rather than
     stacked on top of it. On a big key a bold dark letter stops being an annotation and
     starts being what the key says it is.
     The trade is named rather than hidden: these no longer clear 4.5:1 on the white face.
     They are a legend for a keyboard whose keys are also labelled with their notes and
     playable by mouse, not text anything has to be read from — and the alternative was a
     legend loud enough to read the keyboard as. */
  #osk .oskletter { font-size: 8px; line-height: 10px; height: 10px; flex: none;
                    margin-bottom: 4px; font-weight: 500; display: none; }
  #osk.catching .oskletter { display: block; }
  #osk .oskkey.white .oskletter { color: #7f8796; }
  /* The black ones stay where they are. Darker on a near-black face is not "further
     back", it is gone — which is the state W E T Y and U were already rescued from once
     (see above). Recessive there is a job for the dim end of the LIGHT range, and this is
     already at it. */
  #osk .oskkey.black .oskletter { color: #6e7684; }
  /* Up under the black keys, rather than a few pixels off the floor.
     On a tall key the bottom is a long way from anything: a letter down there reads as a
     second caption on the note name instead of as a legend for the key, and the eye has
     to travel the whole key to get from the black row's letters to the white row's. Sat
     just below where the black keys end, the two rows of letters are one band you read
     across — which is what they are, and what they look like on the controller this
     keyboard is drawn after.
     `margin-bottom: auto` is what does it. An auto margin eats the free space before
     `justify-content` gets a look in, so the letter takes its distance from the TOP while
     the note name stays where it was, on the floor of the key. Positioning it from the
     top is the only way to tie it to the black keys, which also start there. */
  #osk .oskkey.white .oskletter { margin-top: calc(var(--oskblackh) + 14px);
                                  margin-bottom: auto; }
  /* Off-key faces are darker again. The black ones only get darker, so the light ink
     holds; the white ones go grey, which eats a mid-tone letter — so theirs goes DARKER
     rather than lighter. Being off the key is said by the face, not by making the label
     hard to read: an unreadable letter on a playable key is just an unreadable letter. */
  #osk .oskkey.white.offscale .oskletter { color: #3d434e; }
  /* Lit and sung repaint the whole key, and the letter goes with them — the accent face
     is bright enough that the key's own dark ink is the readable one. */
  #osk .oskkey.lit .oskletter, #osk .oskkey.white.sung .oskletter { color: inherit; }
  #osk .oskkey.black.sung .oskletter { color: color-mix(in srgb, var(--accent) 14%, #fff); }
  /* A drum channel gets the kit, not a piano: one pad per drum the song has. */
  #osk .oskpads { display: flex; gap: 4px; margin: 10px; }
  #osk .oskpad { width: 62px; height: 62px; border-radius: 5px; background: var(--panel2);
                 border: 1px solid var(--line); display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: 3px; cursor: pointer;
                 color: var(--dim); text-align: center; }
  #osk .oskpad:hover { border-color: var(--accent); color: var(--ink); }
  /* Which one the desk is on. The pads all play; this is the one whose strip and
     effects panel you are looking at. */
  #osk .oskpad.sel { border-color: var(--ctl); color: var(--ink); }
  #osk .oskpad.muted { opacity: .4; }
  #osk .oskpad.sung { background: color-mix(in srgb, var(--accent) 45%, var(--panel)); border-color: color-mix(in srgb, var(--accent) 45%, var(--panel)); color: color-mix(in srgb, var(--accent) 26%, #fff); }
  #osk .oskpad.lit { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  #osk .oskpadname { font-size: 9px; letter-spacing: .04em; line-height: 1.15; padding: 0 3px; }
  #toast {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(8px);
    background: var(--panel2); border: 1px solid var(--accent); color: var(--ink);
    padding: 9px 16px; border-radius: 6px; font-size: 12px; pointer-events: none;
    opacity: 0; transition: opacity .16s, transform .16s; z-index: 8;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- the tooltip ------------------------------------------------------------------
     One card, moved and refilled, for every `data-tip` on the page. The browser's own
     tooltip could not do this job: it is a line of grey system text in the system's font,
     it takes a second and a half to appear, it cannot hold a keyboard shortcut as anything
     but more words, and it is drawn by the OS in a style that has nothing to do with the
     desk it is floating over. Four icon buttons in a row need a NAME and a sentence, and
     the sentence is the whole reason the tooltip exists.

     Shaped like every other floating thing here — panel, hairline, the same shadow as the
     step grid and the keyboard — so it reads as part of the desk rather than as the
     browser interrupting. `pointer-events: none` throughout: a tooltip you can hover is a
     tooltip that fights the button underneath it. */
  #tip { position: fixed; z-index: 50; left: 0; top: 0; display: none;
         max-width: 268px; padding: 9px 11px 10px;
         background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
         box-shadow: 0 14px 34px color-mix(in srgb, var(--deep) 55%, transparent);
         pointer-events: none; opacity: 0; transform: translateY(-3px);
         transition: opacity .12s ease, transform .12s ease; }
  #tip.show { display: block; }
  #tip.in { opacity: 1; transform: none; }
  /* The name and its key on one line: the key is an attribute OF the name, not a third
     thing to read, and putting it out on the right leaves the sentence a clean left edge. */
  #tip .tiphead { display: flex; align-items: baseline; gap: 12px; }
  #tip .tipname { flex: 1; min-width: 0; font-size: 11px; font-weight: 700; color: var(--ink);
                  letter-spacing: .05em; text-transform: uppercase; }
  /* Long-hand rather than the `font` shorthand: `font: 700 9.5px/1.5 inherit` is invalid —
     the shorthand takes no `inherit` in the family slot — and the whole declaration would
     be dropped, leaving a <kbd> in the browser's default monospace. */
  #tip .tipkey { flex: none; font-family: inherit; font-weight: 700; font-size: 9.5px;
                 line-height: 1.5; letter-spacing: .07em;
                 color: var(--accent); padding: 2px 6px; border-radius: 3px;
                 background: color-mix(in srgb, var(--accent) 13%, transparent);
                 border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent); }
  /* The part that is actually worth stopping for. Dim, because the name above it is the
     label and this is the explanation — and set narrow, since a sentence you have to
     track across 400px is a sentence you will not read off a hover. */
  #tip .tipsays { margin-top: 5px; font-size: 10.5px; line-height: 1.45; color: var(--dim); }
  /* A rotated square wearing two of the card's own borders, so the point is the card's
     corner rather than a triangle parked near it. It is placed by `showTip` and not by
     the CSS: the card is clamped to the window and the button is not, so the two part
     company at the ends of the row and only the arrow knows where the button went. */
  #tip .tiparrow { position: absolute; width: 9px; height: 9px; top: -5px;
                   background: var(--panel2); border-radius: 1px 0 0 0;
                   border-left: 1px solid var(--line); border-top: 1px solid var(--line);
                   transform: rotate(45deg); }
  #tip .tiparrow.under { top: auto; bottom: -5px; border-radius: 0 0 1px 0;
                         border-left: 0; border-top: 0;
                         border-right: 1px solid var(--line);
                         border-bottom: 1px solid var(--line); }
  /* Effects panel: sits at the bottom with a fixed height. Border and background
     are on the panel itself since there's no wrapper row. */
  /* Same indent and same gap as every other panel header: the folds run down one
     line on the left edge, so a collapsed desk is identical rows. */
  #devhead { display: flex; align-items: center; gap: var(--capgap);
             padding: 4px var(--rgut) 4px var(--foldx);
             border-bottom: 1px solid var(--line); flex: none; }
  #devrack { flex: 1; min-height: 0; display: flex; gap: 8px;
             padding: 6px var(--rgut) 10px var(--capx);
             overflow-x: scroll; overflow-y: auto; align-items: stretch;
             scrollbar-gutter: stable; }
  #devrack .devempty { align-self: center; }
  /* The channel name after the panel label — "Effects (Bass)", "Notes (Lead)". */
  #devhead #devtitle, #notehead #notetitle { color: var(--dim); font-weight: 400; }
  #devhead #devtitle:empty, #notehead #notetitle:empty { display: none; }

  /* Cards grow SIDEWAYS, not downwards: a long parameter list flows into a second
     column instead of making the panel scroll. The Parametric EQ's ten controls are
     the case that forced it. */
  .device { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px;
            flex: none; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
  .devgrid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(4, min-content);
             grid-auto-columns: 168px; gap: 1px 12px; align-content: start; }
  /* flex: none on both — a flex column shrinks its items when content exceeds the
     box, and the title collapsed to zero height rather than the card scrolling. */
  .device { cursor: default; }
  .devbar { cursor: grab; }
  .devbar:active { cursor: grabbing; }
  .device.dragging { opacity: .4; }
  .device.dropzone { border-color: var(--accent); box-shadow: -3px 0 0 var(--accent); }
  .devbar { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; flex: none; }
  .device h4 { margin: 0; font-size: 10.5px; text-align: center; color: var(--ink);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .devtoggle, .devclose { flex: none; width: 22px; height: 22px; padding: 0; line-height: 1;
                          font-size: 11px; border-radius: 4px; display: grid; place-items: center; }
  .devtoggle { color: var(--faint); }
  .devtoggle .pwr { width: 17px; height: 17px; stroke-width: 1.05; }
  .devtoggle.on { background: var(--primary); color: var(--accent); border-color: var(--accent-line); }
  .devclose { color: var(--dim); }
  .devclose .pwr { width: 16px; height: 16px; }
  .devclose:hover { border-color: var(--hot); color: var(--hot); }
  .device .row { flex: none; margin-bottom: 3px; }
  .checkrow { display: flex; align-items: center; gap: 6px; flex: none;
              font-size: 9px; letter-spacing: .04em; color: var(--dim);
              cursor: pointer; padding: 2px 0 3px; text-transform: uppercase; }
  .checkrow:hover { color: var(--ink); }
  .checkrow input { accent-color: var(--ctl); width: 12px; height: 12px; margin: 0; cursor: pointer; }
  .device .devbtns { display: flex; gap: 3px; margin-top: auto; padding-top: 4px; }
  .device .devbtns button { flex: 1; padding: 2px 0; font-size: 9px; }
  .devempty { color: var(--dim); font-size: 11px; padding: 14px 4px; }
  /* Selection is neutral: a pale edge, not a colour. Teal already means "this is on"
     all over the strip — an accent ring around the whole thing made the selected
     channel look like it was doing something. */
  .strip.selected { border-color: color-mix(in srgb, var(--dim) 82%, var(--panel)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--selected-ink) 30%, transparent); }
  .strip .fxline { font-size: 8.5px; text-align: center; color: var(--faint); cursor: pointer;
                   padding: 3px 2px; margin-top: 4px; border-top: 1px solid var(--line);
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .fxline:hover { color: var(--ink); }
  .strip .fxline.has { color: var(--accent); font-weight: 700; }
  /* Full effect names, wrapping onto as many rows as the chain needs — the button
     IS the label, so there is nothing to abbreviate against. */
  /* content-box so the height JS reserves is exactly the buttons' block: with the
     page-wide border-box the padding ate into it and a single insert overflowed.
     No rule above it — the gap already says where the sends stop and the inserts
     start, and a line across every strip was just another thing to look past. */
  /* Air either side of the insert block: it is a different kind of thing from the
     rows above it and the pot below, and it was reading as part of both. The fader
     is sized from what is left, so it gives up the pixels.

     Only the gap UNDER it is the block's own. The one above it is the foot's padding
     — see .stripfoot — because it is the gap between the rows and the foot whether or
     not the block is in it. Less of it underneath than above, because the block
     already ends in the empty slot: a dashed outline is mostly air, so the separation
     from the fader is drawn rather than reserved, and 22px of margin under it was the
     gap twice. */
  /* Top-aligned: a chain grows downwards from the first slot, so the first slot is
     on the same line on every strip — with the block bottom-aligned, a channel with
     one effect put it level with another channel's third. */
  .fxbtns { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px;
            box-sizing: content-box; margin: 0 0 8px; position: relative; }
  /* Two pixels down: a 23px button in a 27px slot was hard against the top of it, and
     beside a strip whose slot is still an empty outline the two read as different
     heights. With the margin the stack sits centred in the block it is reserved. */
  .fxbtns button { margin-top: 2px; flex: 1 1 100%; height: 23px; padding: 0 4px; font-size: 10px;
                   letter-spacing: .01em; position: relative; display: flex;
                   align-items: center; justify-content: center;
                   background: var(--panel2); color: var(--faint); border-color: var(--line);
                   font-weight: 400; }
  .fxname { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The next insert: one button's worth of dashed outline, under whatever the chain
     already holds, so the second effect is the same click as the first.

     Two ways to see it, because it answers two different questions. On the selected
     strip it is always there — you are working on this channel, and this is where
     the next effect lands. On any other strip it comes up under the pointer, which
     is the moment you are asking. Fourteen of them at once is a grid of empty boxes
     competing with the chains that are actually there, and the rack should read as
     the effects it has. Dimmer on hover than on the strip you are on: one is a
     target you could take, the other is where you already are. */
  .addslot { cursor: pointer; flex: 0 0 100%; box-sizing: border-box; height: 23px; margin-top: 2px;
             border: 1px dashed var(--line2); border-radius: 4px;
             display: grid; place-items: center;
             opacity: 0; transition: opacity .12s ease; }
  .strip:hover .addslot { opacity: .55; }
  .strip.selected .addslot { opacity: 1; }
  /* Over the outline itself: lit, teal, and captioned with the + it will put there. */
  .strip .addslot:hover { opacity: 1; border-color: var(--accent-line); background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .addslot::after { content: '+'; font-size: 17px; font-weight: 400; line-height: 1;
                    color: #fff; opacity: 0; transition: opacity .12s ease; }
  .strip .addslot:hover::after { opacity: 1; }
  /* The power mark appears where the pointer is, over the left of the slot rather
     than in the row: the name stays centred and nothing moves when it turns up.
     A bypassed slot is still legible without it — it goes grey. */
  /* `background: inherit` takes the button's own colour, lit or not, so the mark
     sits on a solid chip and the name underneath cannot bleed through it. A long
     name loses an end while you hover; both are then readable, which is the point. */
  .pwrhit { position: absolute; left: 1px; top: 1px; bottom: 1px; width: 21px;
            display: grid; place-items: center; cursor: pointer; color: var(--faintest);
            background: inherit; border-radius: 4px 3px 3px 4px;
            opacity: 0; transition: opacity .12s ease; }
  .rmhit { position: absolute; right: 1px; top: 1px; bottom: 1px; width: 21px;
           display: grid; place-items: center; cursor: pointer; color: var(--dim);
           background: inherit; border-radius: 3px 4px 4px 3px;
           opacity: 0; transition: opacity .12s ease; }
  .fxbtns button:hover .pwrhit, .fxbtns button:hover .rmhit { opacity: 1; }
  .fxbtns button.on .pwrhit { color: var(--accent); }
  .fxbtns button.dragging { opacity: .4; }
  .fxbtns button.dropzone { border-color: var(--accent); box-shadow: 0 -2px 0 var(--accent); }
  .fxbtns button { cursor: grab; }
  .fxbtns button:active { cursor: grabbing; }
  .pwrhit:hover { color: #fff; }
  .rmhit:hover { color: var(--hot); }
  /* The cross is the destructive mark, so it carries a little more weight than the
     power ring beside it. Light until you are actually on it. */
  .cross { stroke-width: 1.7; }
  .pwr { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.1;
         stroke-linecap: round; }
  /* font-weight explicitly, or the global rule for a lit button bolds it: colour is
     enough to say an insert is live, and six bold names is a shouting strip. */
  .fxbtns button.on { background: var(--primary); color: var(--accent); border-color: var(--accent-line);
                      font-weight: 400; }
  .device.bypassed { opacity: .45; border-color: var(--line); }
  /* Which of six cards you just clicked on the strip. */
  @keyframes devflash {
    from { box-shadow: 0 0 0 2px var(--accent); }
    to   { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 0%, transparent); }
  }
  .device.flash { animation: devflash 1.2s ease-out; }
  /* The strip's own device: a send's delay or reverb, the master's limiter. Pinned
     first in the rack and not removable — it is what the strip IS, not something
     someone added to it. Everything to its right is an insert. */
  .device.pinned { border-color: var(--grid); background: var(--panel2); }
  .device.pinned h4 { color: var(--ink); text-align: left; }
  /* The card is not draggable, so its bar does not offer the hand that says it is. */
  .device.pinned .devbar { cursor: default; }
  .devbadge { font-size: 8.5px; color: var(--dim); letter-spacing: .06em; flex: none;
              border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; }
  .devnote { font-size: 9px; color: var(--dim); line-height: 1.35; max-width: 168px;
             margin-top: 2px; }
  /* Same two margins as the header at the other end of the desk.

     margin-top: auto is belt and braces and should never do anything: #desk above
     is the elastic child and there is no free space left for an auto margin to eat.
     If applyDeskChain ever leaves nothing greedy, this keeps the footer down — and
     the gap shows in --bg rather than --panel, so the bug is visible instead of
     looking like a deliberate band of desk. */
  footer { background: var(--panel); border-top: 1px solid var(--line);
           padding: 6px var(--rgut) 6px var(--foldx); margin-top: auto;
           display: flex; gap: 16px; color: var(--dim); font-size: 11px; flex: none; }
  /* An empty <pre> is still a 20px band across the bottom of the desk, and it was
     taking that band out of the channel strips on every run where nothing failed.
     Capped and scrolled: a long stack trace is a page of text, and unbounded it
     would squeeze the desk above it down to its minimums over a runtime error. */
  /* The desk's two margins here too — the trace starts on the same line as the word
     in the footer above it rather than two pixels off it. */
  #err { color: var(--hot); white-space: pre-wrap; font-size: 12px;
         padding: 10px var(--rgut) 10px var(--foldx);
         flex: none; margin: 0; max-height: 30vh; overflow: auto;
         user-select: text; -webkit-user-select: text; }
  #err:empty { display: none; }
  #gate { position: fixed; inset: 0; background: rgba(10,11,14,.94); display: flex;
          align-items: center; justify-content: center; z-index: 9; }
  #gate button { font-size: 15px; padding: 14px 26px; }
  /* The desk's own dialog. A browser confirm() is a system panel that names the
     PORT you are on, cannot be styled, and reads like the page has done something
     wrong; this is the same question asked by the tool asking it. */
  #ask { position: fixed; inset: 0; background: rgba(10,11,14,.72); z-index: 40;
         display: none; align-items: center; justify-content: center; }
  #ask.show { display: flex; }
  #askbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            box-shadow: 0 18px 50px color-mix(in srgb, var(--deep) 60%, transparent); width: min(420px, 90vw); padding: 20px 22px 16px; }
  #asktitle { font-size: 15px; color: var(--ink); margin-bottom: 8px; }
  #askbody { font-size: 12px; color: var(--dim); line-height: 1.5; margin-bottom: 18px; }
  #askbody b { color: var(--ink); font-weight: 500; }
  /* A question that needs a word back rather than a yes. The field is the thing being
     answered, so it gets the room and the ink; Enter still means OK, as it does in
     every other ask. */
  #askbody .askfield { display: block; margin-top: 14px; font-size: 10px; color: var(--dim);
                       text-transform: uppercase; letter-spacing: .06em; }
  /* Input and select share every rule. A select styled only by the browser sat on the
     same LINE as its label while every text field sat under one, so a dialog with both
     read as two different dialogs. */
  #askbody .askfield input, #askbody .askfield select {
                             display: block; width: 100%; box-sizing: border-box;
                             margin-top: 5px; padding: 7px 9px;
                             font: inherit; font-size: 12px; color: var(--ink);
                             background: var(--input); border: 1px solid var(--line);
                             border-radius: 4px; }
  #askbody .askfield input:focus, #askbody .askfield select:focus { outline: none; border-color: var(--accent); }
  /* The desk's own `select { max-width: 320px }` keeps the header's dropdowns off the
     transport. In a dialog it made the two selects 54px shorter than the three inputs
     beside them, which is the whole of what "inconsistent" looked like on screen. */
  #askbody .askfield select { max-width: none; }
  /* A disabled field is showing you a value you are not choosing right now — the
     template's own tempo — so it reads as a readout rather than as a broken box. */
  #askbody .askfield input:disabled { color: var(--dim); background: color-mix(in srgb, var(--input) 55%, transparent); }
  /* The one row where the control comes FIRST: a checkbox with its label beside it is
     the shape every checkbox has, and stacking it would put a tick under a heading. */
  #askbody .askcheck { display: flex; align-items: center; gap: 7px; margin-top: 10px;
                       font-size: 11px; color: var(--ink); text-transform: none; letter-spacing: 0; }
  #askbody .askcheck input { width: auto; margin: 0; padding: 0; accent-color: var(--accent); }
  /* `display` above outranks the UA stylesheet's `[hidden] { display: none }`, so a row
     the dialog hides — the style of a Blank song — would go on being drawn. */
  #askbody .askfield[hidden], #askbody .askcheck[hidden] { display: none; }
  #askrow { display: flex; gap: 8px; justify-content: flex-end; }
  #askrow button { padding: 7px 16px; font-size: 12px; }
  #askok { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #askok:hover { filter: brightness(1.1); }
</style>

<header>

    <button id="oskbtn" class="iconbtn" aria-label="On-screen keyboard"
            data-tip="Keyboard"
            data-tipsays="Play the selected channel by hand — two octaves for a melodic track, the song’s own kit for a drum one. A window: it stays open, and shows what the channel is playing while the song runs.">
      <!-- One path, even-odd: the body is solid and the keys are HOLES in it, so the
           black keys are whatever is behind the icon. That is what makes it read on
           the panel and still read when the button lights up teal — a shape drawn in
           currentColor would go light-on-light there and the piano would vanish.
           The white keys divide only below the black ones, which is the half of a
           piano you can actually see. -->
      <svg viewBox="0 0 16 16" class="oskicon">
        <path class="body" fill-rule="evenodd" d="M3 3.4h10a1.4 1.4 0 0 1 1.4 1.4v6.4a1.4 1.4 0 0 1-1.4 1.4H3a1.4 1.4 0 0 1-1.4-1.4V4.8A1.4 1.4 0 0 1 3 3.4Zm1.7 0h2.2v5.4H4.7Zm4.4 0h2.2v5.4H9.1ZM5.35 8.9h.9v3.7h-.9Zm4.4 0h.9v3.7h-.9Z"/>

         panel; they are two panels now and either can be up without the other, so a
         single control could not say which — and a toggle that means "whichever of these
         two the selected channel deserves" is a control you have to think about before
         you press it.

         The step grid, drawn as what it is: a channel rack, four beats across and three
         lanes down, with the hits filled and the rests hollow. That is the same reading
         the grid itself asks for, so the icon is a small picture of the panel rather than
         a symbol to learn — and the dim layer under the lit one is exactly how the panel
         draws an empty step. -->
    <button id="seqbtn" class="iconbtn" aria-label="Step grid"
            data-tip="Step grid" data-tipkey="G"
            data-tipsays="What the KIT plays, sixteen squares a bar, across the bars you have selected. A window you can drag — leave it open beside the piano roll.">
      <svg viewBox="0 0 16 16" class="seqicon">
        <path class="body" opacity=".32" d="M1 2.9h2.9v2.9H1Zm3.7 0h2.9v2.9H4.7Zm3.7 0h2.9v2.9H8.4Zm3.7 0H15v2.9h-2.9ZM1 6.6h2.9v2.9H1Zm3.7 0h2.9v2.9H4.7Zm3.7 0h2.9v2.9H8.4Zm3.7 0H15v2.9h-2.9ZM1 10.3h2.9v2.9H1Zm3.7 0h2.9v2.9H4.7Zm3.7 0h2.9v2.9H8.4Zm3.7 0H15v2.9h-2.9Z"/>
        <path class="body" d="M1 2.9h2.9v2.9H1Zm7.4 0h2.9v2.9H8.4ZM4.7 6.6h2.9v2.9H4.7Zm7.4 0H15v2.9h-2.9ZM1 10.3h2.9v2.9H1Zm7.4 0h2.9v2.9H8.4Z"/>
      </svg>

    <button id="rollbtn" class="iconbtn" aria-label="Piano roll"

        <rect class="body" x="5.4" y="2.8" width="5.1" height="2" rx=".9"/>
        <rect class="body" x="7.6" y="5.8" width="7" height="2" rx=".9"/>

    </button>

            data-tipsays="Every voice in the game, with no song in front of it: pick one, edit it, hear it on a bench of its own, then send it to a channel.">

      <svg viewBox="0 0 16 16" class="midiicon" aria-hidden="true">

       its own state: disabled, dimmed and reading "Saved — matches the file" when
       there is nothing to write, rather than a live button that answers with a toast.
       updateStatus() sets both. -->
  <!-- One song, always: this drawer is headed "this song" and it means it. There is
       deliberately no "save every changed song" — writing several mixes in one go
       writes most of them from memory rather than from listening. -->

       Revert above goes to what is on disk NOW; this goes to what was on disk before
       one of this desk's earlier saves, from the copies kept in .mix-history/.
       Loads into the draft, so it is audible and undoable before it is written — and
       only ever into THIS song's draft, whichever save the copy was taken for. -->
  <button id="history" title="Put this song back to an earlier saved version — this song only, no other is touched">Open an earlier version…</button>
  <button id="resetsong">Zero every channel</button>
  <button id="deletesong" class="dangeraction" title="Permanently remove this scratch source and its desk history" hidden>Delete scratch song…</button>
  </section>

  <button id="auditionwav" title="Render this song and open it in tools/audition — a real AU plugin over it, its own GUI, previewed before you keep it">Audition through a plugin…</button>

       one song's balance could land on another's parts. A mix is balanced by ear
       against the song it was written for and means nothing on any other, so the desk
       has no way to move one. This is a copy of your unsaved drafts, and that is all.

       The way BACK is "Open an earlier version…" above, which reads .mix-history/ and
       is song-locked by construction. This file is the copy you keep somewhere the
       desk cannot reach — the one that survives a bad save, a cleared browser or a

  <button id="exportjson" title="Save this song's mix and pattern edits to a JSON file you name — a copy the desk cannot lose">Export edits as JSON…</button>

  </section>

[ and ] nudge it by 10 while the song plays, which is the easier way to find it.">

</section>
