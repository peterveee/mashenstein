<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MASHENSTEIN — __HEADING_TC__</title>
<style>
  :root { --bg:#0b0b14; --panel:#15151f; --panel2:#1a1a28; --line:#2a2a3a; --ink:#e0e0e8; --dim:#8a8a9e;
          --accent:#f6d33c; --accent-soft:rgba(246,211,60,0.1); }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink);
               font:13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { background-image:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(246,211,60,0.05), transparent); }
  header { position:sticky; top:0; z-index:10; background:rgba(11,11,20,0.94);
           backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 20px; }
  h1 { margin:0 0 8px; font-size:15px; letter-spacing:0.08em; font-weight:600;
       background:linear-gradient(90deg, var(--accent), #ffe98a); -webkit-background-clip:text;
       background-clip:text; color:transparent; }
  h1 small { color:var(--dim); font-weight:normal; letter-spacing:0; margin-left:10px; }
  .controls { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .controls label { display:flex; gap:6px; align-items:center; color:var(--dim); cursor:pointer; }
  .controls select, .controls button, .controls input[type=search] {
    background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:5px;
    padding:3px 8px; font:inherit; }
  .controls button { color:var(--dim); cursor:pointer; }
  .controls button:hover { color:var(--accent); border-color:var(--accent); }
  /* Grid, not flex-wrap: a ragged wrap sizes every pill to its own text, so
     nothing lines up and a short title next to a long one reads as noise.
     Fixed-width columns put every pill's left edge, and every count badge's
     right edge, on a shared line — the thing that actually makes a list of
     thirty section names scannable. */
  nav { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:5px 10px; margin-top:8px; }
  nav a { display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0;
          color:var(--dim); text-decoration:none; padding:3px 10px; border:1px solid var(--line); border-radius:6px;
          overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
          transition:color .12s ease, border-color .12s ease, background .12s ease; }
  nav a:hover { color:var(--accent); border-color:var(--accent); }
  nav a.active { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  nav a .nav-count { opacity:0.55; font-size:9px; margin-left:5px; flex-shrink:0; }
  .pages { display:flex; gap:8px; margin:0 0 10px; }
  .pages a { color:var(--dim); text-decoration:none; font-size:11px; letter-spacing:0.1em;
             text-transform:uppercase; padding:3px 11px; border:1px solid var(--line); border-radius:5px;
             transition:color .12s ease, border-color .12s ease, background .12s ease; }
  .pages a:hover { color:var(--accent); border-color:var(--accent); }
  body[data-gallery=main] #page-main, body[data-gallery=lab] #page-lab {
    color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  main { padding:20px; }
  section { margin-bottom:34px; }
  section > h2 { font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent);
                 border-bottom:1px solid var(--line); padding-bottom:6px; margin:0 0 4px; scroll-margin-top:120px;
                 cursor:pointer; user-select:none; display:flex; align-items:center; gap:7px; }
  section > h2::before { content:'▾'; font-size:9px; color:var(--dim); display:inline-block;
                         transition:transform .15s ease; }
  section.collapsed > h2::before { transform:rotate(-90deg); }
  section.collapsed > h2 { color:var(--dim); }
  section.collapsed > *:not(h2) { display:none; }
  body.filtering section.collapsed > .grid { display:flex; }
  body.filtering section.collapsed > p.note, body.filtering section.collapsed > h3.subhead { display:block; }
  /* Lab sections only — when a bake-off was opened, so a scroll down the page
     reads oldest to newest. Not part of the heading's own uppercase run. */
  section > h2 .section-date { color:var(--dim); font-size:10px; letter-spacing:0.08em;
                                text-transform:none; font-weight:normal; margin-left:3px; opacity:0.75; }
  section > p.note { color:var(--dim); margin:0 0 12px; }
  h3.subhead { font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim);
               font-weight:normal; margin:16px 0 8px; }
  h3.subhead:first-of-type { margin-top:4px; }
  .grid { display:flex; flex-wrap:wrap; gap:10px; }
  /* Honest sizes mean some comparison strips are simply wider than the window —
     a 480px frame at the 3x screen scale is already 1440px. `safe center` keeps
     them centred while they fit and switches to start-aligned once they do not,
     so the left edge stays reachable; overflow-x scrolls the oversized ones
     INSIDE their own card rather than dragging the whole page sideways. The
     alternative — shrinking them to fit — is the flattery this page exists to
     avoid. */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px;
          display:flex; flex-direction:column; align-items:safe center; gap:6px;
          max-width:100%; overflow-x:auto;
          transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .card:hover { transform:translateY(-2px); border-color:#454564; box-shadow:0 8px 20px rgba(0,0,0,0.4); }
  .card canvas { display:block; image-rendering:auto; border-radius:3px; cursor:pointer; }
  /* The game is resolution-independent (see renderer.js: the frame renders on a
     density ladder up to native and presents with imageRendering 'auto'), so
     smooth is the honest default here. Only genuine pre-rendered rasters —
     WORLD_SPRITES pixel grids — opt back into nearest-neighbour. */
  .card canvas.pixel-preview { image-rendering:pixelated; }
  /* The pixelate toggle forces the old blocky inspection mode across the whole
     page: still useful for counting samples at 16x, just no longer the truth. */
  body.pixelate .card canvas { image-rendering:pixelated; }
  /* The caption WRAPS TO THE PICTURE instead of setting the card's width.
     A card is a flex column sized to its widest child, and a one-line note is
     as wide as the sentence — so a 132px tile with a long note came out a
     600px card and three of them filled a row. `width:0` takes the text out of
     the intrinsic-width calculation entirely; `min-width` puts it back at the
     card's own width, with a 150px floor so a small tile's caption does not
     end up one word per line. */
  .card .name { color:var(--dim); font-size:11px; text-align:center;
                width:0; min-width:max(100%, 150px); max-width:100%;
                word-break:break-word; }
  .card .name b { color:var(--ink); font-weight:normal; }
  .card.wide { width:100%; }
  .card.err { border-color:#e04848; }
  .card.err:hover { border-color:#e04848; }
  .card.err .name { color:#e04848; }
  /* Swatch backdrops behind transparent art. */
  .bg-dark canvas   { background:#12121c; }
  .bg-light canvas  { background:#d8d8e4; }
  .bg-checker canvas{ background-color:#7a7a8a;
    background-image:linear-gradient(45deg,#5a5a6a 25%,transparent 25%,transparent 75%,#5a5a6a 75%),
                     linear-gradient(45deg,#5a5a6a 25%,transparent 25%,transparent 75%,#5a5a6a 75%);
    background-size:12px 12px; background-position:0 0, 6px 6px; }
  .bg-none canvas   { background:transparent; }
  #err { color:#e04848; white-space:pre-wrap; padding:20px; font-size:12px; }
  /* Lab-only prune picker: tick a nav pill, review, copy the command. See the
     "prune (lab)" block in gallery-entry.js — nothing here touches a file. */
  .prune-item { display:flex; align-items:center; gap:5px; min-width:0; }
  .prune-item a { flex:1; min-width:0; }
  .prune-check { accent-color:var(--accent); cursor:pointer; width:13px; height:13px; }
  #prune-bar { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:center;
               gap:12px; padding:10px 20px; background:rgba(24,12,12,0.95); backdrop-filter:blur(8px);
               border-top:1px solid #5a2a2a; font:inherit; }
  /* The #prune-bar ID rule above outranks the UA [hidden] rule on specificity,
     so `.hidden = true` alone does nothing without this. */
  #prune-bar[hidden] { display:none; }
  #prune-bar .prune-count { color:#ff8a8a; font-weight:600; }
  #prune-bar button { background:var(--panel2); color:var(--ink); border:1px solid var(--line);
                       border-radius:5px; padding:5px 12px; font:inherit; cursor:pointer; }
  #prune-bar button:hover { border-color:var(--accent); color:var(--accent); }
  #prune-bar button.danger { border-color:#e04848; color:#ff8a8a; }
  #prune-bar button.danger:hover { background:#e04848; color:#fff; }
  #prune-modal { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
                 background:rgba(0,0,0,0.6); }
  #prune-modal[hidden] { display:none; }
  #prune-modal .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px;
                         padding:20px; max-width:640px; width:calc(100% - 40px); max-height:80vh;
                         overflow:auto; }
  #prune-modal h2 { margin:0 0 10px; font-size:13px; letter-spacing:0.1em; text-transform:uppercase;
                     color:#ff8a8a; }
  #prune-modal p { color:var(--dim); margin:0 0 10px; }
  #prune-modal ul { margin:0 0 14px; padding-left:18px; color:var(--ink); }
  #prune-modal ul li { margin-bottom:6px; }
  #prune-modal ul li .id { color:var(--dim); font-size:11px; }
  #prune-modal textarea { width:100%; min-height:44px; background:var(--panel2); color:var(--ink);
                           border:1px solid var(--line); border-radius:5px; padding:8px; font:inherit;
                           resize:vertical; }
  #prune-modal .actions { display:flex; gap:8px; margin-top:12px; }
  #prune-modal .actions button { background:var(--panel2); color:var(--ink); border:1px solid var(--line);
                                  border-radius:5px; padding:6px 14px; font:inherit; cursor:pointer; }
  #prune-modal .actions button:hover { border-color:var(--accent); color:var(--accent); }
  #prune-modal .hint { font-size:11px; margin-top:10px; margin-bottom:0; }
</style>
</head>
<body data-gallery="__MODE__">
<header>
  <h1>MASHENSTEIN — __HEADING__ <small>__SUBTITLE__</small></h1>
  <!-- Two pages, one bundle: the production reference and the lab live in
       separate files so neither has to be scrolled past to reach the other.
       The hrefs are the dist filenames; tools/archive-gallery.js rewrites them
       to the archived pair's names when a snapshot is copied into galleries/. -->
  <div class="pages">
    <a id="page-main" href="gallery.html">Asset gallery</a>
    <a id="page-lab" href="gallery-lab.html">Lab &amp; bake-offs</a>
    <!-- Not part of this bundle -- a sibling tool (build-screens-gallery.js)
         screenshots the real running game instead of isolated drawables, and
         writes straight to galleries/screens.html rather than dist/. The
         relative path resolves correctly both here (dist/) and once archived
         (galleries/<date>-<sha>.html), one level up either way. -->
    <a id="page-screens" href="../galleries/screens.html">Screen gallery</a>
  </div>
  <div class="controls">
    <label>screen scale
      <!-- Screen pixels per logical frame pixel — the same number the renderer
           computes as min(winW/480, winH/270) when it presents the game. EVERY
           RUNG IS A REAL PRESENTATION or a stated magnifying glass; there is
           nothing in between, and nothing below the smallest screen the game
           ships to. That smallest screen is a landscape iPhone: the 16:9 frame
           letterboxes into the phone's SHORT side, so 393/270 = 1.46 on a 15
           Pro and 375/270 = 1.39 on an SE — 1.4 is the number hud.js already
           sizes its touch targets against. It is the default because it is the
           hardest test in the list: art that reads here reads everywhere.
           3x is the desktop floor — a maximised browser on a 14" laptop
           (1512/480 = 3.15), and the largest scale at which a whole 480x270
           frame still fits the page without a horizontal scroll. Everything
           from 6x up is a magnifying glass, not a preview. -->
      <select id="zoom">
        <option value="1.4">1.4x · iPhone landscape</option>
        <option value="3" selected>3x · 14" laptop</option>
        <option value="4">4x · 1080p full-screen</option>
        <option value="5">5x · 1440p</option>
        <option value="6">6x · inspect</option>
        <option value="8">8x</option>
        <option value="12">12x</option>
        <option value="16">16x</option>
        <option value="24">24x</option>
        <option value="32">32x</option>
      </select>
    </label>
    <label>render
      <!-- Render density, which is NOT the screen scale and NOT the world zoom
           either. The screen scale stretches the finished bitmap; this
           re-renders the vectors denser. World-scale tiles bake in the run's own
           camera on top, so a render of 3 there is 6 samples per world unit — in
           the neighbourhood of what the real frame resolves to on a retina
           display, and the reason 3 is the default. 6x is 1:1 with a retina
           panel at the 3x screen scale, but costs 4x the canvas memory across
           ~470 tiles, so it stays opt-in. There is no 1x rung: nothing in the
           game is ever rasterised that sparsely. -->
      <select id="resolution">
        <option value="3" selected>3x</option>
        <option value="6">6x · retina 1:1</option>
      </select>
    </label>
    <label>backdrop
      <select id="backdrop">
        <option value="checker">checker</option>
        <option value="dark" selected>dark</option>
        <option value="light">light</option>
        <option value="none">none</option>
      </select>
    </label>
    <label><input id="animate" type="checkbox" checked> animate</label>
    <label><input id="slowmo" type="checkbox"> slow</label>
    <label><input id="framenos" type="checkbox"> frame #</label>
    <label><input id="pixelate" type="checkbox"> pixelate</label>
    <label>filter <input id="filter" type="search" placeholder="name…" size="14"></label>
    <button id="collapseAll" type="button">collapse all</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="root"></main>
<div id="err"></div>
<script>
window.addEventListener('error', function (e) {
  document.getElementById('err').textContent =
    'Gallery failed to boot:\n\n' + (e.error && e.error.stack || e.message);
});
</script>
<script>/*__BUNDLE__*/</script>
</body>
</html>
