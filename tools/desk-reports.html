<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MASHENSTEIN — AUDIO REPORTS</title>
<style>
  /* The desk's own palette (tools/desk-shell.html), plus one cool pole for the
     diverging "less than the median" cells. Warm = more of a band, cool = less. */
  :root {
    --bg: #0d1115; --surface: #151b21; --surface-hi: #1d252d;
    --line: #2e3a43; --line-soft: rgba(144, 173, 181, .14);
    --ink: #edf2ef; --dim: #a3b0af; --muted: #687777;
    --mint: #57dfc4; --gold: #f6d35a; --coral: #ff876c; --hazard: #f06a63; --cool: #6fa8ff;
    --display: "Avenir Next", "SF Pro Display", "Helvetica Neue", sans-serif;
    --mono: "SF Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.5 var(--mono); padding-bottom: 48px; }
  header { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line-soft); background: rgba(13, 17, 21, .9); backdrop-filter: blur(18px); }
  .header-inner { max-width: 1240px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .eyebrow { color: var(--muted); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; }
  h1 { margin: 2px 0 0; font: 750 18px/1.05 var(--display); letter-spacing: .08em; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; color: var(--dim); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
  a.chip:hover { color: var(--ink); border-color: var(--mint); }
  .chip.running { color: var(--gold); border-color: rgba(246, 211, 90, .4); background: rgba(246, 211, 90, .07); }
  main { max-width: 1240px; margin: 0 auto; padding: 26px 28px 0; }
  section.report { margin-bottom: 34px; padding: 20px 22px; border: 1px solid var(--line-soft); border-radius: 14px; background: linear-gradient(145deg, rgba(29, 37, 45, .9), rgba(21, 27, 33, .85)); }
  .report-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  h2 { margin: 0; font: 700 20px/1.1 var(--display); letter-spacing: .02em; }
  .when { color: var(--muted); font-size: 11px; }
  .lede { margin: 6px 0 16px; color: var(--dim); font-size: 12px; max-width: 820px; }
  .lede b { color: var(--ink); font-weight: 600; }
  .empty { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  th { text-align: right; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 0 10px 8px; white-space: nowrap; vertical-align: bottom; }
  th .range { display: block; color: var(--muted); font-size: 9px; letter-spacing: .02em; text-transform: none; font-weight: 400; opacity: .8; }
  th:first-child, td:first-child { text-align: left; padding-left: 4px; }
  td { text-align: right; padding: 7px 10px; border-top: 1px solid var(--line-soft); white-space: nowrap; }
  tr.median td { border-top: 1px solid var(--line); color: var(--dim); font-style: italic; }
  tr.divider td { border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding-top: 12px; text-align: left; }
  td.song { font-weight: 600; letter-spacing: .04em; }
  .muted { color: var(--muted); }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); font-size: 9px; letter-spacing: .05em; font-weight: 400; vertical-align: 1px; }
  .tag.gold { color: var(--gold); border-color: rgba(246, 211, 90, .4); }
  .tag.hot { color: var(--hazard); border-color: rgba(240, 106, 99, .45); }

  /* LEVELS: a deviation bar from the -21 line, ±6 dB across the track. */
  .dev { position: relative; width: 180px; height: 16px; margin-left: auto; }
  .dev::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .dev .band { position: absolute; top: 5px; height: 6px; background: rgba(144, 173, 181, .08); }
  .dev .bar { position: absolute; top: 4px; height: 8px; border-radius: 4px; background: var(--dim); }
  .dev .bar.off { background: var(--gold); }
  .next { color: var(--gold); font-weight: 600; }

  /* BASS: diverging cells. Neutral within the flag; three steps per arm. */
  td.cell { min-width: 84px; border-left: 2px solid var(--surface); }
  td.cell .d { display: inline-block; min-width: 26px; margin-left: 6px; font-size: 11px; font-weight: 600; text-align: right; }
  td.up1 { background: rgba(255, 135, 108, .14); } td.up2 { background: rgba(255, 135, 108, .26); } td.up3 { background: rgba(255, 135, 108, .40); }
  td.dn1 { background: rgba(111, 168, 255, .14); } td.dn2 { background: rgba(111, 168, 255, .26); } td.dn3 { background: rgba(111, 168, 255, .40); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: -6px 0 14px; color: var(--dim); font-size: 11px; }
  .legend .ramp { display: inline-flex; gap: 2px; vertical-align: -3px; margin-right: 6px; }
  .legend .ramp i { width: 16px; height: 14px; border-radius: 3px; display: inline-block; }

  /* LANES: share of each low band, one hue — it is a magnitude. */
  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 14px; }
  .lanes > * { min-width: 0; }
  .lane-card { padding: 14px 16px; border: 1px solid var(--line-soft); border-radius: 12px; background: rgba(13, 17, 21, .35); }
  .lane-card h3 { margin: 0 0 2px; font: 700 15px/1.2 var(--display); letter-spacing: .06em; }
  .lane-card .when { display: block; margin-bottom: 10px; }
  .share { display: inline-flex; align-items: center; gap: 7px; }
  .share .track { width: 64px; height: 8px; border-radius: 4px; background: rgba(144, 173, 181, .1); overflow: hidden; }
  .share .fill { height: 100%; border-radius: 4px; background: var(--mint); }
  .share .pct { min-width: 32px; text-align: right; }
  td .lvl { color: var(--muted); font-size: 11px; margin-right: 8px; }

  #tip { position: fixed; z-index: 20; pointer-events: none; max-width: 300px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(21, 27, 33, .97); color: var(--ink); font-size: 11px; line-height: 1.45; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); display: none; white-space: pre-line; }
  [data-tip] { cursor: default; }

  @media (max-width: 780px) {
    .header-inner, main { padding-left: 16px; padding-right: 16px; }
    section.report { padding: 16px 14px; }
    .lanes { grid-template-columns: 1fr; }
    .dev { width: 120px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <div class="eyebrow">the desk / audio</div>
      <h1>AUDIO REPORTS</h1>
    </div>
    <div class="chips">
      <span class="chip running" id="running" hidden></span>
      <a class="chip" href="/">← THE DESK</a>
    </div>
  </div>
</header>
<main>
  <section class="report" id="levels"></section>
  <section class="report" id="bass"></section>
</main>
<div id="tip"></div>
<script>
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'style') n.setAttribute('style', v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : String(k));
  return n;
};
const f1 = (v) => (Number.isFinite(v) ? v.toFixed(1) : '—');
const signed = (v) => (Math.abs(v) < 0.05 ? '0.0' : `${v > 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}`);

function ago(iso) {
  if (!iso) return '';
  const t = new Date(iso);
  const mins = Math.round((Date.now() - t) / 60000);
  const rel = mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : mins < 48 * 60 ? `${Math.round(mins / 60)} h ago` : `${Math.round(mins / 1440)} days ago`;
  return `${rel} · ${t.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' })}`;
}

// ---------------------------------------------------------------- levels --
function drawLevels(r) {
  const root = document.getElementById('levels');
  const head = el('div', { class: 'report-head' }, el('h2', {}, 'Song levels'),
    r ? el('span', { class: 'when' }, `${r.applied ? 'measured and applied' : 'measured'} ${ago(r.at)}`) : null);
  if (!r) {
    root.replaceChildren(head, el('div', { class: 'empty' }, 'Not run yet. SONG LEVELS: MEASURE on the desk renders the nine cabinet songs and fills this in.'));
    return;
  }
  const off = r.rows.filter((x) => x.next != null);
  const lede = el('p', { class: 'lede' },
    'Every cabinet song on one loudness line, so a cue lands the same on every stage. ',
    el('b', {}, `Line: ${f1(r.target)} LUFS`), ` (integrated, gated), deadband ±${r.deadband} dB. `,
    off.length ? el('b', {}, `${off.length} song${off.length === 1 ? '' : 's'} off the line`) : 'All on the line.',
    off.length ? (r.applied ? ' — their masters were written; measure again to confirm they landed.' : ' — SONG LEVELS: APPLY writes the new masters.') : '');
  const RANGE = 6; // dB either side of the line across the bar
  const pos = (db) => 50 + (Math.max(-RANGE, Math.min(RANGE, db)) / RANGE) * 50;
  const rows = r.rows.map((x) => {
    const dev = x.loud - r.target;
    const a = pos(Math.min(0, dev)), b = pos(Math.max(0, dev));
    const isOff = x.next != null;
    const tip = `${x.id}: ${f1(x.loud)} LUFS, ${signed(dev)} dB from the line\npeak ${f1(x.peak)} dBFS · master ${f1(x.master)}`
      + (isOff ? `\n→ master ${f1(x.next)}${x.applied ? ' (written)' : ''}` : '\nwithin the deadband')
      + (x.clips ? '\n** the trim would push the peak past -0.5 dBFS **' : '');
    return el('tr', { 'data-tip': tip },
      el('td', { class: 'song' }, x.id, x.clips ? el('span', { class: 'tag hot' }, 'would clip') : null),
      el('td', {}, el('div', { class: 'dev' },
        el('div', { class: 'band', style: `left:${pos(-r.deadband)}%;width:${pos(r.deadband) - pos(-r.deadband)}%` }),
        el('div', { class: `bar${isOff ? ' off' : ''}`, style: `left:${a}%;width:${Math.max(b - a, 1.2)}%` }))),
      el('td', {}, f1(x.loud)),
      el('td', {}, signed(dev)),
      el('td', { class: 'muted' }, f1(x.peak)),
      el('td', {}, f1(x.master)),
      el('td', {}, isOff ? el('span', { class: 'next' }, `→ ${f1(x.next)}`, x.applied ? el('span', { class: 'tag gold' }, 'written') : null) : el('span', { class: 'muted' }, 'on the line')),
      el('td', { class: 'muted' }, ago(x.at).split(' · ')[0]));
  });
  root.replaceChildren(head, lede, el('div', { class: 'scroll' }, el('table', {},
    el('thead', {}, el('tr', {},
      el('th', {}, 'song'),
      el('th', {}, `vs line`, el('span', { class: 'range' }, `−${RANGE} … +${RANGE} dB`)),
      el('th', {}, 'LUFS'), el('th', {}, 'off by'), el('th', {}, 'peak'),
      el('th', {}, 'master'), el('th', {}, 'new master'), el('th', {}, 'measured'))),
    el('tbody', {}, rows))));
}

// ------------------------------------------------------------------ bass --
const hz = (v) => (v >= 1000 ? `${v / 1000}k` : `${v}`);
function devClass(dev, flag) {
  const a = Math.abs(dev);
  if (a < flag) return '';
  const step = a >= flag * 3 ? 3 : a >= flag * 2 ? 2 : 1;
  return `${dev > 0 ? 'up' : 'dn'}${step}`;
}

function drawBass(r) {
  const root = document.getElementById('bass');
  const head = el('div', { class: 'report-head' }, el('h2', {}, 'Bass & band balance'),
    r ? el('span', { class: 'when' }, `measured ${ago(r.at)}`) : null);
  if (!r) {
    root.replaceChildren(head, el('div', { class: 'empty' }, 'Not run yet. BASS REPORT on the desk fills this in.'));
    return;
  }
  const lede = el('p', { class: 'lede' },
    'Each band’s level relative to the song’s own loudness, so where the master sits does not matter — this is what share of the loudness each part of the spectrum carries. ',
    'Compared with the ', el('b', {}, 'median of the finished cabinets'), ` (${r.finished.join(', ')}); `,
    `a band ${r.flag} dB or more off the median is coloured and signed.`);
  const swatches = (dir) => el('span', { class: 'ramp' }, [1, 2, 3].map((s) => el('i', { class: '', style: `background:${dir === 'up' ? `rgba(255,135,108,${[0.14, 0.26, 0.4][s - 1]})` : `rgba(111,168,255,${[0.14, 0.26, 0.4][s - 1]})`}` })));
  const legend = el('div', { class: 'legend' },
    el('span', {}, swatches('up'), `more than the median (+${r.flag} / +${r.flag * 2} / +${r.flag * 3} dB)`),
    el('span', {}, swatches('dn'), `less than the median`),
    el('span', { class: 'muted' }, 'uncoloured: within the flag'));

  const bandCells = (row) => row.levels.map((v, b) => {
    const dev = v - r.median[b];
    const cls = devClass(dev, r.flag);
    const band = r.bands[b];
    return el('td', {
      class: `cell ${cls}`,
      'data-tip': `${row.id} · ${band.name} ${hz(band.lo)}–${hz(band.hi)} Hz\n${f1(v)} dB vs the song’s loudness\n${signed(dev)} dB vs the median (${f1(r.median[b])})`,
    }, f1(v), el('span', { class: 'd' }, cls ? `${dev > 0 ? '+' : '−'}${Math.abs(dev).toFixed(0)}` : ''));
  });
  const inMedian = r.rows.filter((x) => x.inMedian);
  const others = r.rows.filter((x) => !x.inMedian);
  const songRow = (x) => el('tr', {}, el('td', { class: 'song' }, x.id), ...bandCells(x), el('td', { class: 'muted' }, f1(x.lufs)));
  const body = [
    ...inMedian.map(songRow),
    el('tr', { class: 'median' }, el('td', {}, 'median'), ...r.median.map((v) => el('td', { class: 'cell' }, f1(v), el('span', { class: 'd' }, ''))), el('td', {}, '')),
    ...(others.length ? [el('tr', { class: 'divider' }, el('td', { colspan: r.bands.length + 2 }, 'not in the median')), ...others.map(songRow)] : []),
  ];
  const table = el('div', { class: 'scroll' }, el('table', {},
    el('thead', {}, el('tr', {}, el('th', {}, 'song'),
      ...r.bands.map((b) => el('th', {}, b.name, el('span', { class: 'range' }, `${hz(b.lo)}–${hz(b.hi)} Hz`))),
      el('th', {}, 'LUFS'))),
    el('tbody', {}, body)));

  // Lane breakdowns, newest first. Stale when the song's files changed since.
  const current = Object.fromEntries(r.rows.map((x) => [x.id, x.hash]));
  const laneIds = Object.keys(r.lanes || {}).sort((a, b) => r.lanes[b].at.localeCompare(r.lanes[a].at));
  const low = r.bands.slice(0, r.lowBands);
  const laneCards = laneIds.map((id) => {
    const L = r.lanes[id];
    const stale = current[id] && current[id] !== L.hash;
    return el('div', { class: 'lane-card' },
      el('h3', {}, id, stale ? el('span', { class: 'tag gold', 'data-tip': 'the song, its mix or its arrangement has changed since — run BASS REPORT: LANES again' }, 'mix changed since') : null),
      el('span', { class: 'when' }, `${L.count} lanes soloed ${ago(L.at)} · lanes under 2% of every low band left off`),
      el('div', { class: 'scroll' }, el('table', {},
        el('thead', {}, el('tr', {}, el('th', {}, 'lane'), ...low.map((b) => el('th', {}, `${b.name} share`, el('span', { class: 'range' }, `${hz(b.lo)}–${hz(b.hi)} Hz`))))),
        el('tbody', {}, L.rows.map((row) => el('tr', {},
          el('td', { class: 'song' }, row.key),
          ...row.shares.map((s, b) => el('td', {
            'data-tip': `${id} · ${row.key} · ${low[b].name}\n${s.toFixed(0)}% of the band's energy\n${f1(row.levels[b])} dB vs the song’s loudness`,
          }, el('span', { class: 'share' },
            el('span', { class: 'lvl' }, f1(row.levels[b])),
            el('span', { class: 'track' }, el('span', { class: 'fill', style: `width:${Math.min(100, s)}%;display:block` })),
            el('span', { class: 'pct' }, `${s.toFixed(0)}%`))))))))));
  });
  const lanes = [el('div', { class: 'report-head', style: 'margin-top:26px' }, el('h2', { style: 'font-size:16px' }, 'Who carries the low end')),
    el('p', { class: 'lede' }, 'Each lane soloed (the others muted in a copy of the song’s mix): its share of each low band, and its level against the song’s loudness. The strip with the share is the one a Channel EQ goes on. Soloed lanes hit the master compressor less than the full mix, so on a compressed song the shares are approximate.'),
    laneCards.length ? el('div', { class: 'lanes' }, laneCards) : el('div', { class: 'empty' }, 'No lane breakdowns yet. BASS REPORT: LANES on the desk, with a song id, adds one here.')];

  root.replaceChildren(head, lede, legend, table, ...lanes);
}

// ------------------------------------------------------------- tooltips --
const tip = document.getElementById('tip');
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.textContent = t.getAttribute('data-tip');
  tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${Math.min(e.clientX + 14, innerWidth - w - 8)}px`;
  tip.style.top = `${e.clientY + 16 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 16}px`;
});

// --------------------------------------------------------------- polling --
// Redrawn only when a report file changes, so hovering is not interrupted.
let stamp = '';
let firstDraw = true;
async function refresh() {
  try {
    const { levels, bass, running } = await (await fetch('/api/reports')).json();
    const chip = document.getElementById('running');
    chip.hidden = !running.length;
    chip.textContent = running.length ? `running: ${running.join(', ')}` : '';
    const next = JSON.stringify([levels?.at, bass?.at, Object.values(bass?.lanes || {}).map((l) => l.at)]);
    if (next !== stamp) {
      stamp = next;
      drawLevels(levels);
      drawBass(bass);
      if (firstDraw && location.hash) document.querySelector(location.hash)?.scrollIntoView();
      firstDraw = false;
    }
  } catch (e) {
    document.getElementById('running').hidden = false;
    document.getElementById('running').textContent = 'the desk stopped answering';
  }
}
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
