<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MASHENSTEIN — LEVEL EDITOR</title>
<style>
  :root {
    --bg: #14121a; --panel: #1d1a26; --panel2: #252131; --line: #362f47;
    --ink: #e8e4f0; --dim: #9990ac; --dimmer: #6d6580;
    --hot: #f6d33c; --hazard: #e04848; --reward: #7ce8a0; --route: #72d8f0;
    --check: #b888f0; --setpiece: #f89048;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

  /* ---- top bar ---- */
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 13px; margin: 0; letter-spacing: .12em; color: var(--hot); }
  header .grow { flex: 1; }
  .btn {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    padding: 5px 11px; border-radius: 3px; cursor: pointer; font: inherit;
    letter-spacing: .06em;
  }
  .btn:hover { border-color: var(--dim); }
  .btn.primary { background: var(--hot); color: #1a1710; border-color: var(--hot); font-weight: 700; }
  .btn.primary[disabled] { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; }
  input[type=number], input[type=text], select {
    background: #120f18; color: var(--ink); border: 1px solid var(--line);
    padding: 4px 6px; border-radius: 3px; font: inherit; width: 88px;
  }
  label.field { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  .badge { padding: 3px 8px; border-radius: 10px; font-size: 11px; }
  .badge.ok { background: #1d3326; color: var(--reward); }
  .badge.warn { background: #3a3320; color: var(--hot); }
  .badge.err { background: #3a2020; color: var(--hazard); }
  .badge.dirty { background: #33251d; color: var(--setpiece); }

  /* ---- three panes ---- */
  main { display: grid; grid-template-columns: 210px 1fr 300px; min-height: 0; }
  .rail { background: var(--panel); overflow-y: auto; }
  .rail.left { border-right: 1px solid var(--line); }
  .rail.right { border-left: 1px solid var(--line); }
  .center { overflow-y: auto; padding: 12px; min-width: 0; }

  .cab { border-bottom: 1px solid var(--line); }
  .cab > .cabhead {
    padding: 7px 10px; cursor: pointer; display: flex; justify-content: space-between;
    align-items: baseline; gap: 6px;
  }
  .cab > .cabhead:hover { background: var(--panel2); }
  .cab .name { color: var(--ink); letter-spacing: .05em; }
  .cab .meta { color: var(--dimmer); font-size: 10px; }
  .stage {
    padding: 5px 10px 5px 18px; cursor: pointer; display: flex;
    justify-content: space-between; gap: 6px; color: var(--dim);
  }
  .stage:hover { background: var(--panel2); }
  .stage.sel { background: #2f2740; color: var(--ink); box-shadow: inset 2px 0 0 var(--hot); }
  .stage .tag { font-size: 10px; color: var(--dimmer); }
  .stage .tag.edited { color: var(--setpiece); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-bottom: 10px; }
  .card h2 { font-size: 11px; margin: 0 0 8px; letter-spacing: .12em; color: var(--dim); font-weight: 400; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 11px; }
  .kv dt { color: var(--dimmer); }
  .kv dd { margin: 0; color: var(--ink); }
  .mission { color: var(--dim); font-size: 11px; margin-top: 6px; }

  canvas.lane { display: block; width: 100%; border-radius: 3px; background: #100e15; }
  .lanewrap { margin-bottom: 8px; }
  .lanelabel { font-size: 10px; color: var(--dimmer); letter-spacing: .1em; margin-bottom: 3px; display: flex; justify-content: space-between; }

  .insp { padding: 10px 12px; }
  .insp h2 { font-size: 11px; letter-spacing: .12em; color: var(--hot); margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .row > span.lbl { color: var(--dim); min-width: 82px; }
  .row input[type=range] { flex: 1; }
  .chk { display: flex; align-items: center; gap: 6px; padding: 2px 0; color: var(--dim); cursor: pointer; }
  .chk input { accent-color: var(--hot); }
  .chk.off { color: var(--dimmer); text-decoration: line-through; }
  .grouphead { color: var(--dimmer); font-size: 10px; letter-spacing: .1em; margin: 10px 0 4px; }
  .scroll { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; }
  .msg { font-size: 11px; padding: 6px 8px; border-radius: 3px; margin-bottom: 6px; }
  .msg.warn { background: #302a19; color: var(--hot); }
  .msg.err { background: #301c1c; color: var(--hazard); }
  .hint { color: var(--dimmer); font-size: 10px; margin-top: 8px; line-height: 1.5; }
  .pill { display: inline-block; padding: 1px 6px; border-radius: 8px; background: var(--panel2); color: var(--dim); font-size: 10px; margin: 0 4px 4px 0; }
  .del { color: var(--hazard); cursor: pointer; background: none; border: none; font: inherit; padding: 0 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
